# Certificate bootstrap: keep the business site available over HTTP.
server {
    listen 80 default_server;
    server_name _;
    return 301 http://www.sunfan88.com$request_uri;
}

server {
    listen 80;
    server_name www.sunfan88.com sunfan88.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    include /etc/nginx/pear/app.locations.conf;
}
