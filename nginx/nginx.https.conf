server {
    listen 80 default_server;
    server_name _;
    return 301 https://www.sunfan88.com$request_uri;
}

server {
    listen 80;
    server_name www.sunfan88.com sunfan88.com;

    # Keep HTTP-01 renewal reachable after enabling the HTTP redirect.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    # setup_https.sh changes this from HTTP service to a 301 only after
    # successful certificate-verified local AND public HTTPS probes.
    include /etc/nginx/https-state/http-mode.conf;
}

server {
    listen 443 ssl default_server;
    server_name www.sunfan88.com sunfan88.com;

    ssl_certificate /etc/letsencrypt/live/sunfan88.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sunfan88.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Enable HSTS only after public HTTPS and renewal have been verified.
    # add_header Strict-Transport-Security "max-age=300" always;

    include /etc/nginx/pear/app.locations.conf;
}
