<div class="layui-row layui-col-space15">
  <!-- 左侧项目面板 -->
  <div class="layui-col-md2">
    <div class="project-panel">
      <div class="project-title">
        <i class="layui-icon layui-icon-app" style="margin-right: 8px; color: #1890ff;"></i>项目清单
      </div>
      <div style="padding: 10px 12px 5px 12px;">
        <input type="text" id="inbound-project-search" placeholder="搜索..." autocomplete="off" class="layui-input"
          style="height: 28px; font-size: 12px; border-radius: 4px;">
      </div>
      <div class="project-list-wrapper">
        <div class="project-item active" data-project-id="">
          <i class="layui-icon layui-icon-list"></i>
          <span>全部项目</span>
        </div>
        <div id="inbound-project-list"></div>
      </div>
    </div>
  </div>

  <!-- 右侧主内容区 -->
  <div class="layui-col-md10">
    <div class="main-content">
      <div class="content-header" style="display: flex; justify-content: space-between; align-items: flex-start;">
        <div>
          <div class="content-title" id="content-title">所有项目拟入库计划</div>
          <div class="status-tab">
            <div class="layui-tab layui-tab-brief" lay-filter="status-tab">
              <ul class="layui-tab-title">
                <li class="layui-this" lay-id="pending">待入库 <span class="layui-badge-dot layui-bg-orange"></span></li>
                <li lay-id="completed">已入库</li>
              </ul>
            </div>
          </div>
        </div>
        <div id="inbound-selection-summary"
          style="display: none; background: #fff7e6; border: 1px dashed #fa8c16; padding: 10px 15px; border-radius: 8px; animation: fadeIn 0.3s;">
          <div style="font-size: 13px; color: #fa8c16; margin-bottom: 5px; font-weight: 500;">
            <i class="layui-icon layui-icon-list" style="color: #fa8c16; margin-right: 5px;"></i>已选择内容统计
          </div>
          <div style="display: flex; gap: 20px;">
            <div style="font-size: 12px; color: #555;">合价总计: <span id="total-inbound-amount"
                style="font-weight: 600; color: #f5222d; font-size: 14px;">¥0.00</span></div>
          </div>
        </div>
      </div>
      <table id="inbound-table" lay-filter="inbound-table"></table>
    </div>
  </div>
</div>

<script type="text/html" id="inbound-toolbar">
    <button class="pear-btn pear-btn-primary pear-btn-md" lay-event="add">
        <i class="layui-icon layui-icon-add-1"></i>
        新增入库任务
    </button>
    <button class="pear-btn pear-btn-success pear-btn-md" lay-event="batchConfirm">
        <i class="layui-icon layui-icon-ok"></i>
        批量确认入库
    </button>
    <button class="pear-btn pear-btn-danger pear-btn-md" lay-event="batchDelete">
        <i class="layui-icon layui-icon-delete"></i>
        批量删除
    </button>
  </script>

<script type="text/html" id="operation-bar">
    <button class="pear-btn pear-btn-primary pear-btn-sm" lay-event="edit" title="编辑">
        <i class="layui-icon layui-icon-edit"></i>
    </button>
    <button class="pear-btn pear-btn-danger pear-btn-sm" lay-event="remove" title="删除">
        <i class="layui-icon layui-icon-delete"></i>
    </button>
  </script>


<script>
  layui.use(['table', 'jquery', 'form', 'element', 'layer'], function () {
    var table = layui.table;
    var $ = layui.jquery;
    var form = layui.form;
    var element = layui.element;
    var layer = layui.layer;
    var MODULE_PATH = '/api/v1/material/';

    // Initialize variables
    var serverProjects = [];
    var currentProjectId = '';
    var currentStatus = 'pending';

    // Parse URL parameters
    function getQueryParam(name) {
      var reg = new RegExp("(^|&)" + name + "=([^&]*)(&|$)");
      var r = window.location.search.substr(1).match(reg);
      if (r != null) return decodeURIComponent(r[2]);
      return null;
    }

    var filterMaterialName = getQueryParam('material_name') || '';
    var filterMaterialSpec = getQueryParam('material_spec') || '';
    var urlStatus = getQueryParam('status');
    var urlProjectId = getQueryParam('project_id');

    // Set initial values from URL
    if (urlProjectId) {
      currentProjectId = urlProjectId;
    }

    // Set initial tab selection based on status param
    if (urlStatus === 'completed') {
      currentStatus = 'completed';
      $('.layui-tab-title li[lay-id="pending"]').removeClass('layui-this');
      $('.layui-tab-title li[lay-id="completed"]').addClass('layui-this');
    }

    // If filtering by material/spec, show a badge
    if (filterMaterialName) {
      $('#content-title').html($('#content-title').text() + ' <span class="layui-badge layui-bg-blue">筛选: ' + filterMaterialName + '</span>');
    }

    // Fetch and render projects
    $.ajax({
      url: MODULE_PATH + 'options',
      type: 'GET',
      dataType: 'json',
      success: function (res) {
        if (res.code === 0 && res.data && res.data.projects) {
          serverProjects = res.data.projects;
          renderProjects();

          // If URL has project_id, select it
          if (urlProjectId) {
            var found = serverProjects.find(function (p) { return p.id == urlProjectId; });
            if (found) {
              $('.project-item[data-project-id="' + urlProjectId + '"]').addClass('active');
              $('.project-item[data-project-id=""]').removeClass('active');
              $('#content-title').text(found.name + ' 拟入库计划');
            }
          }
        } else {
          $('#inbound-project-list').html('<div style="padding: 10px; color: #999; text-align: center;">加载失败</div>');
        }
      },
      error: function () {
        $('#inbound-project-list').html('<div style="padding: 10px; color: #999; text-align: center;">加载失败</div>');
      }
    });

    function renderProjects() {
      var val = $('#inbound-project-search').val();
      var searchKeyword = val ? val.toLowerCase().trim() : '';
      var html = '';

      if (!serverProjects || serverProjects.length === 0) {
        $('#inbound-project-list').html('<div style="padding: 10px; color: #999; text-align: center;">暂无项目</div>');
        return;
      }

      serverProjects.forEach(function (p) {
        var pName = p.name || '未命名项目';

        if (searchKeyword && pName.toLowerCase().indexOf(searchKeyword) === -1) {
          return;
        }

        html += '<div class="project-item" data-project-id="' + p.id + '">';
        html += '<i class="layui-icon layui-icon-read"></i>';
        html += '<span>' + pName + '</span>';

        if (p.inbound_count !== undefined && p.inbound_count > 0) {
          html += '<span class="project-count">' + p.inbound_count + '</span>';
        }
        html += '</div>';
      });

      $('#inbound-project-list').html(html);
    }

    // Helper function to select project
    window.selectProject = function (projectId, projectName) {
      if (!projectName && projectId) {
        var found = serverProjects.find(function (p) { return p.id == projectId; });
        if (found) projectName = found.name;
      }

      $('.project-panel .project-item').removeClass('active');
      if (projectId) {
        $('.project-panel .project-item[data-project-id="' + projectId + '"]').addClass('active');
        $('#content-title').text(projectName + ' 拟入库计划');
      } else {
        $('.project-panel .project-item[data-project-id=""]').addClass('active');
        $('#content-title').text('所有项目拟入库计划');
      }
      currentProjectId = projectId || '';
      refreshTable();
    }

    // Bind Search Event (delegated)
    $(document).on('input', '#inbound-project-search', function () {
      renderProjects();
    });

    // Bind project click event (delegated) - Scoped to inbound list container
    // Using .project-panel to include the static "All Projects" item
    $('.project-panel').on('click', '.project-item', function () {
      var pid = $(this).data('project-id');
      var pname = $(this).find('span').first().text();
      selectProject(pid, pname);
    });

    // Table columns definition
    var cols = [[
      { type: 'checkbox' },
      {
        field: 'quick_link', width: 45, align: 'center', unresize: true, templet: function (d) {
          return '<i class="layui-icon layui-icon-link inbound-invoice-link-icon" ' +
            'style="cursor: pointer; color: #1E9FFF; font-size: 16px;" ' +
            'data-id="' + d.id + '" ' +
            'data-batch="' + (d.batch_number || '') + '" ' +
            'data-project-id="' + d.project_id + '" ' +
            'data-inv-id="' + (d.invoice_id || '') + '" ' +
            'title="快速关联"></i>';
        }
      },
      {
        field: 'project_name', title: '项目名称', minWidth: 150, align: 'center', hide: true, templet: function (d) {
          return '<span class="layui-badge layui-bg-cyan" style="cursor: pointer;" onclick="selectProject(' + d.project_id + ')">' + (d.project_name || '-') + '</span>';
        }
      },
      { field: 'material_spec', title: '规格型号', minWidth: 100 },
      { field: 'material_unit', title: '单位', width: 80, align: 'center' },
      {
        field: 'material_name', title: '材料名称', minWidth: 150, templet: function (d) {
          return '<span style="font-weight: bold;">' + d.material_name + '</span>';
        }
      },
      {
        field: 'batch_number',
        title: '批次信息',
        minWidth: 180,
        templet: function (d) {
          return '<div class="batch-cell" style="display: flex; align-items: center; justify-content: space-between;">' +
            '<span class="batch-number">' + (d.batch_number || '-') + '</span>' +
            '<i class="layui-icon layui-icon-edit batch-edit-icon" ' +
            'style="cursor: pointer; color: #1E9FFF; font-size: 14px; margin-left: 5px;" ' +
            'data-id="' + d.id + '" ' +
            'data-batch="' + (d.batch_number || '') + '" ' +
            'title="编辑批次号"></i>' +
            '</div>';
        }
      },
      {
        field: 'supplier_name', title: '供应商', minWidth: 160, templet: function (d) {
          return d.supplier_name ? '<span class="layui-badge layui-bg-blue">' + d.supplier_name + '</span>' : '<span style="color: #ccc;">未指定</span>';
        }
      },
      { field: 'inbound_quantity', title: '入库量', width: 100, align: 'center', style: 'font-weight: bold; color: #009688;' },
      { field: 'inbound_price', title: '单价', width: 100, align: 'center' },
      {
        field: 'inbound_total_amount', title: '合价', width: 120, align: 'center', style: 'color: #f44336; font-weight: bold;',
        templet: function (d) {
          var qty = parseFloat(d.inbound_quantity) || 0;
          var price = parseFloat(d.inbound_price) || 0;
          var total = d.inbound_total_amount ? parseFloat(d.inbound_total_amount) : (qty * price);
          return total > 0 ? '￥' + total.toFixed(2) : '-';
        }
      },
      {
        field: 'status', title: '状态', width: 100, align: 'center', templet: function (d) {
          if (d.status === 'pending') return '<span class="layui-badge layui-bg-orange">待入库</span>';
          if (d.status === 'completed') return '<span class="layui-badge layui-bg-green">已入库</span>';
          return d.status;
        }
      },
      {
        field: 'invoice_number', title: '关联发票', minWidth: 50, templet: function (d) {
          if (!d.invoice_number) {
            return '<div style="display: flex; align-items: center; justify-content: space-between; color: #999;">' +
              '<span>-</span>' +
              '<i class="layui-icon layui-icon-link inbound-invoice-link-icon" ' +
              'style="cursor: pointer; color: #1E9FFF; font-size: 14px;" ' +
              'data-id="' + d.id + '" ' +
              'data-project-id="' + d.project_id + '" ' +
              'data-inv-id="" ' +
              'title="选择关联发票"></i>' +
              '</div>';
          }

          var amt = d.invoice_amount ? parseFloat(d.invoice_amount).toFixed(2) : '0.00';
          var cat = d.invoice_category || '-';

          var html = '<div class="invoice-link-cell" style="padding: 5px 0;">';
          html += '  <div style="display: flex; align-items: center; justify-content: flex-start; gap: 15px; margin-bottom: 4px;">';
          html += '    <div class="invoice-ops" style="display: flex; align-items: center;">';
          html += '      <span style="font-weight: 500; color: #333; margin-right: 8px;">' + d.invoice_number + '</span>';
          if (d.invoice_file_path) {
            html += '      <i class="layui-icon layui-icon-search inbound-invoice-view-icon" ' +
              'style="cursor: pointer; color: #ff5722; font-size: 18px; margin-right: 12px;" ' +
              'data-url="' + d.invoice_file_path + '" ' +
              'title="发票号: ' + d.invoice_number + ' (点击预览)"></i>';
          }
          html += '      <i class="layui-icon layui-icon-link inbound-invoice-link-icon" ' +
            'style="cursor: pointer; color: #1E9FFF; font-size: 16px;" ' +
            'data-id="' + d.id + '" ' +
            'data-project-id="' + d.project_id + '" ' +
            'data-inv-id="' + d.invoice_id + '" ' +
            'title="更改关联发票"></i>';
          html += '    </div>';
          html += '  </div>';
          html += '  <div style="font-size: 12px; color: #888;">';
          html += '    <span style="margin-right: 10px;">金额: <b style="color: #f44336;">￥' + amt + '</b></span>';
          html += '    <span>分类: ' + cat + '</span>';
          html += '  </div>';
          html += '</div>';
          return html;
        }
      },
      { title: '操作', toolbar: '#operation-bar', width: 120, align: 'center' }
    ]];

    // Render table
    table.render({
      elem: '#inbound-table',
      id: 'inbound-table',
      url: MODULE_PATH + 'inbound',
      where: {
        status: currentStatus,
        project_id: currentProjectId,
        material_name: filterMaterialName,
        material_spec: filterMaterialSpec
      },
      page: true,
      limit: 90,
      limits: [30, 60, 90, 150, 300],
      cols: cols,
      skin: 'line',
      cellMinWidth: 100, // 设置全局最小列宽
      toolbar: '#inbound-toolbar',
      defaultToolbar: [{
        title: '刷新',
        layEvent: 'refresh',
        icon: 'layui-icon-refresh',
      }, 'filter', 'print', 'exports'],
      done: function (res, curr, count) {
        mergeCells(res.data, 'batch_number');
        updateInboundSelectionSummary();
      }
    });

    // 合并单元格函数
    function mergeCells(data, field) {
      if (!data || data.length === 0) return;

      var mergeData = {};
      var currentBatch = null;
      var startIndex = 0;

      // 统计每个批次的行数
      for (var i = 0; i < data.length; i++) {
        var batchValue = data[i][field];
        if (batchValue !== currentBatch) {
          if (currentBatch !== null) {
            mergeData[currentBatch] = {
              start: startIndex,
              count: i - startIndex
            };
          }
          currentBatch = batchValue;
          startIndex = i;
        }
      }
      // 处理最后一个批次
      if (currentBatch !== null) {
        mergeData[currentBatch] = {
          start: startIndex,
          count: data.length - startIndex
        };
      }

      // 应用合并
      setTimeout(function () {
        for (var batch in mergeData) {
          var info = mergeData[batch];
          if (info.count > 1) {
            // 合并checkbox列和快速关联按钮列
            var $firstCheckboxCell = $('#inbound-table').next().find('tr[data-index="' + info.start + '"] td[data-field="0"]');
            var $firstLinkCell = $('#inbound-table').next().find('tr[data-index="' + info.start + '"] td[data-field="quick_link"]');

            $firstCheckboxCell.attr('rowspan', info.count);
            $firstLinkCell.attr('rowspan', info.count);

            $firstCheckboxCell.css({
              'vertical-align': 'middle'
            });
            $firstLinkCell.css({
              'vertical-align': 'middle'
            });

            // 隐藏后续行的单元格
            for (var j = 1; j < info.count; j++) {
              var $row = $('#inbound-table').next().find('tr[data-index="' + (info.start + j) + '"]');
              $row.find('td[data-field="0"]').hide();
              $row.find('td[data-field="quick_link"]').hide();
            }

            // 为同一批次的所有行添加统一的背景色和标记
            for (var k = 0; k < info.count; k++) {
              var $row = $('#inbound-table').next().find('tr[data-index="' + (info.start + k) + '"]');
              $row.attr('data-batch-start', info.start);
              $row.attr('data-batch-count', info.count);

              var $cell = $row.find('td[data-field="batch_number"]');
              $cell.css({
                'border-right': '2px solid #e6e6e6'
              });
            }
          }
        }
      }, 50);
    }

    function refreshTable() {
      table.reload('inbound-table', {
        where: {
          project_id: currentProjectId,
          status: currentStatus,
          material_name: filterMaterialName,
          material_spec: filterMaterialSpec
        },
        page: { curr: 1 }
      });
    }



    // 批次号编辑事件（使用事件委托）
    $(document).on('click', '.batch-edit-icon', function (e) {
      e.stopPropagation();
      var $icon = $(this);
      var id = $icon.data('id');
      var currentBatch = $icon.data('batch');

      layer.prompt({
        title: '修改批次号',
        value: currentBatch,
        formType: 0
      }, function (value, index, elem) {
        if (!value || !value.trim()) {
          layer.msg('批次号不能为空', { icon: 2 });
          return;
        }

        layer.close(index);
        updateBatchNumber(id, value.trim());
      });
    });

    function updateBatchNumber(id, batchNumber) {
      var loading = layer.load();
      $.ajax({
        url: MODULE_PATH + 'inbound/' + id + '/batch',
        type: 'PUT',
        contentType: 'application/json',
        data: JSON.stringify({ batch_number: batchNumber }),
        success: function (res) {
          layer.close(loading);
          if (res.code === 0) {
            layer.msg('批次号更新成功', { icon: 1, time: 1000 });
            // 刷新表格，自动重新分组
            refreshTable();
          } else {
            layer.msg(res.msg, { icon: 2 });
          }
        },
        error: function () {
          layer.close(loading);
          layer.msg('更新失败', { icon: 2 });
        }
      });
    }

    // 快速关联发票事件
    $(document).on('click', '.inbound-invoice-link-icon', function (e) {
      e.stopPropagation();
      var $btn = $(this);
      var inboundId = $btn.data('id');
      var projectId = $btn.data('project-id');
      var batchNum = $btn.data('batch');
      var currentInvId = $btn.data('inv-id');

      // 如果是批次关联按钮（或我们想要实现批次同步），获取该批次的所有ID
      var inboundIds = [inboundId];
      if (batchNum) {
        // 在表格缓存数据中查找所有相同批次的ID
        var tableData = table.cache['inbound-table'];
        if (tableData) {
          inboundIds = tableData.filter(function (d) {
            return d.batch_number === batchNum;
          }).map(function (d) {
            return d.id;
          });
        }
      }

      layer.open({
        type: 1,
        title: '选择发票关联 (项目内发票)',
        area: ['950px', '650px'],
        content: '<div style="padding: 15px;">' +
          '<form class="layui-form layui-form-pane" lay-filter="invoice-select-search-form" id="invoice-select-search-form" style="margin-bottom: 10px;">' +
          '  <div class="layui-form-item">' +
          '    <div class="layui-inline">' +
          '      <label class="layui-form-label">发票号码</label>' +
          '      <div class="layui-input-inline" style="width: 200px;">' +
          '        <select name="invoice_number" lay-search lay-filter="invoice-select-filter">' +
          '          <option value="">输入或选择发票</option>' +
          '        </select>' +
          '      </div>' +
          '    </div>' +
          '    <div class="layui-inline">' +
          '      <label class="layui-form-label">购买方</label>' +
          '      <div class="layui-input-inline" style="width: 200px;">' +
          '        <select name="buyer_name" lay-search lay-filter="invoice-select-filter">' +
          '          <option value="">输入或选择购买方</option>' +
          '        </select>' +
          '      </div>' +
          '    </div>' +
          '    <div class="layui-inline">' +
          '      <label class="layui-form-label">销售方</label>' +
          '      <div class="layui-input-inline" style="width: 200px;">' +
          '        <select name="seller_name" lay-search lay-filter="invoice-select-filter">' +
          '          <option value="">输入或选择销售方</option>' +
          '        </select>' +
          '      </div>' +
          '    </div>' +
          '    <div class="layui-inline" style="vertical-align: top;">' +
          '      <button class="pear-btn pear-btn-md pear-btn-primary" type="button" id="invoice-select-search-btn">' +
          '        <i class="layui-icon layui-icon-search"></i> 查询' +
          '      </button>' +
          '      <button class="pear-btn pear-btn-md" type="reset" id="invoice-select-reset-btn">' +
          '        <i class="layui-icon layui-icon-refresh"></i>' +
          '      </button>' +
          '    </div>' +
          '  </div>' +
          '</form>' +
          '<table id="invoice-select-table" lay-filter="invoice-select-table"></table>' +
          '</div>',
        success: function (layero, index) {
          // 重新渲染选择框以应用 lay-search
          form.render('select', 'invoice-select-search-form');

          // 预加载一些选项作为“匹配建议”
          function loadSearchOptions(field) {
            $.ajax({
              url: '/api/v1/material/invoice',
              data: { limit_only: 100 }, // 不限项目，获取更多建议
              success: function (res) {
                if (res.code === 0 && res.data) {
                  var options = '<option value="">直接输入或选择</option>';
                  var items = res.data;
                  var added = new Set();
                  items.forEach(function (item) {
                    var val = item[field];
                    if (val && !added.has(val)) {
                      options += '<option value="' + val + '">' + val + '</option>';
                      added.add(val);
                    }
                  });
                  layero.find('select[name="' + field + '"]').html(options);
                  form.render('select', 'invoice-select-search-form');
                }
              },
              error: function () {
                console.error('Failed to load search options for ' + field);
              }
            });
          }

          // 处理可能存在的 undefined projectId
          var queryWhere = {};
          if (projectId && projectId !== 'undefined' && projectId !== 'null' && projectId !== '') {
            queryWhere.project_id = projectId;
          }

          loadSearchOptions('invoice_number');
          loadSearchOptions('buyer_name');
          loadSearchOptions('seller_name');
          table.render({
            id: 'invoice-select-table', // 显式指定 ID
            elem: '#invoice-select-table',
            url: '/api/v1/material/invoice',
            where: queryWhere,
            page: true,
            limit: 90,
            limits: [30, 60, 90, 150, 300],
            cellMinWidth: 100, // 设置全局最小列宽
            cols: [[
              { type: 'radio' },
              { field: 'invoice_number', title: '发票号码', minWidth: 165 },
              { field: 'invoice_date', title: '开票日期', minWidth: 110 },
              { field: 'buyer_name', title: '购买方', minWidth: 180 },
              { field: 'seller_name', title: '销售方', minWidth: 180 },
              { field: 'total_amount', title: '价税合计', minWidth: 100, templet: function (d) { return parseFloat(d.total_amount).toFixed(2); } },
              { field: 'invoice_category', title: '类型', minWidth: 80 }
            ]],
            height: '350px',
            text: { none: '暂无匹配发票数据' },
            error: function (e) {
              console.error('Table render error:', e);
              layer.msg('加载发票数据失败', { icon: 2 });
            }
          });

          // 搜索按钮
          $('#invoice-select-search-btn').on('click', function () {
            triggerInvoiceSearch();
            return false;
          });

          // 重置按钮逻辑补全
          $('#invoice-select-reset-btn').on('click', function () {
            setTimeout(function () {
              form.render('select', 'invoice-select-search-form');
              triggerInvoiceSearch();
            }, 100);
          });

          // 下拉选中自动触发搜索
          form.on('select(invoice-select-filter)', function (data) {
            triggerInvoiceSearch();
          });

          function triggerInvoiceSearch() {
            var formData = form.val('invoice-select-search-form');
            var invNum = formData.invoice_number || '';
            var buyer = formData.buyer_name || '';
            var seller = formData.seller_name || '';

            var searchParams = {
              invoice_number: invNum,
              buyer_name: buyer,
              seller_name: seller
            };

            // 逻辑：如果有任何关键字，则进行全局搜索
            if (!invNum && !buyer && !seller) {
              if (projectId && projectId !== 'undefined' && projectId !== 'null' && projectId !== '') {
                searchParams.project_id = projectId;
              }
            } else {
              // 全局搜索时不传 project_id，或者传空
              searchParams.project_id = '';
            }

            table.reload('invoice-select-table', {
              where: searchParams,
              page: { curr: 1 }
            });
          }

        },
        btn: ['确定选择', '取消关联', '关闭'],
        btn1: function (index, layero) {
          var checkStatus = table.checkStatus('invoice-select-table');
          if (checkStatus.data.length === 0) {
            layer.msg('请选择一张发票');
            return;
          }
          var data = checkStatus.data[0];
          confirmInvoiceLink(inboundIds, data.id, data.invoice_number);
          layer.close(index);
        },
        btn2: function (index, layero) {
          confirmInvoiceLink(inboundIds, null, '');
          layer.close(index);
          return false;
        }
      });
    });

    function confirmInvoiceLink(inboundIds, invoiceId, invoiceNumber) {
      var loading = layer.load();

      // 兼容单ID和数组
      var idList = Array.isArray(inboundIds) ? inboundIds : [inboundIds];

      $.ajax({
        url: '/api/v1/material/inbound/batch-invoice',
        type: 'PUT',
        contentType: 'application/json',
        data: JSON.stringify({ ids: idList, invoice_id: invoiceId }),
        success: function (res) {
          layer.close(loading);
          if (res.code === 0) {
            layer.msg(invoiceId ? '关联成功' : '已取消关联', { icon: 1, time: 1000 });
            refreshTable();
          } else {
            layer.msg(res.msg, { icon: 2 });
          }
        },
        error: function () {
          layer.close(loading);
          layer.msg('操作失败', { icon: 2 });
        }
      });
    }

    // 预览发票事件
    $(document).on('click', '.inbound-invoice-view-icon', function (e) {
      e.stopPropagation();
      var url = $(this).data('url');
      openInvoicePreview(url);
    });

    // 双击发票号码预览
    $(document).on('dblclick', '.invoice-number-view', function (e) {
      e.stopPropagation();
      var url = $(this).data('url');
      openInvoicePreview(url);
    });

    function openInvoicePreview(url) {
      if (!url) {
        layer.msg('该发票暂无 PDF 文件可供预览', { icon: 0 });
        return;
      }

      var fullUrl = url;
      // 如果不是绝对路径且不以/开头，补全路径
      if (!url.startsWith('http') && !url.startsWith('/')) {
        fullUrl = '/' + url;
      }

      layer.open({
        type: 2,
        title: '发票原件预览',
        area: ['90%', '90%'],
        fixed: false,
        maxmin: true,
        content: fullUrl
      });
    }

    // 监听checkbox点击事件，高亮同批次的所有行
    table.on('checkbox(inbound-table)', function (obj) {
      var checked = obj.checked;
      var type = obj.type;

      // 只处理单行勾选
      if (type === 'one') {
        var data = obj.data;
        var batchNumber = data.batch_number;

        if (batchNumber) {
          // 使用setTimeout确保在Layui处理完成后再应用样式
          setTimeout(function () {
            // 获取表格当前页的所有数据
            var tableData = table.cache['inbound-table'];

            // 遍历所有数据，找到相同批次的行并添加/移除高亮样式
            tableData.forEach(function (row, index) {
              if (row.batch_number === batchNumber) {
                var $row = $('#inbound-table').next().find('tr[data-index="' + index + '"]');
                if (checked) {
                  $row.addClass('layui-table-click');
                } else {
                  $row.removeClass('layui-table-click');
                }
              }
            });
          }, 10);
        }
      }
    });

    // Tab switch event
    element.on('tab(status-tab)', function (data) {
      currentStatus = $(this).attr('lay-id');
      refreshTable();
    });

    // Toolbar events
    table.on('toolbar(inbound-table)', function (obj) {
      if (obj.event === 'add') {
        window.add();
      } else if (obj.event === 'refresh') {
        refreshTable();
      } else if (obj.event === 'batchConfirm') {
        window.batchConfirm();
      } else if (obj.event === 'batchDelete') {
        var allInboundData = table.cache['inbound-table'] || [];
        var selectedData = allInboundData.filter(function (item) { return item.LAY_CHECKED; });

        if (selectedData.length === 0) {
          layer.msg('请先勾选要删除的记录', { icon: 0 });
          return;
        }

        // 自动扩展 IDs 以包含同一批次的所有记录
        var selectedBatchNumbers = selectedData.map(function (item) { return item.batch_number; });
        var finalToDelete = allInboundData.filter(function (item) {
          return selectedBatchNumbers.indexOf(item.batch_number) !== -1 && item.status === 'pending';
        });

        var ids = finalToDelete.map(function (item) { return item.id; });

        layer.confirm('确定要删除选中的 ' + selectedBatchNumbers.length + ' 个批次（共 ' + ids.length + ' 条记录）吗？此操作不可恢复！', {
          icon: 3,
          title: '批量删除确认'
        }, function (index) {
          batchDeleteInbound(ids);
          layer.close(index);
        });
      }
    });

    // Row tool events
    table.on('tool(inbound-table)', function (obj) {
      if (obj.event === 'edit') {
        window.edit(obj);
      } else if (obj.event === 'remove') {
        window.remove(obj);
      }
    });

    // Window functions
    window.add = function () {
      layer.open({
        type: 2,
        title: '新增入库任务',
        shade: 0.1,
        area: ['600px', '500px'],
        content: '/view/material/inbound/add'
      });
    }

    window.batchConfirm = function () {
      var allInboundData = table.cache['inbound-table'] || [];
      var selectedData = allInboundData.filter(function (item) { return item.LAY_CHECKED; });
      if (selectedData.length === 0) {
        layer.msg("请选择至少一项", { icon: 2 });
        return;
      }

      // 自动扩展 IDs 以包含同一批次的所有记录
      var selectedBatchNumbers = selectedData.map(function (item) { return item.batch_number; });
      var allInboundData = table.cache['inbound-table'];
      var finalToConfirm = allInboundData.filter(function (item) {
        return selectedBatchNumbers.indexOf(item.batch_number) !== -1 && item.status === 'pending';
      });

      var ids = finalToConfirm.map(function (item) { return item.id; });

      if (ids.length === 0) {
        layer.msg("所选批次中没有可确认的记录", { icon: 0 });
        return;
      }

      layer.confirm('确定要确认选中的 ' + selectedBatchNumbers.length + ' 个批次（共 ' + ids.length + ' 条记录）入库吗？', { icon: 3, title: '提示' }, function (index) {
        layer.close(index);
        var loading = layer.load();
        $.ajax({
          url: MODULE_PATH + 'inbound/batch_confirm',
          type: 'post',
          contentType: 'application/json',
          data: JSON.stringify({ ids: ids }),
          success: function (res) {
            layer.close(loading);
            if (res.code === 0) {
              layer.msg(res.msg, { icon: 1, time: 1000 }, function () {
                refreshTable();
              });
            } else {
              layer.msg(res.msg, { icon: 2 });
            }
          }
        });
      });
    }

    function batchDeleteInbound(ids) {
      var loading = layer.load(1, { shade: [0.1, '#fff'] });
      $.ajax({
        url: MODULE_PATH + 'inbound/batch-delete',
        type: 'POST',
        contentType: 'application/json',
        data: JSON.stringify({ ids: ids }),
        success: function (res) {
          layer.close(loading);
          if (res.code === 0 || res.success) {
            layer.msg(res.msg || '批量删除成功', { icon: 1, time: 1000 }, function () {
              refreshTable();
            });
          } else {
            layer.msg(res.msg || '删除失败', { icon: 2 });
          }
        },
        error: function (xhr) {
          layer.close(loading);
          var errorMsg = '操作失败';
          if (xhr.responseJSON && xhr.responseJSON.msg) {
            errorMsg = xhr.responseJSON.msg;
          } else if (xhr.status === 403) {
            errorMsg = '没有权限执行此操作';
          }
          layer.msg(errorMsg, { icon: 2 });
        }
      });
    }

    window.edit = function (obj) {
      layer.open({
        type: 2,
        title: '编辑入库任务',
        shade: 0.1,
        area: ['600px', '500px'],
        content: '/view/material/inbound/edit/' + obj.data.id
      });
    }

    window.remove = function (obj) {
      layer.confirm('确定要删除该入库任务吗？', { icon: 3, title: '提示' }, function (index) {
        layer.close(index);
        var loading = layer.load();
        $.ajax({
          url: MODULE_PATH + 'inbound/' + obj.data.id,
          type: 'delete',
          success: function (res) {
            layer.close(loading);
            if (res.code === 0) {
              layer.msg(res.msg, { icon: 1, time: 1000 }, function () {
                obj.del();
              });
            } else {
              layer.msg(res.msg, { icon: 2 });
            }
          }
        });
      });
    }
    // 监听勾选状态
    table.on('checkbox(inbound-table)', function (obj) {
      var cache = table.cache['inbound-table'];

      // 批次联动逻辑：如果勾选的是合并行中的首行，则同步该批次所有行
      if (obj.type === 'one') {
        var $tr = $(obj.tr);
        var batchStart = $tr.attr('data-batch-start');
        var batchCount = $tr.attr('data-batch-count');

        if (batchStart !== undefined && batchCount !== undefined) {
          var start = parseInt(batchStart);
          var count = parseInt(batchCount);
          var isChecked = obj.checked;

          // 同步缓存状态
          for (var i = 0; i < count; i++) {
            cache[start + i].LAY_CHECKED = isChecked;
          }

          // 同步渲染样式 (DOM 更新)
          var $tableView = $('#inbound-table').next();
          for (var j = 0; j < count; j++) {
            var $row = $tableView.find('tr[data-index="' + (start + j) + '"]');
            var $cb = $row.find('input[name="layTableCheckbox"]');
            if (isChecked) {
              $row.addClass('layui-table-click');
              $cb.prop('checked', true);
            } else {
              $row.removeClass('layui-table-click');
              $cb.prop('checked', false);
            }
          }
          form.render('checkbox');
        }
      }

      updateInboundSelectionSummary();
    });

    function updateInboundSelectionSummary() {
      var allInboundData = table.cache['inbound-table'] || [];
      var selectedData = allInboundData.filter(function (item) { return item.LAY_CHECKED; });
      var $summary = $('#inbound-selection-summary');

      if (selectedData.length > 0) {
        var totalAmount = 0;
        selectedData.forEach(function (item) {
          var qty = parseFloat(item.inbound_quantity) || 0;
          var price = parseFloat(item.inbound_price) || 0;
          // Support both direct amount and qty*price calculation
          var rowTotal = item.inbound_total_amount ? parseFloat(item.inbound_total_amount) : (qty * price);
          totalAmount += rowTotal;
        });

        $('#total-inbound-amount').text('¥' + totalAmount.toFixed(2));
        if ($summary.css('display') === 'none') {
          $summary.fadeIn(200);
        }
      } else {
        $summary.fadeOut(200);
      }
    }

  });
</script>
