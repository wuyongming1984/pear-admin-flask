<!doctype html>
<html lang="zh-cn">

<head>
  <meta charset="utf-8" />
  <title>拟入库计划</title>
  <meta name="renderer" content="webkit" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <link rel="stylesheet" href="/static/component/pear/css/pear.css" />
  <style>
    /* GitHub-style Project List */
    .project-panel {
      background: #fff;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      overflow: hidden;
      height: calc(100vh - 120px);
      overflow-y: auto;
    }

    .project-title {
      background: #f6f8fa;
      padding: 12px 16px;
      font-weight: 600;
      font-size: 14px;
      border-bottom: 1px solid #d0d7de;
      color: #24292f;
      margin-bottom: 0;
    }

    .project-item {
      padding: 10px 16px;
      border-bottom: 1px solid #d0d7de;
      display: flex;
      align-items: center;
      cursor: pointer;
      font-size: 14px;
      color: #24292f;
      transition: background 0.2s;
      margin-bottom: 0;
      border-radius: 0;
    }

    .project-item:last-child {
      border-bottom: none;
    }

    .project-item:hover {
      background-color: #f6f8fa;
    }

    .project-item.active {
      background-color: #0969da;
      color: #fff;
    }

    .project-item i {
      margin-right: 8px;
      color: #57606a;
    }

    .project-item.active i {
      color: #fff;
    }

    /* Count Badge */
    .project-count {
      margin-left: auto;
      background-color: rgba(175, 184, 193, 0.2);
      color: #24292f;
      border-radius: 10px;
      padding: 2px 8px;
      font-size: 12px;
      font-weight: 500;
    }

    .project-item.active .project-count {
      background-color: #fff;
      color: #0969da;
    }

    .main-content {
      background: #fff;
      border-radius: 4px;
      padding: 15px;
      height: calc(100vh - 120px);
    }

    .content-header {
      margin-bottom: 15px;
      padding-bottom: 15px;
      border-bottom: 1px solid #f0f0f0;
    }

    .content-title {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .status-tab {
      margin-bottom: 10px;
    }
  </style>
</head>

<body class="pear-container">
  <div class="layui-row layui-col-space15">
    <!-- 左侧项目面板 -->
    <div class="layui-col-md3">
      <div class="project-panel">
        <div class="project-title">项目清单</div>
        <div style="padding: 10px 15px 5px 15px;">
          <input type="text" id="inbound-project-search" placeholder="搜索项目..." autocomplete="off" class="layui-input"
            style="height: 30px; font-size: 12px; border-radius: 4px;">
        </div>
        <div class="project-item active" data-project-id="">
          <i class="layui-icon layui-icon-list"></i>
          <span>全部项目</span>
        </div>
        <div id="inbound-project-list"></div>
      </div>
    </div>

    <!-- 右侧主内容区 -->
    <div class="layui-col-md9">
      <div class="main-content">
        <div class="content-header">
          <div class="content-title" id="content-title">所有项目拟入库计划</div>
          <div class="status-tab">
            <div class="layui-tab layui-tab-brief" lay-filter="status-tab">
              <ul class="layui-tab-title">
                <li class="layui-this" lay-id="pending">待入库 <span class="layui-badge-dot layui-bg-orange"></span></li>
                <li lay-id="completed">已入库</li>
              </ul>
            </div>
          </div>
        </div>
        <table id="inbound-table" lay-filter="inbound-table"></table>
      </div>
    </div>
  </div>

  <script type="text/html" id="inbound-toolbar">
    <button class="pear-btn pear-btn-primary pear-btn-md" lay-event="add">
        <i class="layui-icon layui-icon-add-1"></i>
        新增入库任务
    </button>
    {{ '{{# if (d.status === "pending") { }}' }}
    <button class="pear-btn pear-btn-success pear-btn-md" lay-event="batchConfirm">
        <i class="layui-icon layui-icon-ok"></i>
        批量确认入库
    </button>
    {{ '{{# }}}' }}
  </script>

  <script type="text/html" id="operation-bar">
    <button class="pear-btn pear-btn-primary pear-btn-sm" lay-event="edit" title="编辑">
        <i class="layui-icon layui-icon-edit"></i>
    </button>
    <button class="pear-btn pear-btn-danger pear-btn-sm" lay-event="remove" title="删除">
        <i class="layui-icon layui-icon-delete"></i>
    </button>
  </script>

  <script src="/static/component/layui/layui.js"></script>
  <script src="/static/component/pear/pear.js"></script>
  <script>
    layui.use(['table', 'jquery', 'form', 'element'], function () {
      var table = layui.table;
      var $ = layui.jquery;
      var form = layui.form;
      var element = layui.element;
      var MODULE_PATH = '/api/v1/material/';

      // Initialize as empty arrays
      var serverProjects = [];
      var currentProjectId = '';
      var currentStatus = 'pending';

      // Fetch options data
      if (r != null) return decodeURIComponent(r[2]); return null;
    }

      var currentProjectId = getQueryParam('project_id') || '';
    var currentStatus = getQueryParam('status') || 'pending';
    var filterMaterialName = getQueryParam('material_name') || '';
    var filterMaterialSpec = getQueryParam('material_spec') || '';

    // Set initial tab selection based on status param
    if (currentStatus === 'completed') {
      $('.layui-tab-title li[lay-id="pending"]').removeClass('layui-this');
      $('.layui-tab-title li[lay-id="completed"]').addClass('layui-this');
    }

    // If filtering by material/spec, show a badge or notice? 
    // User might be confused if they don't see why list is short.
    if (filterMaterialName) {
      $('#content-title').html($('#content-title').text() + ' <span class="layui-badge layui-bg-blue">筛选: ' + filterMaterialName + '</span>');
    }

    function loadProjects() {
      console.log("Inbound页面 - loadProjects被调用");
      console.log("Inbound页面 - serverProjects:", serverProjects);
      var html = '';
      var searchInput = $('#project-search');
      var searchKeyword = searchInput.length > 0 ? searchInput.val().trim().toLowerCase() : '';

      if (serverProjects && serverProjects.length > 0) {
        serverProjects.forEach(function (p) {
          // Filter based on search keyword
          var pName = p.name || '未命名项目';
          if (searchKeyword && pName.toLowerCase().indexOf(searchKeyword) === -1) {
            return;
          }

          html += '<div class="project-item" data-project-id="' + p.id + '">';
          html += '<i class="layui-icon layui-icon-read"></i>';
          html += '<span>' + pName + '</span>';

          // Add Inbound Count Badge
          if (p.inbound_count !== undefined && p.inbound_count > 0) {
            html += '<span class="project-count">' + p.inbound_count + '</span>';
          }
          html += '</div>';
        });
        console.log("Inbound页面 - 生成的HTML:", html.substring(0, 200));
        console.log("Inbound页面 - #project-list元素:", $('#project-list').length);
        $('#project-list').html(html);

        // Re-bind click events
        $('.project-item').off('click').on('click', function () {
          selectProject($(this).data('project-id'), $(this).find('span').first().text());
        });
      } else {
        console.log("Inbound页面 - 无项目数据，显示暂无项目");
        $('#project-list').html('<div style="padding: 10px; color: #999; text-align: center;">暂无项目</div>');
      }
    }

    // Helper function to select project (can be called from table click)
    window.selectProject = function (projectId, projectName) {
      // Find name if not provided (e.g. from ID only)
      if (!projectName) {
        var found = serverProjects.find(function (p) { return p.id == projectId; });
        if (found) projectName = found.name;
      }

      $('.project-item').removeClass('active');
      if (projectId) {
        $('.project-item[data-project-id="' + projectId + '"]').addClass('active');
        $('#content-title').text(projectName + ' 拟入库计划');
      } else {
        // Select "All"
        $('.project-item[data-project-id=""]').addClass('active');
        $('#content-title').text('所有项目拟入库计划');
      }
      currentProjectId = projectId;
      refreshTable();
    }

    // Bind Search Event
    $('#project-search').on('input', function () {
      loadProjects();
    });

    var cols = [[
      { type: 'checkbox' },
      {
        field: 'project_name', title: '项目名称', width: 150, align: 'center', templet: function (d) {
          return '<span class="layui-badge layui-bg-cyan" style="cursor: pointer;" onclick="selectProject(' + d.project_id + ')">' + (d.project_name || '-') + '</span>';
        }
      },
      {
        field: 'material_name', title: '材料名称与规格', width: 280, templet: function (d) {
          return '<div style="padding: 5px 0;">' +
            '<div style="font-weight: bold; margin-bottom: 5px;">' + d.material_name + '</div>' +
            '<div style="font-size: 12px; color: #999;">' +
            '<span style="background: #f2f2f2; padding: 2px 5px; border-radius: 2px; margin-right: 5px;">规: ' + (d.material_spec || '-') + '</span>' +
            '<span style="background: #f2f2f2; padding: 2px 5px; border-radius: 2px;">单: ' + (d.material_unit || '-') + '</span>' +
            '</div></div>';
        }
      },
      {
        field: 'batch_number', title: '批次信息', width: 180, templet: function (d) {
          return '<div>' + d.batch_number + (d.batch_sub_number ? ' <span class="layui-badge layui-bg-gray">' + d.batch_sub_number + '</span>' : '') + '</div>';
        }
      },
      {
        field: 'supplier_name', title: '供应商', width: 180, templet: function (d) {
          return d.supplier_name ? '<span class="layui-badge layui-bg-blue">' + d.supplier_name + '</span>' : '<span style="color: #ccc;">未指定</span>';
        }
      },
      { field: 'inbound_quantity', title: '入库量', width: 100, align: 'center', style: 'font-weight: bold; color: #009688;' },
      { field: 'inbound_price', title: '单价', width: 100, align: 'center' },
      { field: 'inbound_total_amount', title: '合价', width: 120, align: 'center' },
      {
        field: 'status', title: '状态', width: 100, align: 'center', templet: function (d) {
          if (d.status === 'pending') return '<span class="layui-badge layui-bg-orange">待入库</span>';
          if (d.status === 'completed') return '<span class="layui-badge layui-bg-green">已入库</span>';
          return d.status;
        }
      },
      { title: '操作', toolbar: '#operation-bar', width: 120, align: 'center' }
    ]];

    table.render({
      elem: '#inbound-table',
      url: MODULE_PATH + 'inbound',
      where: { status: currentStatus },
      page: true,
      cols: cols,
      skin: 'line',
      toolbar: '#inbound-toolbar',
      defaultToolbar: [{
        title: '刷新',
        layEvent: 'refresh',
        icon: 'layui-icon-refresh',
      }, 'filter', 'print', 'exports']
    });

    function refreshTable() {
      table.reload('inbound-table', {
        where: {
          project_id: currentProjectId,
          status: currentStatus,
          material_name: filterMaterialName,
          material_spec: filterMaterialSpec
        },
        page: { curr: 1 }
      });
    }

    element.on('tab(status-tab)', function (data) {
      currentStatus = $(this).attr('lay-id');
      refreshTable();
    });

    table.on('toolbar(inbound-table)', function (obj) {
      if (obj.event === 'add') {
        window.add();
      } else if (obj.event === 'refresh') {
        refreshTable();
      } else if (obj.event === 'batchConfirm') {
        window.batchConfirm();
      }
    });

    table.on('tool(inbound-table)', function (obj) {
      if (obj.event === 'remove') {
        window.remove(obj);
      } else if (obj.event === 'edit') {
        window.edit(obj);
      }
    });

    window.add = function () {
      layer.open({
        type: 2,
        title: '新增入库任务',
        shade: 0.1,
        area: ['600px', '500px'],
        content: '/view/material/inbound/add'
      });
    }

    window.edit = function (obj) {
      layer.open({
        type: 2,
        title: '编辑入库任务',
        shade: 0.1,
        area: ['600px', '500px'],
        content: '/view/material/inbound/edit/' + obj.data.id
      });
    }

    window.batchConfirm = function () {
      var checkStatus = table.checkStatus('inbound-table');
      if (checkStatus.data.length === 0) {
        layer.msg("请选择至少一项", { icon: 2 });
        return;
      }
      var ids = checkStatus.data.map(function (item) { return item.id; });
      layer.confirm('确定要确认入库选中项吗？这将更新库存台账并扣减策划余量。', { icon: 3, title: '提示' }, function (index) {
        layer.close(index);
        var loading = layer.load();
        $.ajax({
          url: MODULE_PATH + 'inbound/confirm',
          type: 'post',
          dataType: 'json',
          contentType: 'application/json',
          data: JSON.stringify({ ids: ids }),
          success: function (res) {
            layer.close(loading);
            if (res.code === 0) {
              layer.msg(res.msg, { icon: 1, time: 1000 }, function () {
                refreshTable();
              });
            } else {
              layer.msg(res.msg, { icon: 2 });
            }
          }
        });
      });
    }

    window.remove = function (obj) {
      layer.confirm('确定要删除该入库任务吗？', { icon: 3, title: '提示' }, function (index) {
        layer.close(index);
        var loading = layer.load();
        $.ajax({
          url: MODULE_PATH + 'inbound/' + obj.data.id,
          type: 'delete',
          success: function (res) {
            layer.close(loading);
            if (res.code === 0) {
              layer.msg(res.msg, { icon: 1, time: 1000 }, function () {
                obj.del();
              });
            } else {
              layer.msg(res.msg, { icon: 2 });
            }
          }
        });
      });
    }

    loadProjects();
    });
  </script>
</body>

</html>
