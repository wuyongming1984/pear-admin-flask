<script>
    layui.use(['table', 'jquery', 'layer'], function () {
        var table = layui.table;
        var $ = layui.jquery;
        var layer = layui.layer;
        var MODULE_PATH = '/api/v1/material/';

        // Initialize variables
        var serverInvoices = [];
        var currentInvoiceId = '';

        // Load invoices from server
        function loadInvoiceList() {
            $.ajax({
                url: MODULE_PATH + 'invoice/list',
                type: 'GET',
                success: function (res) {
                    if (res.code === 0 && res.data) {
                        serverInvoices = res.data;
                        $('#total-count').text(serverInvoices.length);
                        renderInvoices();
                    } else {
                        $('#invoice-list').html('<div style="padding: 10px; color: #999; text-align: center;">加载失败</div>');
                    }
                },
                error: function () {
                    $('#invoice-list').html('<div style="padding: 10px; color: #999; text-align: center;">加载失败</div>');
                }
            });
        }

        // Load dictionary options
        function loadDictionaryOptions(dicCodeOrName, selectId) {
            console.log('加载字典选项:', dicCodeOrName, '到', selectId);
            $.ajax({
                url: '/api/v1/dictionary/list',  // 修复：添加/v1前缀
                data: { code_desc: dicCodeOrName, limit: 100 },
                success: function (res) {
                    console.log('字典列表响应:', res);
                    if (res.code === 0 && res.data.length > 0) {
                        var dicId = res.data[0].id;
                        console.log('找到字典 ID:', dicId, '代码:', res.data[0].code, '名称:', res.data[0].name);
                        $.ajax({
                            url: '/api/v1/dictionary/detail/list',  // 修复：添加/v1前缀
                            data: { dic_id: dicId, limit: 100 },
                            success: function (detailRes) {
                                console.log('字典明细响应:', detailRes);
                                if (detailRes.code === 0) {
                                    var options = '';
                                    // 为筛选框添加"全部"选项
                                    if (selectId === 'category-filter') {
                                        options = '<option value="">全部发票</option>';
                                    } else {
                                        options = '<option value="">请选择</option>';
                                    }
                                    detailRes.data.forEach(function (item) {
                                        options += '<option value="' + item.code + '">' + item.value + '</option>';
                                    });
                                    $('#' + selectId).html(options);
                                    console.log('成功加载', detailRes.data.length, '个选项到', selectId);
                                } else {
                                    console.warn('获取字典明细失败:', detailRes.msg);
                                }
                            },
                            error: function (xhr, status, error) {
                                console.error('加载字典明细出错:', error);
                            }
                        });
                    } else {
                        console.warn('未找到字典:', dicCodeOrName, '请在字典管理中创建');
                        $('#' + selectId).html('<option value="">未找到字典数据</option>');
                    }
                },
                error: function (xhr, status, error) {
                    console.error('加载字典列表出错:', error);
                    $('#' + selectId).html('<option value="">加载失败</option>');
                }
            });
        }

        // Initial load
        loadInvoiceList();
        loadDictionaryOptions('fpdl', 'invoice-category');  // 发票大类
        loadDictionaryOptions('kfdk', 'deductible');        // 可否抵扣
        loadDictionaryOptions('fpdl', 'category-filter');   // 筛选框

        // Category filter change event
        $('#category-filter').on('change', function () {
            console.log('筛选条件改变:', $(this).val());
            loadInvoiceList();  // 重新加载列表
        });

        // Save invoice button
        $('#save-invoice-btn').click(function () {
            var invoiceId = currentInvoiceId;
            if (!invoiceId) {
                layer.msg('请先选择发票', { icon: 0 });
                return;
            }

            var data = {
                invoice_category: $('#invoice-category').val(),
                deductible: $('#deductible').val()
            };

            var loadIdx = layer.load();
            $.ajax({
                url: MODULE_PATH + 'invoice/' + invoiceId,
                type: 'PUT',
                contentType: 'application/json',
                data: JSON.stringify(data),
                success: function (res) {
                    layer.close(loadIdx);
                    if (res.code === 0) {
                        layer.msg('保存成功', { icon: 1, time: 1500 });
                        // Optionally reload the invoice detail
                        loadInvoiceDetail(invoiceId);
                    } else {
                        layer.msg(res.msg || '保存失败', { icon: 2 });
                    }
                },
                error: function () {
                    layer.close(loadIdx);
                    layer.msg('网络错误', { icon: 2 });
                }
            });
        });

        function renderInvoices() {
            var searchNum = $('#invoice-search').val().toLowerCase().trim();
            var searchBuyer = $('#buyer-search').val().toLowerCase().trim();
            var searchSeller = $('#seller-search').val().toLowerCase().trim();
            var categoryFilter = $('#category-filter').val();  // 移到循环外部
            var html = '';

            console.log('筛选条件:', {
                searchNum: searchNum,
                searchBuyer: searchBuyer,
                searchSeller: searchSeller,
                categoryFilter: categoryFilter
            });

            if (!serverInvoices || serverInvoices.length === 0) {
                $('#invoice-list').html('<div style="padding: 10px; color: #999; text-align: center;">暂无发票</div>');
                return;
            }



            serverInvoices.forEach(function (inv) {
                var invNum = inv.invoice_number || '无编号';
                var seller = inv.seller_name || '未知销售方';
                var buyer = inv.buyer_name || '';
                var amt = '';
                if (inv.total_amount) {
                    var val = parseFloat(inv.total_amount);
                    amt = (val / 10000).toFixed(2) + ' 万元';
                }

                if (searchNum && invNum.toLowerCase().indexOf(searchNum) === -1) return;
                if (searchBuyer && buyer.toLowerCase().indexOf(searchBuyer) === -1) return;
                if (searchSeller && seller.toLowerCase().indexOf(searchSeller) === -1) return;

                // 发票大类筛选
                if (categoryFilter) {
                    console.log('检查发票:', inv.id, '发票大类:', inv.invoice_category, '(类型:', typeof inv.invoice_category + ')', '筛选值:', categoryFilter, '(类型:', typeof categoryFilter + ')');
                    if (inv.invoice_category !== categoryFilter) {
                        console.log('  → 筛选掉');
                        return;
                    } else {
                        console.log('  → 保留');
                    }
                }

                // Unit conversion to 万元
                var amtVal = '0.00';
                if (inv.total_amount) {
                    amtVal = (parseFloat(inv.total_amount) / 10000).toFixed(2);
                }

                html += '<div class="project-item" data-id="' + inv.id + '">';
                html += '  <div class="item-main">';
                html += '    <div class="item-buyer" title="' + (buyer || '未知购买方') + '">' + (buyer || '未知购买方') + '</div>';
                html += '    <div class="item-seller" title="' + seller + '">' + seller + '</div>';
                html += '  </div>';

                html += '  <div class="item-money">';
                html += '    <span class="val">' + amtVal + '</span>';
                html += '    <span class="unit">万元</span>';
                html += '  </div>';

                html += '  <div class="item-footer">';
                html += '    <div class="item-actions">';
                if (inv.file_url) {
                    html += '      <i class="layui-icon layui-icon-search action-icon view" data-url="' + inv.file_url + '" title="查看原件"></i>';
                }
                html += '      <i class="layui-icon layui-icon-delete action-icon del" data-id="' + inv.id + '" title="删除发票"></i>';
                html += '    </div>';
                html += '  </div>';
                html += '</div>';
            });

            if (html === '') {
                html = '<div style="padding: 20px; color: #999; text-align: center;">无匹配发票</div>';
            }

            $('#invoice-list').html(html);

            // Re-apply active state
            if (currentInvoiceId) {
                $('.project-item').removeClass('active');
                $('.project-item[data-id="' + currentInvoiceId + '"]').addClass('active');
            }
        }

        // Select invoice
        function selectInvoice(id, invoiceNum) {
            currentInvoiceId = id || '';

            // Update Sidebar Active State
            $('.project-item').removeClass('active');
            var activeItem = id ? $('.project-item[data-id="' + id + '"]') : $('.project-item[data-id=""]');
            activeItem.addClass('active');

            if (id) {
                $('#current-project-title').text('发票: ' + invoiceNum);
                $('#table-view').hide();
                $('#detail-view').show();
                loadInvoiceDetail(id);
            } else {
                $('#current-project-title').text('所有发票');
                $('#detail-view').hide();
                $('#table-view').show();
                refreshTable();
            }
        }

        // Load and render invoice detail
        function loadInvoiceDetail(id) {
            var loadIdx = layer.load();
            $.ajax({
                url: MODULE_PATH + 'invoice',
                data: { id: id, limit: 1 },
                success: function (res) {
                    layer.close(loadIdx);
                    if (res.code === 0 && res.data.length > 0) {
                        var inv = res.data[0];
                        renderDetailContent(inv);
                    } else {
                        layer.msg('获取详情失败');
                    }
                },
                error: function () {
                    layer.close(loadIdx);
                    layer.msg('网络错误');
                }
            });
        }

        function renderDetailContent(inv) {
            var ocr = {};
            try {
                if (inv.ocr_result) {
                    ocr = JSON.parse(inv.ocr_result);
                }
            } catch (e) { console.error('Parse ocr failed', e); }

            // Title logic
            var title = inv.invoice_name || ocr.invoice_name || '增值税专用发票';
            if (!inv.invoice_name && ocr.raw_result && ocr.raw_result.InvoiceTypeOrg) {
                var val = ocr.raw_result.InvoiceTypeOrg;
                if (typeof val === 'object') title = val.word;
                else title = val;
            }
            $('#v-title').text(title || '发票详情');

            // Helper
            function t(v1, v2) { return v1 || v2 || ''; }

            // Header
            $('#v-code').text(t(inv.invoice_code, ocr.invoice_code));
            $('#v-number').text(t(inv.invoice_number, ocr.invoice_number));
            $('#v-check').text(t(inv.check_code, ocr.check_code));
            $('#v-date').text(t(inv.invoice_date, ocr.invoice_date));
            $('#v-machine').text(t(inv.machine_num, ocr.machine_code));

            // Buyer
            $('#v-buyer-name').text(t(inv.buyer_name, ocr.buyer_name));
            $('#v-buyer-tax').text(t(inv.buyer_tax_num, ocr.buyer_tax_num));
            $('#v-buyer-addr').text(t(inv.buyer_address_phone, ocr.buyer_address));
            $('#v-buyer-bank').text(t(inv.buyer_bank_account, ocr.buyer_bank));

            // Password
            $('#v-password').text(t(inv.password_area, ocr.password));

            // Seller
            $('#v-seller-name').text(t(inv.seller_name, ocr.seller_name));
            $('#v-seller-tax').text(t(inv.seller_tax_num, ocr.seller_tax_num));
            $('#v-seller-addr').text(t(inv.seller_address_phone, ocr.seller_address));
            $('#v-seller-bank').text(t(inv.seller_bank_account, ocr.seller_bank));

            // Footer
            $('#v-remarks').text(t(inv.remarks, ocr.remarks));
            $('#v-payee').text(t(inv.payee, ocr.payee));
            $('#v-checker').text(t(inv.checker, ocr.checker));
            $('#v-drawer').text(t(inv.drawer, ocr.note_drawer));
            $('#v-words').text(t(inv.amount_in_words, ocr.amount_in_words));
            $('#v-total').text('¥' + (inv.total_amount || 0));

            // Items Render
            var details = [];
            try {
                if (inv.details_json) details = JSON.parse(inv.details_json);
            } catch (e) { }

            var tb = $('#v-items-body');
            tb.empty();
            if (details.length > 0) {
                details.forEach(function (d) {
                    var tr = '<tr>' +
                        '<td>' + (d.name || '') + '</td>' +
                        '<td>' + (d.spec || '') + '</td>' +
                        '<td>' + (d.unit || '') + '</td>' +
                        '<td align="right">' + (d.quantity || '') + '</td>' +
                        '<td align="right">' + (d.price || '') + '</td>' +
                        '<td align="right">' + (d.amount || '') + '</td>' +
                        '<td align="center">' + (d.tax_rate || '') + '</td>' +
                        '<td align="right">' + (d.tax || '') + '</td>' +
                        '</tr>';
                    tb.append(tr);
                });
            } else {
                tb.append('<tr><td colspan="8" style="text-align:center;color:#999;padding:20px;">暂无明细数据</td></tr>');
            }

            // Set category and deductible values (always set, even if empty)
            $('#invoice-category').val(inv.invoice_category || '');
            $('#deductible').val(inv.deductible || '');

            console.log('发票字段回显:', {
                id: inv.id,
                invoice_category: inv.invoice_category,
                deductible: inv.deductible
            });
        }

        // Expose refresh function for child windows
        window.refreshInvoiceList = function () {
            loadInvoiceList();
        }

        // Bind Search Event (delegated)
        $(document).on('input', '#invoice-search, #buyer-search, #seller-search', function () {
            renderInvoices();
        });

        // Back button
        $('#btn-back-list').click(function () {
            selectInvoice('');
        });

        // Bind click event (delegated) - Scoped to invoice list
        $('#invoice-list').on('click', '.project-item', function () {
            var pid = $(this).data('id');
            var pname = $(this).find('.item-buyer').text() || '发票详情';
            selectInvoice(pid, pname);
        });

        // Delete invoice
        $(document).on('click', '.action-icon.del', function (e) {
            e.stopPropagation(); // Prevent triggering selection
            var id = $(this).data('id');
            layer.confirm('确定删除该发票吗？', { icon: 3, title: '提示' }, function (index) {
                var loadIdx = layer.load();
                $.ajax({
                    url: MODULE_PATH + 'invoice',
                    type: 'DELETE',
                    contentType: 'application/json',
                    data: JSON.stringify({ ids: [id] }),
                    success: function (res) {
                        layer.close(loadIdx);
                        if (res.code === 0) {
                            layer.msg('删除成功', { icon: 1 });
                            loadInvoiceList(); // Reload list
                            if (currentInvoiceId == id) {
                                selectInvoice('');
                            }
                        } else {
                            layer.msg(res.msg, { icon: 2 });
                        }
                    },
                    error: function () {
                        layer.close(loadIdx);
                        layer.msg('网络或者权限错误', { icon: 2 });
                    }
                });
                layer.close(index);
            });
        });

        // View Invoice File (Sidebar)
        $(document).on('click', '.action-icon.view', function (e) {
            e.stopPropagation();
            var url = $(this).data('url');
            if (url) {
                window.open(url, '_blank');
            } else {
                layer.msg('暂无文件', { icon: 0 });
            }
        });

        // New Invoice Button (Sidebar)
        $('#new-invoice-btn').click(function () {
            window.add();
        });

        // Table columns definition
        var cols = [[
            { type: 'checkbox' },
            {
                field: 'project_name', title: '项目名称', width: 150, align: 'center', templet: function (d) {
                    return d.project_name || '-';
                }
            },
            {
                field: 'invoice_number', title: '发票信息', width: 200, templet: function (d) {
                    return '<div style="padding: 5px 0;">' +
                        '<div style="font-weight: bold;">' + (d.invoice_number || '-') + '</div>' +
                        '<div style="font-size: 12px; color: #999;">日期: ' + (d.invoice_date || '-') + '</div>' +
                        '</div>';
                }
            },
            { field: 'buyer_name', title: '购买方', width: 150 },
            { field: 'seller_name', title: '销售方', width: 150 },
            {
                field: 'total_amount', title: '金额', width: 120, align: 'right', templet: function (d) {
                    return '¥' + parseFloat(d.total_amount || 0).toFixed(2);
                }
            },
            { title: '操作', toolbar: '#operation-bar', width: 120, align: 'center' }
        ]];

        // Render table
        table.render({
            elem: '#invoice-table',
            id: 'invoice-table',
            url: MODULE_PATH + 'invoice',
            where: {
                id: currentInvoiceId
            },
            page: true,
            cols: cols,
            skin: 'line',
            toolbar: '#invoice-toolbar',
            defaultToolbar: [{
                title: '刷新',
                layEvent: 'refresh',
                icon: 'layui-icon-refresh',
            }, 'filter', 'print', 'exports']
        });

        // Refresh table
        function refreshTable() {
            table.reload('invoice-table', {
                where: {
                    id: currentInvoiceId
                },
                page: { curr: 1 }
            });
        }

        // Toolbar events
        table.on('toolbar(invoice-table)', function (obj) {
            if (obj.event === 'add') {
                window.add();
            } else if (obj.event === 'refresh') {
                refreshTable();
            }
        });

        // Row tool events
        table.on('tool(invoice-table)', function (obj) {
            if (obj.event === 'edit') {
                window.edit(obj);
            } else if (obj.event === 'remove') {
                window.remove(obj);
            }
        });

        // Add function
        window.add = function () {
            layer.open({
                type: 2,
                title: '新增发票',
                shade: 0.1,
                area: ['500px', '550px'],
                content: '/view/material/invoice/add'
            });
        }

        // Edit function
        window.edit = function (obj) {
            layer.open({
                type: 2,
                title: '编辑发票',
                shade: 0.1,
                area: ['500px', '550px'],
                content: '/view/material/invoice/edit?id=' + obj.data.id
            });
        }

        // Remove function (Fixed to match API)
        window.remove = function (obj) {
            layer.confirm('确定要删除该发票吗？', { icon: 3, title: '提示' }, function (index) {
                layer.close(index);
                var loading = layer.load();
                $.ajax({
                    url: MODULE_PATH + 'invoice',
                    type: 'DELETE',
                    contentType: 'application/json',
                    data: JSON.stringify({ ids: [obj.data.id] }),
                    success: function (res) {
                        layer.close(loading);
                        if (res.code === 0) {
                            layer.msg(res.msg, { icon: 1, time: 1000 }, function () {
                                obj.del();
                                loadInvoiceList(); // Refresh sidebar too
                                if (currentInvoiceId == obj.data.id) {
                                    selectInvoice('');
                                }
                            });
                        } else {
                            layer.msg(res.msg, { icon: 2 });
                        }
                    },
                    error: function () {
                        layer.close(loading);
                        layer.msg('网络或者权限错误', { icon: 2 });
                    }
                });
            });
        }
    });
</script>
