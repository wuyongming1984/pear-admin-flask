<!DOCTYPE html>
<html lang="zh-cn">

<head>
    <meta charset="utf-8" />
    <title>新增出库任务</title>
    <meta name="renderer" content="webkit" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <link rel="stylesheet" href="/static/component/pear/css/pear.css" />
</head>

<body class="pear-container">
    <form class="layui-form" action="">
        <div class="mainBox">
            <div class="main-container">
                <div class="layui-form-item">
                    <label class="layui-form-label">所属项目</label>
                    <div class="layui-input-block">
                        <select name="project_id" lay-verify="required" lay-filter="project-select">
                            <option value="">请选择项目</option>
                            {% for p in projects %}
                            <option value="{{ p.id }}">{{ p.project_name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">选择物料</label>
                    <div class="layui-input-block">
                        <select name="material_inventory_id" lay-verify="required" lay-filter="material-select"
                            id="material-select">
                            <option value="">请先选择项目</option>
                        </select>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">规格/单位</label>
                    <div class="layui-input-block">
                        <input type="text" id="material_info" readonly class="layui-input layui-bg-gray">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">当前库存</label>
                    <div class="layui-input-block">
                        <input type="text" id="current_stock" readonly class="layui-input layui-bg-gray">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">出库数量</label>
                    <div class="layui-input-block">
                        <input type="number" name="outbound_quantity" lay-verify="required|number" placeholder="请输入数量"
                            class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">领用人/单位</label>
                    <div class="layui-input-block">
                        <input type="text" name="receiver_name" lay-verify="required" placeholder="请输入领用信息"
                            class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">备注</label>
                    <div class="layui-input-block">
                        <textarea name="remark" placeholder="请输入备注" class="layui-textarea"></textarea>
                    </div>
                </div>
                <!-- Hidden fields for API -->
                <input type="hidden" name="material_name" id="hidden_material_name">
                <input type="hidden" name="material_spec" id="hidden_material_spec">
                <input type="hidden" name="material_unit" id="hidden_material_unit">
            </div>
        </div>
        <div class="bottom">
            <div class="button-container">
                <button type="submit" class="pear-btn pear-btn-primary pear-btn-sm" lay-submit=""
                    lay-filter="outbound-save">
                    <i class="layui-icon layui-icon-ok"></i> 提交计划
                </button>
                <button type="reset" class="pear-btn pear-btn-sm">
                    <i class="layui-icon layui-icon-refresh"></i> 重置
                </button>
            </div>
        </div>
    </form>

    <script src="/static/component/layui/layui.js"></script>
    <script src="/static/component/pear/pear.js"></script>
    <script>
        layui.use(['form', 'jquery'], function () {
            var form = layui.form;
            var $ = layui.jquery;
            var currentStockData = [];

            // Pre-load logic for target_inventory
            {% if target_inventory %}
            var targetInv = {
                id: {{ target_inventory.id }
        },
            project_id: {{ target_inventory.project_id }},
            material_name: '{{ target_inventory.material_name }}',
            material_spec: '{{ target_inventory.material_spec }}',
            material_unit: '{{ target_inventory.material_unit or "" }}', // Assuming unit is not in inventory table explicitly but spec usually has it or fetched. 
            // Wait, MaterialInventoryORM doesn't have 'unit'. It has 'material_spec'.
            // Checking MaterialPlanningORM: has field 'unit'. 
            // Checking MaterialInventoryORM: does NOT have 'unit'.
            // So unit might be missing if relying solely on inventory record.
            // However, let's check standard flow. logic relies on item.material_unit.
            // If it's missing, it displays '-'.
            current_quantity: {{ target_inventory.current_stock }}
            };

        // Push to data array
        currentStockData.push(targetInv);

        // Set Project
        $('select[name="project_id"]').val(targetInv.project_id);
        $('select[name="project_id"]').prop('disabled', true); // Lock project

        // Set Material Option
        var html = '<option value="' + targetInv.id + '">' + targetInv.material_name + ' (' + (targetInv.material_spec || '-') + ')</option>';
        $('#material-select').html(html);
        $('#material-select').val(targetInv.id);

        // Fill Info
        $('#material_info').val((targetInv.material_spec || '-') + ' / -'); // Unit is unknown
        $('#current_stock').val(targetInv.current_quantity);
        $('#hidden_material_name').val(targetInv.material_name);
        $('#hidden_material_spec').val(targetInv.material_spec);
        $('#hidden_material_unit').val("");

        form.render();
        {% endif %}

        form.on('select(project-select)', function (data) {
            var projectId = data.value;
            if (!projectId) return;

            $.get('/api/v1/material/inventory', { project_id: projectId, limit: 1000 }, function (res) {
                if (res.code === 0) {
                    currentStockData = res.data;
                    var html = '<option value="">请选择库存物料</option>';
                    res.data.forEach(function (item) {
                        html += '<option value="' + item.id + '">' + item.material_name + ' (' + (item.material_spec || '-') + ')</option>';
                    });
                    $('#material-select').html(html);
                    form.render('select');
                }
            });
        });

        form.on('select(material-select)', function (data) {
            var inventoryId = data.value;
            var item = currentStockData.find(function (i) { return i.id == inventoryId; });
            if (item) {
                // Logic to handle potential missing unit
                var unit = item.material_unit || '-';
                // Note: API returns material_unit if available in JSON? 
                // InventoryORM JSON: material_name, material_spec, current_stock... NO UNIT.
                // So unit will always be missing unless we join/fetch it.
                // But in original flow, where does 'item.material_unit' come from?
                // '/api/v1/material/inventory' returns InventoryORM.json().
                // InventoryORM.json() does NOT include unit.
                // So unit is likely missing in current implementation too?
                // Let's stick to existing behavior.

                $('#material_info').val((item.material_spec || '-') + ' / ' + unit);
                $('#current_stock').val(item.current_quantity || item.current_stock); // JSON has current_stock. JS Logic used current_quantity?
                // Wait, let's check API response for Inventory.
                // InventoryORM.json(): returns "current_stock".
                // But JS in line 117 uses "item.current_quantity".
                // This implies the JS might be broken or I misread something.
                // Let's check `material.py` -> `get_inventory` -> `json()`.
                // It returns "current_stock".
                // So existing JS `$('#current_stock').val(item.current_quantity);` might be returning undefined if it expects `current_quantity`.
                // Let's correct it to `item.current_stock` while we are here, or support both.

                var stock = item.current_stock !== undefined ? item.current_stock : (item.current_quantity !== undefined ? item.current_quantity : 0);
                $('#current_stock').val(stock);

                $('#hidden_material_name').val(item.material_name);
                $('#hidden_material_spec').val(item.material_spec);
                $('#hidden_material_unit').val(item.material_unit);
            }
        });

        form.on('submit(outbound-save)', function (data) {
            var stock = parseFloat($('#current_stock').val() || 0);
            var qty = parseFloat(data.field.outbound_quantity);
            if (qty > stock) {
                layer.msg("出库数量不能大于当前库存", { icon: 2 });
                return false;
            }

            $.ajax({
                url: '/api/v1/material/outbound',
                data: JSON.stringify(data.field),
                dataType: 'json',
                contentType: 'application/json',
                type: 'post',
                success: function (result) {
                    if (result.code === 0) {
                        layer.msg(result.msg, { icon: 1, time: 1000 }, function () {
                            parent.layer.close(parent.layer.getFrameIndex(window.name));
                            // Refresh different tables depending on where it was called
                            // If parent has inventory-table
                            if (parent.layui.table.query && parent.layui.table.query('inventory-table')) { // Check if exists?
                                // layui table doesn't have query check easily.
                                // Just try reloading both.
                            }
                            // Safely try reload
                            try { parent.layui.table.reload("outbound-table"); } catch (e) { }
                            try { parent.layui.table.reload("inventory-table"); } catch (e) { }
                        });
                    } else {
                        layer.msg(result.msg, { icon: 2 });
                    }
                }
            });
            return false;
        });
        });
    </script>
</body>

</html>
