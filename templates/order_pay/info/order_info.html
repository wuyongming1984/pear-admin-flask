<!-- 引入 layui 样式，iframe 模式下也需要 -->
<link rel="stylesheet" href="/static/component/layui/css/layui.css" />
<link rel="stylesheet" href="/static/component/pear/css/pear.css" />
<style>
  /* ==================== 赛博工业设计规范 ==================== */
  :root {
    --accent-primary: #00e5ff;
    --accent-glow: rgba(0, 229, 255, 0.3);
    --bg-deep: #0f172a;
    --bg-surface: rgba(30, 41, 59, 0.7);
    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
    --border-dim: rgba(255, 255, 255, 0.05);
    --border-glow: rgba(0, 229, 255, 0.2);
    --radius-lg: 12px;
    --radius-md: 8px;
  }

  body {
    background-color: var(--bg-deep);
    background-image: radial-gradient(circle at 2px 2px, rgba(255, 255, 255, 0.02) 1px, transparent 0);
    background-size: 24px 24px;
    color: var(--text-primary);
    font-family: 'Inter', -apple-system, sans-serif;
    padding: 20px;
    margin: 0;
  }

  .order-form-container {
    max-width: 1100px;
    margin: 0 auto;
    background: var(--bg-surface);
    backdrop-filter: blur(20px);
    border: 1px solid var(--border-dim);
    border-radius: var(--radius-lg);
    padding: 30px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
  }

  .form-title {
    font-size: 22px;
    font-weight: 700;
    color: var(--text-primary);
    margin-bottom: 30px;
    padding-left: 15px;
    border-left: 4px solid var(--accent-primary);
    letter-spacing: 1px;
    text-shadow: 0 0 10px var(--accent-glow);
  }

  /* 区块装饰 */
  .section-wrap {
    background: rgba(255, 255, 255, 0.02);
    border: 1px solid var(--border-dim);
    border-radius: var(--radius-md);
    padding: 24px;
    margin-bottom: 24px;
    position: relative;
  }

  .section-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--accent-primary);
    text-transform: uppercase;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .section-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: linear-gradient(to right, var(--border-glow), transparent);
  }

  /* 网格布局 */
  .form-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px 40px;
  }

  .form-item {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .form-item label {
    font-size: 12px;
    color: var(--text-secondary);
    font-weight: 500;
  }

  /* 输入框美化 */
  .layui-input,
  .layui-textarea,
  .layui-select,
  .layui-form-select .layui-input {
    background: rgba(15, 23, 42, 0.6) !important;
    border: 1px solid var(--border-dim) !important;
    color: var(--text-primary) !important;
    border-radius: var(--radius-md) !important;
    height: 40px;
    transition: all 0.3s;
  }

  .layui-input:focus,
  .layui-textarea:focus,
  .layui-form-select .layui-input:focus {
    border-color: var(--accent-primary) !important;
    box-shadow: 0 0 0 3px var(--accent-glow) !important;
    background: rgba(15, 23, 42, 0.8) !important;
  }

  .layui-input[readonly] {
    background: rgba(255, 255, 255, 0.05) !important;
    color: var(--text-secondary) !important;
    cursor: default;
  }

  /* 下拉菜单弹出层美化 */
  .layui-form-select dl {
    background: var(--bg-deep) !important;
    border: 1px solid var(--border-glow) !important;
    color: var(--text-primary) !important;
  }

  .layui-form-select dl dd:hover {
    background: var(--accent-glow) !important;
  }

  .layui-form-select dl dd.layui-this {
    background: var(--accent-primary) !important;
    color: #000 !important;
  }

  /* 财务特定样式 */
  .financial-grid {
    display: grid;
    grid-template-columns: 300px 1fr;
    gap: 20px;
  }

  #amount-in-words {
    font-family: 'JetBrains Mono', monospace;
    color: var(--accent-primary) !important;
  }

  /* 附件区域 */
  .attachment-panel {
    margin-top: 10px;
  }

  .attachment-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 12px;
    margin-top: 15px;
  }

  .attachment-item {
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid var(--border-dim);
    border-radius: var(--radius-md);
    padding: 12px;
    display: flex;
    align-items: center;
    gap: 12px;
    transition: all 0.2s;
  }

  .attachment-item:hover {
    border-color: var(--accent-primary);
    background: rgba(0, 229, 255, 0.05);
  }

  .attachment-item .file-icon {
    font-size: 24px;
    color: var(--accent-primary);
  }

  .file-main {
    flex: 1;
    min-width: 0;
  }

  .file-code {
    font-size: 10px;
    color: var(--accent-primary);
    font-family: 'JetBrains Mono', monospace;
  }

  .file-name {
    font-size: 13px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--text-primary);
  }

  .file-size {
    font-size: 11px;
    color: var(--text-secondary);
  }

  .file-ops {
    display: flex;
    gap: 10px;
  }

  .file-ops i {
    cursor: pointer;
    font-size: 16px;
    transition: 0.2s;
  }

  .file-ops .layui-icon-download-circle:hover {
    color: var(--accent-primary);
  }

  .file-ops .layui-icon-close:hover {
    color: #ff5252;
  }

  .attachment-empty {
    text-align: center;
    color: var(--text-secondary);
    padding: 30px;
    font-size: 13px;
    border: 1px dashed var(--border-dim);
    border-radius: var(--radius-md);
  }

  /* 底部按钮 */
  .form-actions {
    margin-top: 40px;
    display: flex;
    justify-content: flex-end;
    gap: 12px;
    padding-top: 30px;
    border-top: 1px solid var(--border-dim);
  }

  .layui-btn {
    border-radius: var(--radius-md) !important;
    height: 40px;
    line-height: 40px;
    padding: 0 24px;
    font-weight: 600;
  }

  .layui-btn-primary {
    background: transparent !important;
    border-color: var(--border-dim) !important;
    color: var(--text-secondary) !important;
  }

  .layui-btn-normal {
    background: var(--accent-primary) !important;
    color: #000 !important;
  }

  #confirm-btn {
    background: var(--accent-primary) !important;
    color: #000 !important;
    box-shadow: 0 0 15px var(--accent-glow);
  }

  .print-btn {
    background: rgba(255, 255, 255, 0.1) !important;
    color: #fff !important;
  }

  /* 解决 layui select 内部箭头颜色 */
  .layui-form-select .layui-edge {
    border-top-color: var(--text-secondary);
  }

  @media print {

    .form-actions,
    .attachment-upload,
    .file-ops {
      display: none;
    }

    body {
      background: #fff;
      color: #000;
      padding: 0;
    }

    .order-form-container {
      box-shadow: none;
      border: none;
      max-width: 100%;
      width: 100%;
      padding: 0;
    }
  }
</style>
<div class="order-form-container">
  <form class="layui-form" lay-filter="order-form">
    <input type="hidden" name="id" id="res-id" value="0" />
    <!-- 表单标题 -->
    <div class="form-title" id="form-title-text">订单信息录入</div>

    <!-- 订单详情部分 -->
    <div class="section-wrap">
      <div class="section-title">订单基础信息</div>
      <div class="form-grid">
        <div class="form-item">
          <label>订单编号</label>
          <input type="text" class="layui-input" name="order_number" id="order-number" readonly />
        </div>
        <div class="form-item">
          <label>下料时间</label>
          <input type="text" class="layui-input" name="cutting_time" id="cutting_time" placeholder="yyyy-MM-dd" />
        </div>
        <div class="form-item">
          <label>材料名称</label>
          <select name="material_name" id="material_name" lay-search lay-verify="required">
            <option value="">请选择材料名称</option>
          </select>
        </div>
        <div class="form-item">
          <label>预计到场时间</label>
          <input type="text" class="layui-input" name="arrival_time" id="estimated_arrival_time"
            placeholder="yyyy-MM-dd" />
        </div>
        <div class="form-item">
          <label>项目名称</label>
          <select name="project_name" id="project_name" lay-search>
            <option value="">请选择项目名称</option>
          </select>
        </div>
        <div class="form-item">
          <label>供应商联系人</label>
          <select name="supplier_contact_person" id="supplier_contact_person" lay-search

        <div class="form-item">

    <!-- 材料明细部分 -->
    <div class="section-wrap">

        <label>内容描述</label>
        <textarea name="material_details" class="layui-textarea" placeholder="请输入材料明细"></textarea>

      <div class="attachment-panel">
        <div class="attachment-upload">

            <i class="layui-icon layui-icon-upload"></i> 添加附件
          </button>
        </div>
        <input type="hidden" name="attachments" id="attachments-data" />
        <div class="attachment-list" id="attachment-list">
          <div class="attachment-empty">暂无附件</div>
        </div>
      </div>
    </div>

    <!-- 财务信息部分 -->
    <div class="section-wrap">
      <div class="section-title">财务结算</div>
      <div class="financial-grid">
        <div class="form-item">
          <label>订单金额 (CNY)</label>
          <input type="number" class="layui-input" name="order_amount" id="order-amount" step="0.01" />
        </div>
        <div class="form-item">
          <label>人民币大写</label>
          <input type="text" class="layui-input" name="amount_in_words" id="amount-in-words" readonly />
        </div>

    </div>

    <!-- 负责人信息部分 -->
    <div class="section-wrap">
      <div class="section-title">流程负责人</div>

          <label>材料负责人</label>
          <input type="text" class="layui-input" name="material_manager" />

    <!-- 表单操作按钮 -->
    <div class="form-actions">
      <button type="button" class="layui-btn layui-btn-primary" id="cancel-btn">取消</button>

  </form>
</div>

<script src="/static/component/layui/layui.js"></script>
<script>
  layui.use(['form', 'layer', 'jquery', 'upload', 'laydate'], function () {
    var form = layui.form;
    var $ = layui.$;
    var upload = layui.upload;
    var layer = layui.layer;
    var laydate = layui.laydate;

    // 获取 URL 参数中的 id
    var urlParams = new URLSearchParams(window.location.search);
    var orderId = urlParams.get('id');

    // 存储附件列表
    var attachmentList = [];
    var attachmentSequence = 0;
    var currentOrderNumber = '';

    // 初始化日期选择器
    laydate.render({ elem: '#cutting_time', type: 'date', theme: 'grid' });
    laydate.render({ elem: '#estimated_arrival_time', type: 'date', theme: 'grid' });

    // 数字转中文大写函数
    function numberToChinese(num) {
      if (isNaN(num) || num === "") return "";
      var cnNums = ['零', '壹', '贰', '叁', '肆', '伍', '陆', '柒', '捌', '玖'];
      var cnIntRadice = ['', '拾', '佰', '仟'];
      var cnIntUnits = ['', '万', '亿', '兆'];
      var cnDecUnits = ['角', '分', '毫', '厘'];
      var cnInteger = '整';
      var cnIntLast = '元';
      var maxNum = 999999999999999.9999;
      var IntegerNum, StringNum, parts, zeroCount, IntLen, n, p, q, m, isNegative = '';

      if (num === 0) return cnNums[0] + cnIntLast + cnInteger;
      if (num < 0) { isNegative = '负'; num = -num; }
      if (num > maxNum) return '';
      StringNum = num.toString();
      if (StringNum.indexOf('.') === -1) {
        IntegerNum = StringNum; parts = [];
      } else {
        parts = StringNum.split('.'); IntegerNum = parts[0];
      }
      zeroCount = 0; IntLen = IntegerNum.length;
      var chineseStr = '';
      for (var i = 0; i < IntLen; i++) {
        n = IntegerNum.substring(i, i + 1);
        p = IntLen - i - 1; q = p / 4; m = p % 4;
        if (n === '0') {
          zeroCount++;
        } else {
          if (zeroCount > 0) chineseStr += cnNums[0];
          zeroCount = 0; chineseStr += cnNums[parseInt(n)] + cnIntRadice[m];
        }
        if (m === 0 && zeroCount < 4) chineseStr += cnIntUnits[Math.floor(q)];
      }
      chineseStr += cnIntLast;
      if (parts && parts.length > 1 && parts[1] !== '') {
        var decLen = parts[1].length;
        for (var j = 0; j < decLen && j < 4; j++) {
          n = parts[1].substring(j, j + 1);
          if (n !== '0') chineseStr += cnNums[parseInt(n)] + cnDecUnits[j];
        }
      }
      if (chineseStr === '') chineseStr += cnNums[0] + cnIntLast + cnInteger;
      else if (parts && parts.length > 1 && parts[1] === '') chineseStr += cnInteger;
      return isNegative + chineseStr;
    }

    // 金额输入监听
    $('#order-amount').on('input', function () {
      var val = parseFloat($(this).val()) || 0;
      $('#amount-in-words').val(numberToChinese(val));
    });

    // 格式化文件大小
    function formatFileSize(bytes) {
      if (bytes === 0) return '0 B';
      var k = 1024, sizes = ['B', 'KB', 'MB', 'GB'], i = Math.floor(Math.log(bytes) / Math.log(k));
      return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
    }

    // 获取文件图标
    function getFileIcon(fileName) {
      if (!fileName) return 'layui-icon-file';
      var ext = fileName.split('.').pop().toLowerCase();
      var iconMap = { 'pdf': 'layui-icon-file-pdf', 'doc': 'layui-icon-file', 'docx': 'layui-icon-file', 'xls': 'layui-icon-file-excel', 'xlsx': 'layui-icon-file-excel', 'jpg': 'layui-icon-picture', 'png': 'layui-icon-picture', 'txt': 'layui-icon-file' };
      return iconMap[ext] || 'layui-icon-file';
    }

    // 渲染附件列表
    function renderAttachmentList() {
      var $list = $('#attachment-list');
      if (attachmentList.length === 0) {
        $list.html('<div class="attachment-empty">暂无附件</div>');
        return;
      }
      var html = '';
      attachmentList.forEach(function (file, index) {
        html += `<div class="attachment-item" data-index="${index}">
          <i class="layui-icon ${getFileIcon(file.name || file.filename)} file-icon"></i>
          <div class="file-main">
            <div class="file-code">${file.code || '-'}</div>
            <div class="file-name" title="${file.name || file.filename}">${file.name || file.filename}</div>
            <div class="file-size">${formatFileSize(file.size || 0)}</div>
          </div>
          <div class="file-ops">
            ${file.url ? `<i class="layui-icon layui-icon-download-circle" onclick="window.open('${file.url}')" title="下载"></i>` : ''}
            <i class="layui-icon layui-icon-close" data-idx="${index}" title="删除"></i>
          </div>
        </div>`;
      });
      $list.html(html);
      // 绑定删除事件
      $('.file-ops .layui-icon-close').click(function () {
        var idx = $(this).data('idx');
        layer.confirm('确定删除吗？', function (index) {
          attachmentList.splice(idx, 1);
          renderAttachmentList();
          layer.close(index);
        });
      });
    }

    // 初始化上传
    upload.render({
      elem: '#upload-attachment',
      url: '/api/v1/upload/',
      accept: 'file',
      multiple: true,
      headers: { Authorization: "Bearer " + localStorage.getItem("access_token") },
      done: function (res) {
        if (res.code === 0) {
          attachmentList.push({
            id: res.data.id,
            code: currentOrderNumber + 'F' + (attachmentList.length + 1).toString().padStart(3, '0'),
            name: res.data.filename || res.data.original_filename,
            url: res.data.url,
            size: res.data.size
          });
          renderAttachmentList();
          layer.msg('上传成功');
        } else {
          layer.msg(res.msg || '上传失败', { icon: 2 });
        }
      }
    });

    // 生成订单号
    function generateOrderNumber() {
      var now = new Date();
      var dateStr = now.getFullYear() + String(now.getMonth() + 1).padStart(2, '0') + String(now.getDate()).padStart(2, '0');
      return 'D' + dateStr + String(now.getTime() % 1000).padStart(3, '0');
    }

    // 加载下拉数据
    function loadSelectionData() {
      var d1 = $.ajax({ url: "/api/v1/project/", data: { limit: 1000 }, headers: { Authorization: "Bearer " + localStorage.getItem("access_token") } });
      var d2 = $.ajax({ url: "/api/v1/supplier/", data: { limit: 1000 }, headers: { Authorization: "Bearer " + localStorage.getItem("access_token") } });
      var d3 = $.ajax({ url: "/api/v1/dictionary/detail/list", data: { dic_id: 35, limit: 1000 }, headers: { Authorization: "Bearer " + localStorage.getItem("access_token") } });

      return Promise.all([d1, d2, d3]).then(function (results) {
        // 项目
        var pRes = results[0];
        if (pRes.code === 0) {
          var html = '<option value="">请选择项目名称</option>';
          pRes.data.forEach(p => html += `<option value="${p.project_name}">${p.project_name}</option>`);
          $('#project_name').html(html);
        }
        // 供应商与联系人
        var sRes = results[1];
        if (sRes.code === 0) {
          var cHtml = '<option value="">请选择供应商联系人</option>';
          sRes.data.forEach(s => {
            if (s.contact_person) {
              cHtml += `<option value="${s.contact_person}" data-supplier-id="${s.id}" data-phone="${s.phone}">${s.contact_person}</option>`;
            }
          });
          $('#supplier_contact_person').html(cHtml);
        }
        // 材料名称
        var mRes = results[2];
        if (mRes.code === 0) {
          var mHtml = '<option value="">请选择材料名称</option>';
          mRes.data.forEach(m => mHtml += `<option value="${m.value}">${m.value}</option>`);
          $('#material_name').html(mHtml);
        }
        form.render('select');
        return results; // 返回结果以便后续链式调用
      });
    }

    // 供应商联动逻辑
    form.on('select(supplier_contact_person)', function (data) {
      if (data.value) {
        var sid = $(data.elem).find('option:selected').data('supplier-id');
        var phone = $(data.elem).find('option:selected').data('phone');
        $('#supplier_id_hidden').val(sid || '');
        $('#contact_phone').val(phone || '');
        form.render('select');
      } else {
        $('#supplier_id_hidden').val('');
        $('#contact_phone').val('');
      }
    });

    // 页面启动逻辑
    loadSelectionData().then(function () {
      if (orderId && orderId !== '0') {
        $('#form-title-text').text('编辑订单');
        $('#print-btn').show();
        $.ajax({
          url: '/api/v1/order/' + orderId,
          headers: { Authorization: "Bearer " + localStorage.getItem("access_token") },
          success: function (res) {
            if (res.code === 0) {
              var data = res.data;
              currentOrderNumber = data.order_number;
              form.val('order-form', data);
              if (data.supplier_id) {
                $('#supplier_id_hidden').val(data.supplier_id);
              }
              attachmentList = data.attachments_list || [];
              renderAttachmentList();
              $('#order-amount').trigger('input');
            }
          }
        });
      } else {
        currentOrderNumber = generateOrderNumber();
        $('#order-number').val(currentOrderNumber);
        var now = new Date();
        $('#cutting_time').val(now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0'));

        // 自动填充项目和联系人 (确保在数据加载完成后执行)
        var projParam = urlParams.get('project_name');
        var contactParam = urlParams.get('contact');
        if (projParam) $('#project_name').val(projParam);
        if (contactParam) {
          $('#supplier_contact_person').val(contactParam);
          // 确保 Layui 已经准备好下拉选项
          var $opt = $('#supplier_contact_person option[value="' + contactParam + '"]');
          if ($opt.length && $opt.val()) {
            $('#supplier_id_hidden').val($opt.data('supplier-id') || '');
            $('#contact_phone').val($opt.data('phone') || '');
          }
        }
        form.render('select');
      }
    });

    // 提交逻辑
    form.on('submit(order-form-btn)', function (data) {
      var field = data.field;
      // 将附件列表序列化为 JSON 字符串
      field.attachments = JSON.stringify(attachmentList);
      field.id = orderId && orderId !== '0' ? parseInt(orderId) : 0;

      var type = field.id === 0 ? "POST" : "PUT";
      var url = field.id === 0 ? "/api/v1/order/" : "/api/v1/order/" + field.id;

      $.ajax({
        url: url,
        type: type,
        data: JSON.stringify(field),
        contentType: 'application/json',
        headers: { Authorization: "Bearer " + localStorage.getItem("access_token") },
        success: function (res) {
          if (res.code === 0) {
            layer.msg('保存成功', { icon: 1, time: 1000 }, function () {
              parent.layer.close(parent.layer.getFrameIndex(window.name));
            });
          } else {
            layer.msg(res.msg || '保存失败', { icon: 2 });
          }
        }
      });
      return false;
    });

    $('#cancel-btn').click(function () {
      parent.layer.close(parent.layer.getFrameIndex(window.name));
    });

    $('#print-btn').click(function () {
      if (orderId) {
        window.open('/order_pay/info/print_order.html?id=' + orderId, '_blank');
      } else {
        layer.msg('请先保存订单后再打印', { icon: 0 });
      }
    });
  });
</script>
