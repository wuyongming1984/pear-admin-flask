<link rel="stylesheet" href="/static/admin/css/order_pay_refined.css" />
<style>
  /* 解决 Pear Admin Tab 覆盖问题 - Scoped */
  #order-page-root {
    height: 100%;
    width: 100%;
    box-sizing: border-box;
    /* padding: 10px;  Prevent full flush if needed, but refined-container usually handles it */
  }

  /* Scope global body resets if any */
  #order-page-root .refined-container {
    margin: 0 !important;
    height: calc(100vh - 20px) !important;
    /* Adjust for padding/tabs */
    border-radius: 0 !important;
    box-sizing: border-box;
  }
</style>

<div id="order-page-root">
  <div class="refined-container">
    <!-- 左侧项目侧边栏 -->
    <div class="side-panel">
      <div class="side-panel-header">
        <div class="search-input-wrapper">
          <i class="layui-icon layui-icon-search"></i>
          <input type="text" id="order-project-search" class="search-input" placeholder="筛选项目..." />
        </div>
      </div>
      <div class="project-list" id="order-project-list">
        <!-- 项目加载中... -->
      </div>
    </div>

    <!-- 中间供应商联系人侧边栏 -->
    <div class="side-panel" style="border-right: 1px solid var(--border-dim);">
      <div class="side-panel-header">
        <div class="search-input-wrapper">
          <i class="layui-icon layui-icon-search"></i>
          <input type="text" id="order-contact-search" class="search-input" placeholder="筛选联系人..." />
        </div>
      </div>
      <div class="project-list" id="order-contact-list">
        <div class="project-item active" data-id="all">
          <div class="project-name">全部联系人</div>
          <div class="project-desc">不限供应商负责人</div>
        </div>
        <!-- 联系人项将通过 JS 动态渲染 -->
      </div>
    </div>

    <!-- 右侧主内容区 -->
    <div class="main-content">
      <div class="content-header">
        <div class="content-title" id="current-project-title">全部项目 - 订单明细</div>

        <!-- 新增：统计信息栏 -->
        <div class="header-statistics"
          style="display: flex; gap: 20px; align-items: center; margin-left: 20px; padding: 5px 15px; background: rgba(255, 255, 255, 0.05); border-radius: 4px; border: 1px solid var(--border-dim);">
          <div class="stat-item" style="display: flex; align-items: baseline; gap: 5px;">
            <span style="font-size: 12px; color: var(--text-secondary);">订单合计:</span>
            <span id="header-total-order"
              style="font-family: 'JetBrains Mono'; font-weight: bold; color: var(--text-primary);">¥0.00</span>
          </div>
          <div class="stat-item" style="display: flex; align-items: baseline; gap: 5px;">
            <span style="font-size: 12px; color: var(--text-secondary);">付款合计:</span>
            <span id="header-total-payment"
              style="font-family: 'JetBrains Mono'; font-weight: bold; color: #ff9800;">¥0.00</span>
          </div>
          <div class="stat-item" style="display: flex; align-items: baseline; gap: 5px;">
            <span style="font-size: 12px; color: var(--text-secondary);">余额合计:</span>
            <span id="header-total-balance"
              style="font-family: 'JetBrains Mono'; font-weight: bold; color: #f44336;">¥0.00</span>
          </div>
        </div>

        <div class="content-actions">
          <div class="search-input-wrapper" style="width: 200px; margin-right: 10px;">
            <i class="layui-icon layui-icon-search"></i>
            <input type="text" id="order-number-search" class="search-input" placeholder="输入订单号搜索..." />
          </div>
          <div class="field-setting-btn" id="field-setting-btn">
            <i class="layui-icon layui-icon-cols"></i>
            <div class="field-dropdown" id="field-dropdown">
              <label class="field-option"><input type="checkbox" checked data-field="project-name"> 项目名称</label>
              <label class="field-option"><input type="checkbox" checked data-field="material"> 材料名称</label>
              <label class="field-option"><input type="checkbox" checked data-field="contact"> 供应商联系人</label>
              <label class="field-option"><input type="checkbox" checked data-field="manager"> 负责人</label>
              <label class="field-option"><input type="checkbox" checked data-field="amount"> 订单金额</label>
              <label class="field-option"><input type="checkbox" checked data-field="balance"> 当前余额</label>
              <label class="field-option"><input type="checkbox" checked data-field="date"> 时间日期</label>
              <label class="field-option"><input type="checkbox" checked data-field="pay-no"> 付款单号</label>
              <label class="field-option"><input type="checkbox" checked data-field="details"> 材料明细</label>
            </div>
          </div>
          <button class="layui-btn layui-btn-normal" id="add-order-btn">
            <i class="layui-icon layui-icon-add-1"></i> 新增订单
          </button>
        </div>
      </div>

      <!-- 卡片列表容器 -->
      <div class="card-grid" id="order-card-container">
        <!-- 订单卡片将通过 JS 动态渲染 -->
        <div style="grid-column: 1/-1; text-align: center; padding: 50px; color: #999;">
          <i class="layui-icon layui-icon-loading layui-anim layui-anim-rotate layui-anim-loop"
            style="font-size: 30px;"></i>
          <p style="margin-top: 10px;">正在加载订单数据...</p>
        </div>
      </div>
    </div>
  </div>
</div>
<!-- 原有的 order-form-wrapper 已移除，改为 iframe 弹窗加载 order_info.html -->

<script type="text/html" id="order-toolbar">
    <div class="layui-btn-container">
      <button class="layui-btn layui-btn-sm" lay-event="order-toolbar-add">
        新增订单
      </button>
      <div class="balance-filter-dropdown" style="display: inline-block; margin-left: 10px;">
        <button class="layui-btn layui-btn-sm layui-btn-normal" type="button" id="balance-filter-trigger">
          <i class="layui-icon layui-icon-filter"></i> 付款状态筛选
        </button>
      </div>
    </div>
  </script>
<script type="text/html" id="order-tool">
    <div class="layui-btn-container">
      <button
        class="layui-btn layui-btn-sm layui-bg-blue"
        lay-event="order-tool-edit"
      >
        编辑
      </button>
      <button
        class="layui-btn layui-btn-sm layui-bg-orange"
        lay-event="order-tool-print"
      >
        打印订单
      </button>
      <button
        class="layui-btn layui-btn-sm layui-bg-green"
        lay-event="order-tool-pay"
      >
        新增付款单
      </button>
      <button
        class="layui-btn layui-btn-sm layui-bg-red"
        lay-event="order-tool-del"
      >
        删除
      </button>
    </div>
  </script>
<script>
  layui.use(["table", "form", "layer", "laydate", "upload"], function () {
    var table = layui.table;
    var form = layui.form;
    var layer = layui.layer;
    var laydate = layui.laydate;
    var upload = layui.upload;
    var $ = layui.$;





    // 存储材料名称映射（ID -> 名称）
    var materialNamesMap = {};

    // 加载项目列表（返回 Promise，用于等待加载完成）
    function loadProjects() {
      return new Promise(function (resolve) {
        $.ajax({
          url: window.location.origin + "/api/v1/project/",
          type: "GET",
          data: {
            limit: 9999  // 获取所有项目，不分页
          },
          headers: {
            Authorization: "Bearer " + localStorage.getItem("access_token"),
          },
          success: function (res) {
            if (res.code === 0 && res.data) {
              allProjects = res.data; // 赋值给全局变量
              var html = '<option value="">请选择项目名称</option>';
              res.data.forEach(function (project) {
                html += '<option value="' + project.project_name + '">' + project.project_name + '</option>';
              });
              renderProjectList(allProjects); // 渲染项目列表
              $('select[name="project_name"]').html(html);
              form.render('select');
            }
            resolve();
          },
          error: function () {
            resolve();
          }
        });
      });
    }

    // 加载材料名称列表（从字典表，返回 Promise）
    function loadMaterialNames() {
      return new Promise(function (resolve) {
        $.ajax({
          url: window.location.origin + "/api/v1/dictionary/detail/list",
          type: "GET",
          data: {
            dic_id: 35,  // 材料名称代码字典的ID (clmc)
            limit: 9999  // 获取所有材料，不分页
          },
          headers: {
            Authorization: "Bearer " + localStorage.getItem("access_token"),
          },
          success: function (res) {
            if (res.code === 0 && res.data) {
              // 构建ID到名称的映射
              materialNamesMap = {};
              var html = '<option value="">请选择材料名称</option>';
              res.data.forEach(function (material) {
                // 使用 code 作为 option 的 value（材料代码）
                html += '<option value="' + material.code + '">' + material.value + '</option>';
                // 建立代码到名称的映射（用于显示）
                materialNamesMap[material.code] = material.value;
                // 同时保留值到名称的映射，兼容旧数据
                materialNamesMap[material.value] = material.value;
              });
              $('select[name="material_name"]').html(html);
              form.render('select');
            }
            resolve();
          },
          error: function () {
            resolve();
          }
        });
      });
    }



    // 加载供应商列表（用于付款单表单）
    function loadSuppliersForOrderPay() {
      $.ajax({
        url: window.location.origin + "/api/v1/supplier/",
        type: "GET",
        data: { limit: 9999 },
        headers: {
          Authorization: "Bearer " + localStorage.getItem("access_token"),
        },
        success: function (res) {
          if (res.code === 0 && res.data) {
            var html = '<option value="">请选择供应商</option>';
            res.data.forEach(function (supplier) {
              html += '<option value="' + supplier.id + '">' + supplier.name + '</option>';
            });
            $('#order-pay-info-form select[name="payer_supplier_id"]').html(html);
            $('#order-pay-info-form select[name="payee_supplier_id"]').html(html);
            form.render('select');

            if (res.data.length === 0) {
              console.warn("加载供应商成功，但列表为空");
              // Optional: layer.msg("暂无供应商数据，请先维护供应商", {icon: 0});
            }
          } else {
            layer.msg(res.msg || '加载供应商列表失败', { icon: 2 });
          }
        },
        error: function (xhr, status, error) {
          console.error("加载供应商失败:", error);
          layer.msg('加载供应商失败: ' + (xhr.status || 'Unknown'), { icon: 2 });
        }
      });
    }


    loadMaterialNames();  // 加载材料名称列表

    // 存储付款状态映射（code -> value）
    var paymentStatusMap = {};

    // 存储已选中的付款状态（用于余额计算）
    var selectedPaymentStatuses = new Set();

    // 加载付款状态列表（从字典表）
    function loadPaymentStatuses() {
      return new Promise(function (resolve) {
        $.ajax({
          url: window.location.origin + "/api/v1/dictionary/detail/list",
          type: "GET",
          data: {
            dic_id: 28,  // 付款状态字典的ID (fkzt)
            limit: 100
          },
          headers: {
            Authorization: "Bearer " + localStorage.getItem("access_token"),
          },
          success: function (res) {
            if (res.code === 0 && res.data) {
              // 构建code到value的映射
              paymentStatusMap = {};
              selectedPaymentStatuses.clear(); // 清空选中状态

              res.data.forEach(function (status) {
                // 使用code作为键，value作为显示文本
                paymentStatusMap[status.code] = status.value;
                // 同时建立value到value的映射，兼容可能直接使用value的情况
                paymentStatusMap[status.value] = status.value;
                // 默认全选
                selectedPaymentStatuses.add(status.code);
              });
              console.log('付款状态映射已加载:', paymentStatusMap);
              console.log('默认选中的付款状态:', Array.from(selectedPaymentStatuses));
            }
            resolve();
          },
          error: function () {
            console.error('加载付款状态列表失败');
            resolve();
          }
        });
      });
    }

    // 加载付款状态
    loadPaymentStatuses();

    // ==================== 基础数据状态与映射 ====================
    var materialNamesMap = {};
    var paymentStatusMap = {};
    var allProjects = [];
    // --- 字段筛选功能逻辑 ---
    function initFieldFilter() {
      var $btn = $('#field-setting-btn');
      var $dropdown = $('#field-dropdown');
      var $container = $('#order-card-container');

      // 从 localStorage 恢复配置
      var savedFilter = localStorage.getItem('order_field_filter');
      if (savedFilter) {
        var filterConfig = JSON.parse(savedFilter);
        $dropdown.find('input[type="checkbox"]').each(function () {
          var field = $(this).data('field');
          if (filterConfig[field] === false) {
            $(this).prop('checked', false);
            $container.addClass('hide-' + field);
          }
        });
      }

      // 切换下拉菜单 (改为悬停模式，与付款单页面一致)
      $btn.on('mouseenter', function () {
        $dropdown.stop().fadeIn(200);
      }).on('mouseleave', function () {
        $dropdown.stop().fadeOut(200);
      });

      // 移除 document click 监听，因为悬停模式不需要
      // $(document).on('click', function () { ... });

      // 监听勾选变化
      $dropdown.find('input[type="checkbox"]').on('change', function () {
        var field = $(this).data('field');
        var isChecked = $(this).is(':checked');

        if (isChecked) {
          $container.removeClass('hide-' + field);
        } else {
          $container.addClass('hide-' + field);
        }

        // 保存配置
        saveFilterConfig();
      });

      function saveFilterConfig() {
        var config = {};
        $dropdown.find('input[type="checkbox"]').each(function () {
          config[$(this).data('field')] = $(this).is(':checked');
        });
        localStorage.setItem('order_field_filter', JSON.stringify(config));
      }
    }

    var currentProject = 'all';

    // ==================== 项目与卡片渲染逻辑 ====================

    // 加载项目侧边栏
    function initProjectSidebar() {
      console.log('正在获取项目列表...');
      $.ajax({
        url: window.location.origin + "/api/v1/project/",
        type: "GET",
        headers: { Authorization: "Bearer " + localStorage.getItem("access_token") },
        data: { limit: 9999, has_orders: 'true' },

        success: function (res) {
          console.log('获取项目请求已返回:', res.code);
          if (res.code === 0) {
            allProjects = res.data;
            // 按 ID 倒序排序
            allProjects.sort((a, b) => b.id - a.id);
            renderProjectList(allProjects);
          }
        },
        error: function (xhr) {
          console.error('获取项目失败:', xhr.status);
        }
      });
    }

    var currentProject = 'all';
    var currentContact = 'all'; // 新增：当前选中的联系人
    var allProjects = [];
    var allContacts = []; // 新增：所有联系人列表 [{name: '张三', id: 1}]

    function renderProjectList(projects) {
      var $list = $('#order-project-list');
      // 保留“全部项目”
      var html = `
        <div class="project-item ${currentProject === 'all' ? 'active' : ''}" data-id="all">
          <div class="project-name">全部项目</div>
        </div>
      `;
      projects.forEach(function (p, index) {
        var activeClass = p.project_name === currentProject ? 'active' : '';
        html += `
          <div class="project-item ${activeClass}" data-id="${p.project_name}" style="animation-delay: ${index * 0.05}s">
            <div class="project-name">${p.project_name}</div>
          </div>
        `;
      });
      $list.html(html);
    }

    // 新增：渲染供应商联系人列表
    function renderContactList(contacts) {
      var $list = $('#order-contact-list');
      var html = `
        <div class="project-item ${currentContact === 'all' ? 'active' : ''}" data-id="all">
          <div class="project-name">全部联系人</div>
        </div>
      `;
      contacts.forEach(function (c, index) {
        if (!c || !c.name || c.name === "undefined") return; // Robustness check
        var activeClass = c.name === currentContact ? 'active' : '';
        html += `
          <div class="project-item ${activeClass}" data-id="${c.name}" style="animation-delay: ${index * 0.05}s; display: flex; justify-content: space-between; align-items: center; padding-right: 10px;">
            <div class="project-name" style="flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${c.name}</div>
            <i class="layui-icon layui-icon-website portal-btn" title="获取门户链接" data-id="${c.id}" data-name="${c.name}" style="color: var(--accent-cyan); cursor: pointer; font-size: 14px; opacity: 0.7; transition: all 0.2s;"></i>
          </div>
        `;
      });
      $list.html(html);
    }

    // 更新联系人侧边栏 (Moved out to global scope)
    function updateContactSidebarList(orders) {
      if (!allContacts || allContacts.length === 0) {
        console.warn("allContacts not loaded yet, skipping filtered update");
        return;
      }

      if (currentProject === 'all' && currentContact === 'all' && !$('#order-number-search').val()) {
        return;
      }

      if (currentProject !== 'all') {
        var contactsSet = new Set();
        orders.forEach(function (o) {
          if (o.supplier_contact_person) contactsSet.add(o.supplier_contact_person);
        });

        var contacts = allContacts.filter(function (c) {
          return c && c.name && contactsSet.has(c.name);
        });
        renderContactList(contacts);
      } else {
        renderContactList(allContacts);
      }
    }

    // 模糊搜索项目
    $('#order-project-search').on('input', function () {
      var val = $(this).val().toLowerCase();
      var filtered = allProjects.filter(function (p) {
        return p.project_name.toLowerCase().includes(val);
      });
      renderProjectList(filtered);
    });

    // --- 新增：建立 联系人 -> 项目 索引 ---
    // 为了实现“输入联系人筛选项目”的功能，我们需要知道哪些项目包含该联系人
    var contactToProjectsMap = {}; // key: contactName, value: Set(projectName)
    var isIndexBuilt = false;

    function buildContactProjectIndex() {
      // 获取所有订单用于建立索引 (只获取一次)
      if (isIndexBuilt) return;

      console.log('正在构建 联系人-项目 索引...');
      $.ajax({
        url: window.location.origin + "/api/v1/order/",
        type: "GET",
        headers: { Authorization: "Bearer " + localStorage.getItem("access_token") },
        data: { limit: 9999 }, // 获取足够多的订单以建立关系
        success: function (res) {
          if (res.code === 0 && res.data) {
            contactToProjectsMap = {};
            res.data.forEach(function (o) {
              var pName = o.project_name;
              var cName = o.supplier_contact_person;
              if (pName && cName) {
                if (!contactToProjectsMap[cName]) {
                  contactToProjectsMap[cName] = new Set();
                }
                contactToProjectsMap[cName].add(pName);
              }
            });
            isIndexBuilt = true;
            console.log('索引构建完成，包含联系人数量:', Object.keys(contactToProjectsMap).length);
          }
        }
      });
    }

    // 启动索引构建
    buildContactProjectIndex();

    // 新增：模糊搜索联系人 + 联动筛选项目
    $('#order-contact-search').on('input', function () {
      var val = $(this).val().toLowerCase().trim();

      // 1. 筛选联系人列表 (原有逻辑)
      var filteredContacts = allContacts.filter(function (c) {
        return c.name && c.name.toLowerCase().includes(val);
      });
      renderContactList(filteredContacts);

      // 2. 联动筛选项目列表 (新功能)
      if (!val) {
        // 如果输入为空，显示所有项目
        renderProjectList(allProjects);
        return;
      }

      // 找出所有匹配联系人关联的项目
      var allowedProjects = new Set();

      // 遍历所有已知的联系人关系
      // 注意：这里我们不仅使用 filteredContacts，还需要查找 contactToProjectsMap 中所有匹配的 key
      // 因为 filteredContacts 只包含供应商表中的联系人，而订单中可能有没有在其列的联系人（虽然理论上应该一致）
      // 为了准确，我们遍历索引中的 key
      Object.keys(contactToProjectsMap).forEach(function (cName) {
        if (cName.toLowerCase().includes(val)) {
          contactToProjectsMap[cName].forEach(p => allowedProjects.add(p));
        }
      });

      // 过滤项目列表
      var filteredProjects = allProjects.filter(function (p) {
        return allowedProjects.has(p.project_name);
      });

      renderProjectList(filteredProjects);
    });

    // 新增：订单号搜索事件
    $('#order-number-search').on('input', function () {
      // 使用防抖或简单延迟，这里直接调用 loadOrders
      // 为避免频繁请求，简单做一个延迟
      clearTimeout(this.searchTimeout);
      this.searchTimeout = setTimeout(function () {
        loadOrders();
      }, 300);
    });

    // 项目点击事件
    $(document).on('click', '#order-project-list .project-item', function () {
      $('#order-project-list .project-item').removeClass('active');
      $(this).addClass('active');
      currentProject = $(this).data('id');
      // currentContact = 'all'; // 移除此行：切换项目时，保留当前选中的联系人（如果已选）

      updateHeader();
      loadOrders();
    });

    // 修改：联系人侧边栏现在的加载逻辑：从供应商获取，按供应商ID倒序
    function initContactSidebar() {
      console.log('开始加载联系人数据...');
      $.ajax({
        url: "/api/v1/supplier/",
        type: "GET",
        headers: { Authorization: "Bearer " + localStorage.getItem("access_token") },
        data: { limit: 9999 },
        success: function (res) {
          console.log('获取供应商联系人返回:', res.code);
          if (res.code === 0) {
            // 按供应商 ID 倒序排序
            var suppliers = res.data.sort((a, b) => b.id - a.id);

            var contacts = [];
            var seen = new Set();

            suppliers.forEach(s => {
              if (s.contact_person && !seen.has(s.contact_person)) {
                contacts.push({ name: s.contact_person, id: s.id });
                seen.add(s.contact_person);
              }
            });

            allContacts = contacts;
            renderContactList(allContacts);
          }
        },
        error: function (xhr) {
          console.error('获取供应商联系人失败:', xhr.status);
        }
      });
    }

    // 废弃 updateAssociatedContacts，因为不再仅显示当前项目的联系人

    // 新增：联系人点击事件
    $(document).on('click', '#order-contact-list .project-item', function () {
      $('#order-contact-list .project-item').removeClass('active');
      $(this).addClass('active');
      currentContact = $(this).data('id');

      // 联动筛选项目列表
      if (currentContact === 'all') {
        renderProjectList(allProjects);
      } else {
        // 利用已构建的索引筛选项目
        var allowedProjects = contactToProjectsMap[currentContact] || new Set();
        var filteredProjects = allProjects.filter(function (p) {
          return allowedProjects.has(p.project_name);
        });
        renderProjectList(filteredProjects);
      }

      updateHeader();
      loadOrders();
    });

    // 门户按钮点击事件
    $(document).on('click', '.portal-btn', function (e) {
      e.stopPropagation(); // 阻止冒泡，防止触发联系人选择
      var id = $(this).data('id');
      var name = $(this).data('name');

      var $icon = $(this);
      $icon.addClass('layui-icon-loading layui-anim layui-anim-rotate layui-anim-loop');

      $.ajax({
        url: window.location.origin + `/api/v1/supplier/${id}/token`,
        type: "POST",
        headers: { Authorization: "Bearer " + localStorage.getItem("access_token") },
        success: function (res) {
          $icon.removeClass('layui-icon-loading layui-anim layui-anim-rotate layui-anim-loop');
          if (res.code === 0) {
            var fullUrl = window.location.origin + res.data.url;
            layer.open({
              title: `<span style="color:#7000ff; font-weight:bold;">${name} - 门户访问链接</span>`,
              skin: 'layui-layer-molv',
              content: `<div style="padding:20px; color:#fff;">
                  <p style="margin-bottom:10px; color:#94a3b8;">请复制以下链接发送给供应商：</p>
                  <input type="text" class="layui-input" value="${fullUrl}" id="portal-link-input-${id}" style="color:#00e5ff; border-color:#00e5ff;">
                </div>`,
              btn: ['复制', '关闭'],
              yes: function (index) {
                var input = document.getElementById(`portal-link-input-${id}`);
                input.select();
                document.execCommand("copy");
                layer.msg('已复制到剪贴板', { icon: 1 });
              }
            });
          } else {
            layer.msg(res.msg || '获取失败', { icon: 2 });
          }
        },
        error: function () {
          $icon.removeClass('layui-icon-loading layui-anim layui-anim-rotate layui-anim-loop');
          layer.msg('网络请求失败', { icon: 2 });
        }
      });
    });

    function updateHeader() {
      var pText = currentProject === 'all' ? '全部项目' : currentProject;
      var cText = currentContact === 'all' ? '全部联系人' : currentContact;
      $('#current-project-title').text(pText + ' | ' + cText + ' - 订单明细');
    }

    // 加载并渲染订单卡片
    function loadOrders() {
      var orderNumber = $('#order-number-search').val();

      // 性能优化：如果项目和联系人都是全部，且没有输入搜索关键词，则不加载数据
      if (currentProject === 'all' && currentContact === 'all' && !orderNumber) {
        $('#order-card-container').html('<div style="grid-column: 1/-1; text-align: center; padding: 100px; color: #999;"><i class="layui-icon layui-icon-tips" style="font-size: 50px; color: #ccc;"></i><p style="margin-top: 20px; font-size: 16px;">请选择左侧项目或联系人以查看明细</p></div>');
        return;
      }

      var params = { page: 1, limit: 9999 };
      if (currentProject !== 'all') {
        params.project_name = currentProject;
      }
      if (currentContact !== 'all') {
        params.supplier_contact_person = currentContact;
      }
      if (orderNumber) {
        params.order_number = orderNumber;
      }

      $('#order-card-container').html(`
        <div style="grid-column: 1/-1; text-align: center; padding: 50px; color: #999;">
          <i class="layui-icon layui-icon-loading layui-anim layui-anim-rotate layui-anim-loop" style="font-size: 30px;"></i>
          <p style="margin-top: 10px;">正在加载订单数据...</p>
        </div>
      `);

      // --- 新增：更新联系人侧边栏 ---


      $.ajax({
        url: window.location.origin + "/api/v1/order/",
        type: "GET",
        headers: { Authorization: "Bearer " + localStorage.getItem("access_token") },
        data: params,
        success: function (res) {
          if (res.code === 0) {
            renderOrderCards(res.data);
            updateHeaderStatistics(res.data);
            // 触发侧边栏更新 (仅当没有选定具体联系人时更新，避免列表收缩)
            if (currentContact === 'all') {
              updateContactSidebarList(res.data);
            }
          } else {
            $('#order-card-container').html('<div style="grid-column: 1/-1; text-align: center; padding: 50px; color: #ff5722;">加载失败: ' + res.msg + '</div>');
          }
        }
      });
    }

    // 新增：更新头部统计信息
    function updateHeaderStatistics(orders) {
      if (!orders || orders.length === 0) {
        $('#header-total-order').text('¥0.00');
        $('#header-total-payment').text('¥0.00');
        $('#header-total-balance').text('¥0.00');
        return;
      }

      var totalOrder = 0;
      var totalPayment = 0;
      var totalBalance = 0;

      orders.forEach(function (o) {
        var orderAmt = parseFloat(o.order_amount || 0);
        var payAmt = (o.pays_list || []).reduce((acc, cur) => acc + parseFloat(cur.current_payment_amount || 0), 0);
        var balance = orderAmt - payAmt;

        totalOrder += orderAmt;
        totalPayment += payAmt;
        totalBalance += balance;
      });

      $('#header-total-order').text('¥' + totalOrder.toLocaleString(undefined, { minimumFractionDigits: 2 }));
      $('#header-total-payment').text('¥' + totalPayment.toLocaleString(undefined, { minimumFractionDigits: 2 }));
      $('#header-total-balance').text('¥' + totalBalance.toLocaleString(undefined, { minimumFractionDigits: 2 }));
    }

    function calculateOrderBalance(order) {
      var amount = parseFloat(order.order_amount || 0);
      var paid = parseFloat(order.paid_amount || order.total_paid || 0);
      return amount - paid;
    }

    function renderOrderCards(orders) {
      var $container = $('#order-card-container');
      if (!orders || orders.length === 0) {
        $container.html('<div style="grid-column: 1/-1; text-align: center; padding: 50px; color: #999;">暂无订单记录</div>');
        return;
      }

      // --- 新增：按项目名称排序 ---
      orders.sort(function (a, b) {
        var nameA = (a.project_name || "").toLowerCase();
        var nameB = (b.project_name || "").toLowerCase();
        if (nameA < nameB) return -1;
        if (nameA > nameB) return 1;
        return 0;
      });

      // --- 新增：项目色彩映射 ---
      var projectPalette = [
        '#00e5ff', '#ff9800', '#4caf50', '#2196f3', '#9c27b0',
        '#f44336', '#ffeb3b', '#e91e63', '#00bcd4', '#ff5722',
        '#795548', '#607d8b', '#cddc39', '#ffc107', '#03a9f4'
      ];
      function getProjectColor(name) {
        if (!name || name === '未指定项目') return '#999';
        var hash = 0;
        for (var i = 0; i < name.length; i++) {
          hash = name.charCodeAt(i) + ((hash << 5) - hash);
        }
        var index = Math.abs(hash) % projectPalette.length;
        return projectPalette[index];
      }

      var html = '';
      orders.forEach(function (o, index) {
        var totalPay = (o.pays_list || []).reduce((acc, cur) => acc + parseFloat(cur.current_payment_amount || 0), 0);
        var balance = parseFloat(o.order_amount || 0) - totalPay;
        var color = balance >= 0 ? 'success' : 'warning';
        // 获取项目唯一颜色
        var projectColor = getProjectColor(o.project_name);
        // 用户反馈颜色再浅一点点，调整为 #444444
        var bgStyle = balance <= 0 ? 'background-color: #444444;' : '';
        var matName = o.material_name;
        if (/^\d+$/.test(matName)) matName = materialNamesMap[matName] || matName;

        // 解析附件列表
        var attachmentsList = [];
        try {
          if (o.attachments_list && Array.isArray(o.attachments_list)) {
            attachmentsList = o.attachments_list;
          } else if (o.attachments && typeof o.attachments === 'string') {
            attachmentsList = JSON.parse(o.attachments);
          }
        } catch (e) {
          attachmentsList = [];
        }
        var attachmentCount = attachmentsList.length;

        html += `
          <div class="refined-card" data-id="${o.id}" style="${bgStyle} animation-delay: ${index * 0.05}s">
            <!-- 呼吸灯状态条：使用项目分配的唯一颜色 -->
            <div class="card-indicator" style="background-color: ${projectColor}; box-shadow: 0 0 10px ${projectColor};"></div>
            
            <div class="card-title" style="display: flex; flex-direction: column; align-items: flex-start; gap: 4px;">
              <div style="display: flex; align-items: center; gap: 8px;">
                <i class="layui-icon layui-icon-list"></i>
                <span>${o.order_number}</span>
              </div>
              <div style="padding-left: 24px; font-size: 13px; color: var(--accent-primary); font-family: 'JetBrains Mono', monospace; display: flex; flex-direction: column; align-items: flex-start; gap: 2px;">
                 <span>订单: ¥${parseFloat(o.order_amount || 0).toLocaleString(undefined, { minimumFractionDigits: 2 })}</span>
                 <span style="color: #ff9800;">已付: ¥${totalPay.toLocaleString(undefined, { minimumFractionDigits: 2 })}</span>
              </div>
              ${(o.pays_list && o.pays_list.length > 0) ? `
              <div style="padding-left: 24px; display: flex; flex-wrap: wrap; gap: 4px;">
                 ${o.pays_list.map(p => `<span class="pay-no-tag clickable-pay-no" data-id="${p.id}" title="点击编辑付款单" style="cursor: pointer; font-size: 12px; color: #ff9800; background: rgba(255,152,0,0.1); padding: 0 4px; border-radius: 2px;">${p.pay_number} <span style="opacity: 0.8; font-size: 11px;">¥${parseFloat(p.current_payment_amount || 0).toLocaleString(undefined, { minimumFractionDigits: 2 })}</span></span>`).join('')}
              </div>` : ''}
            </div>

            <div class="card-body">
              <div class="info-item item-project-name">
                <span class="info-label">项目名称</span>
                <span class="info-value text-ellipsis" title="${o.project_name || '-'}">${o.project_name || '-'}</span>
              </div>
              <div class="info-item item-contact">
                <span class="info-label">供应商负责人</span>
                <span class="info-value text-ellipsis" title="${o.supplier_contact_person || '-'}">${o.supplier_contact_person || '-'}</span>
              </div>
              <div class="info-item item-material">
                <span class="info-label">材料名称</span>
                <span class="info-value">${matName}</span>
              </div>
              <div class="info-item item-manager">
                <span class="info-label">负责人</span>
                <span class="info-value">${o.material_manager || '-'}</span>
              </div>
              <div class="info-item item-balance">
                <span class="info-label">当前余额</span>
                <span class="info-value numeric" style="color: ${balance >= 0 ? '#00e676' : '#ffab40'};">¥${balance.toLocaleString(undefined, { minimumFractionDigits: 2 })}</span>
              </div>
              <div class="info-item item-date">
                <span class="info-label">下料 / 到场</span>
                <span class="info-value">${o.cutting_time || '-'} / ${o.estimated_arrival_time || '-'}</span>
              </div>
              <div class="info-item item-details">
                <span class="info-label">材料明细</span>
                <span class="info-value" title="${o.material_details || '-'}">${o.material_details || '-'}</span>
              </div>
              ${attachmentCount > 0 ? `
              <div class="info-item item-attachments" style="grid-column: 1/-1;">
                <span class="info-label">附件列表</span>
                <div class="attachment-list-compact">
                  ${attachmentsList.map(att => `
                    <div class="attachment-item-compact preview-attachment" title="${att.name || att.filename || '未命名'}" data-url="${att.url}" data-name="${att.name || att.filename}">
                      <i class="layui-icon layui-icon-file"></i>
                      <span class="attachment-name" title="点击预览">${att.name || att.filename || '未命名'}</span>
                      ${att.url ? `<a href="${att.url}" target="_blank" class="attachment-download" onclick="event.stopPropagation();" title="下载附件"><i class="layui-icon layui-icon-download-circle"></i></a>` : ''}
                    </div>
                  `).join('')}
                </div>
              </div>
              ` : ''}
            </div>

            <!-- 悬浮操作面板 -->
            <div class="card-actions-panel">
              <div class="action-icon-btn edit card-edit-btn" title="编辑订单" data-id="${o.id}">
                <i class="layui-icon layui-icon-edit"></i>
              </div>
              <div class="action-icon-btn pay card-pay-btn" title="记账付款" data-id="${o.id}" data-no="${o.order_number}">
                <i class="layui-icon layui-icon-rmb"></i>
              </div>
              <div class="action-icon-btn print card-print-btn" title="打印单据" data-id="${o.id}">
                <i class="layui-icon layui-icon-print"></i>
              </div>
              <div class="action-icon-btn delete card-del-btn" title="删除记录" data-id="${o.id}">
                <i class="layui-icon layui-icon-delete"></i>
              </div>
            </div>
          </div>
        `;
      });
      $container.html(html);
    }

    // 初始化加载
    console.log('启动项目侧边栏初始化...');
    initProjectSidebar();
    console.log('启动订单数据加载...');
    loadOrders();
    console.log('初始化流程完成。');

    // 按钮点击事件统一代理
    $(document).on('click', '.card-edit-btn', function () {
      var id = $(this).data('id');
      editOrder(id);
    });

    $(document).on('click', '.card-del-btn', function () {
      var id = $(this).data('id');
      deleteOrder(id);
    });

    $(document).on('click', '.card-pay-btn', function () {
      var id = $(this).data('id');
      var no = $(this).data('no');
      addPayment(id, no);
    });

    $(document).on('click', '.card-print-btn', function () {
      var id = $(this).data('id');
      // 打开独立的打印页面
      window.open('/order_pay/info/print_order.html?id=' + id, '_blank');
    });

    $('#add-order-btn').on('click', function () {
      var url = '/order_pay/info/order_info.html?id=0';
      if (currentProject && currentProject !== 'all') {
        url += '&project_name=' + encodeURIComponent(currentProject);
      }
      if (currentContact && currentContact !== 'all') {
        url += '&contact=' + encodeURIComponent(currentContact);
      }
      layer.open({
        type: 2, title: '新增订单', shade: 0.1,
        area: ['90%', '90%'], content: url,
        end: function () { loadOrders(); }
      });
    });

    // 附件预览逻辑
    $(document).on('click', '.preview-attachment', function () {
      var url = $(this).data('url');
      var name = $(this).data('name') || '未命名';
      if (!url) {
        layer.msg('该附件无有效路径，无法预览', { icon: 5 });
        return;
      }

      var ext = name.split('.').pop().toLowerCase();
      // 图片类预览
      if (['jpg', 'jpeg', 'png', 'gif', 'bmp', 'webp', 'svg'].indexOf(ext) > -1) {
        layer.photos({
          photos: {
            "title": "附件预览: " + name,
            "data": [{ "src": url, "alt": name }]
          },
          shade: 0.7,
          anim: 5
        });
      } else {
        // 其他类（PDF 等）通过 iframe 预览
        layer.open({
          type: 2,
          title: '<i class="layui-icon layui-icon-file" style="color: var(--accent-primary);"></i> 预览: ' + name,
          shadeClose: true,
          maxmin: true,
          area: ['80%', '90%'],
          content: url
        });
      }
    });


    // (已移除 Layui Table 渲染相关遗留代码)

    // 统一的重新加载函数，适配新卡片布局
    function reloadTable() {
      loadOrders();
    }



    function editOrder(orderId) {
      layer.open({
        type: 2, title: '编辑订单', shade: 0.1,
        area: ['90%', '90%'], content: '/order_pay/info/order_info.html?id=' + orderId,
        end: function () { loadOrders(); }
      });
    }


    function deleteOrder(orderId) {
      layer.confirm('确定要删除这个订单吗？', { icon: 3, title: '提示' }, function (confirmIndex) {
        $.ajax({
          url: window.location.origin + `/api/v1/order/${orderId}`,
          type: "DELETE",
          headers: { Authorization: "Bearer " + localStorage.getItem("access_token") },
          success: function (res) {
            if (res.code === 0) {
              layer.msg(res.msg, { icon: 1 });
              loadOrders();
            } else {
              layer.msg(res.msg || '删除失败', { icon: 2 });
            }
            layer.close(confirmIndex);
          }
        });
      });
    }

    function addPayment(orderId, orderNo) {
      var payUrl = '/order_pay/info/pay_info.html?order_id=' + orderId + '&order_number=' + encodeURIComponent(orderNo);
      layer.open({
        type: 2, title: '新增付款单', shade: 0.1,
        area: ['90%', '90%'], content: payUrl,
        end: function () { loadOrders(); }
      });
    }

    // 编辑付款单
    $(document).on('click', '.clickable-pay-no', function (e) {
      e.stopPropagation();
      var payId = $(this).data('id');
      layer.open({
        type: 2, title: '编辑付款单', shade: 0.1,
        area: ['90%', '90%'], content: '/order_pay/info/pay_info.html?payment_id=' + payId,
        end: function () { loadOrders(); } // 编辑完成后刷新订单列表以更新余额等信息
      });
    });

    // ==================== 初始化与动作代理 ====================
    console.log('配置字段筛选功能...');
    initFieldFilter();
    console.log('启动项目侧边栏初始化...');
    initProjectSidebar();
    console.log('启动联系人侧边栏初始化...');
    initContactSidebar();
    console.log('启动订单数据加载...');
    loadOrders();
    console.log('初始化流程完成。');
  });
</script>
