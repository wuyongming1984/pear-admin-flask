<link rel="stylesheet" href="/static/admin/css/order_pay_refined.css?v=2026.02.13.v1" />
<style>
  /* 解决 Pear Admin Tab 覆盖问题 - Scoped */
  #pay-page-root {
    height: 100%;
    width: 100%;
    box-sizing: border-box;
  }

  /* Scope global body resets if any */
  #pay-page-root .refined-container {
    margin: 0 !important;
    height: calc(100vh - 20px) !important;
    border-radius: 0 !important;
    box-sizing: border-box;
  }
</style>

<div id="pay-page-root">
  <div class="refined-container">
    <!-- 左侧项目侧边栏 -->
    <div class="side-panel">
      <div class="side-panel-header">
        <div class="search-input-wrapper">
          <i class="layui-icon layui-icon-search"></i>
          <input type="text" id="pay-project-search" class="search-input" placeholder="筛选项目..." />
        </div>
      </div>
      <div class="project-list" id="pay-project-list">
        <!-- 项目加载中... -->
      </div>
    </div>

    <!-- 中间供应商联系人侧边栏 -->
    <div class="side-panel" style="border-right: 1px solid var(--border-dim);">
      <div class="side-panel-header">
        <div class="search-input-wrapper">
          <i class="layui-icon layui-icon-search"></i>
          <input type="text" id="pay-contact-search" class="search-input" placeholder="筛选联系人..." />
        </div>
      </div>
      <div class="project-list" id="pay-contact-list">
        <div class="project-item active" data-id="all">
          <div class="project-name">全部联系人</div>
          <div class="project-desc">不限供应商负责人</div>
        </div>
        <!-- 联系人项将通过 JS 动态渲染 -->
      </div>
    </div>

    <!-- 右侧主内容区 -->
    <div class="main-content">
      <div class="content-header">
        <div class="content-title" id="current-project-title">全部项目 | 全部联系人 - 付款明细</div>
        <div class="content-actions">
          <div class="search-input-wrapper" style="width: 200px; margin-right: 10px;">
            <i class="layui-icon layui-icon-search"></i>
            <input type="text" id="pay-number-search" class="search-input" placeholder="输入付款单号搜索..." />
          </div>
          <div class="field-setting-btn" id="field-setting-btn">
            <i class="layui-icon layui-icon-cols"></i>
            <div class="field-dropdown" id="field-dropdown">
              <label class="field-option"><input type="checkbox" checked data-field="project_name"> 项目名称</label>
              <label class="field-option"><input type="checkbox" checked data-field="order_amount"> 订单金额</label>
              <label class="field-option"><input type="checkbox" checked data-field="pay_amount"> 付款金额</label>
              <label class="field-option"><input type="checkbox" checked data-field="invoice_amount"> 开票金额</label>
              <label class="field-option"><input type="checkbox" checked data-field="pay_status"> 付款状态</label>
              <label class="field-option"><input type="checkbox" checked data-field="payer"> 付款单位</label>
              <label class="field-option"><input type="checkbox" checked data-field="payee"> 收款单位</label>
              <label class="field-option"><input type="checkbox" checked data-field="handler"> 经办人</label>
              <label class="field-option"><input type="checkbox" checked data-field="purpose"> 内容描述</label>
              <label class="field-option"><input type="checkbox" checked data-field="attachments"> 附件列表</label>
              <label class="field-option"><input type="checkbox" checked data-field="invoices"> 关联发票</label>
            </div>
          </div>
        </div>
      </div>

      <!-- 付款卡片容器 -->
      <div class="card-grid" id="pay-card-container">
        <div style="grid-column: 1/-1; text-align: center; padding: 50px; color: #999;">
          <i class="layui-icon layui-icon-loading layui-anim layui-anim-rotate layui-anim-loop"
            style="font-size: 30px;"></i>
          <p style="margin-top: 10px;">正在加载支付数据...</p>
        </div>
      </div>
    </div>
  </div>
</div>

<script type="text/html" id="pay-toolbar">
    <div class="layui-btn-container">
      <button class="layui-btn layui-btn-sm" lay-event="pay-toolbar-add">
        <i class="layui-icon layui-icon-add-1"></i> 新增付款单
      </button>
    </div>
  </script>
<script type="text/html" id="pay-tool">
    <div class="layui-btn-container">
      <button
        class="layui-btn layui-btn-sm layui-bg-blue"
        lay-event="pay-tool-edit"
      >
        编辑
      </button>
      <button
        class="layui-btn layui-btn-sm layui-bg-orange"
        lay-event="pay-tool-print"
      >
        打印
      </button>
      <button
        class="layui-btn layui-btn-sm layui-bg-red"
        lay-event="pay-tool-del"
      >
        删除
      </button>
    </div>
  </script>
<!-- 付款状态模板 -->
<script type="text/html" id="paymentStatusTpl">
  {% raw %}
  <select name="payment_status" lay-filter="payment_status_select" data-id="{{ d.id }}" class="layui-input" style="width: 100%; height: 32px;">
    <!-- Options will be dynamically loaded from dictionary -->
  </select>
  {% endraw %}
</script>
<script>
  layui.use(["form", "layer", "laydate"], function () {
    var form = layui.form;
    var layer = layui.layer;
    var laydate = layui.laydate;
    var $ = layui.$;

    // ==================== 状态管理 ====================
    var currentProject = 'all';
    var currentContact = 'all';
    var allProjects = [];
    var allContacts = [];
    var allPaymentsData = [];

    // 字段显示设置逻辑
    var fieldSettings = JSON.parse(localStorage.getItem('pay_field_settings')) || {
      order_amount: true,
      pay_amount: true,
      invoice_amount: true,
      pay_status: true,
      project_name: true,
      payer: true,
      payee: true,
      handler: true,
      purpose: true,
      attachments: true,
      invoices: true
    };

    function applyFieldSettings() {
      Object.keys(fieldSettings).forEach(field => {
        var className = '.item-' + field.replace(/_/g, '-');
        if (fieldSettings[field]) {
          $(className).show();
          $(`.field-dropdown input[data-field="${field}"]`).prop('checked', true);
        } else {
          $(className).hide();
          $(`.field-dropdown input[data-field="${field}"]`).prop('checked', false);
        }
      });
    }

    // 悬停展开下拉菜单
    $('#field-setting-btn').on('mouseenter', function () {
      $('#field-dropdown').stop().fadeIn(200);
    }).on('mouseleave', function () {
      $('#field-dropdown').stop().fadeOut(200);
    });

    // 勾选切换
    $(document).on('change', '.field-option input', function () {
      var field = $(this).data('field');
      var isChecked = $(this).prop('checked');
      fieldSettings[field] = isChecked;
      localStorage.setItem('pay_field_settings', JSON.stringify(fieldSettings));
      applyFieldSettings();
    });

    // 初始化设置
    applyFieldSettings();


    var paymentStatusMap = {};

    function initPaymentStatusMap() {
      return $.ajax({
        url: '/api/v1/dictionary/detail/list',
        data: { dic_id: 28, limit: 100 },
        headers: { Authorization: "Bearer " + localStorage.getItem("access_token") },
        success: function (res) {
          if (res.code === 0) {
            res.data.forEach(function (item) {
              paymentStatusMap[item.code] = item.value;
            });
          }
        }
      });
    }

    // ==================== 数据加载与渲染 ====================

    function initProjectSidebar() {
      $.ajax({
        url: "/api/v1/project/",
        type: "GET",
        headers: { Authorization: "Bearer " + localStorage.getItem("access_token") },
        data: { limit: 9999, has_payments: 'true' },

        success: (res) => {
          if (res.code === 0) {
            allProjects = res.data;
            // 按 ID 倒序排序
            allProjects.sort((a, b) => b.id - a.id);
            renderProjectList(allProjects);
          }
        }
      });
    }

    function renderProjectList(projects) {
      var $list = $('#pay-project-list');
      var html = `
        <div class="project-item ${currentProject === 'all' ? 'active' : ''}" data-id="all">
          <div class="project-name">全部项目</div>
        </div>
      `;
      projects.forEach(function (p) {
        html += `
          <div class="project-item ${currentProject === p.project_name ? 'active' : ''}" data-id="${p.project_name}">
            <div class="project-name">${p.project_name}</div>
          </div>
        `;
      });
      $list.html(html);
    }

    function loadPayments() {
      var payNumber = $('#pay-number-search').val();

      // 性能优化：如果项目和联系人都是全部，且没有输入搜索关键词，则不加载数据
      if (currentProject === 'all' && currentContact === 'all' && !payNumber) {
        $('#pay-card-container').html('<div style="grid-column: 1/-1; text-align: center; padding: 100px; color: #999;"><i class="layui-icon layui-icon-tips" style="font-size: 50px; color: #ccc;"></i><p style="margin-top: 20px; font-size: 16px;">请选择左侧项目或联系人以查看明细</p></div>');
        return;
      }

      var params = { page: 1, limit: 9999 };
      if (currentProject !== 'all') params.project_name = currentProject;
      if (currentContact !== 'all') params.supplier_contact_person = currentContact;
      if (payNumber) {
        params.pay_number = payNumber;
      }

      $('#pay-card-container').html('<div style="grid-column: 1/-1; text-align: center; padding: 50px; color: #999;"><i class="layui-icon layui-icon-loading layui-anim layui-anim-rotate layui-anim-loop" style="font-size: 30px;"></i><p>正在加载支付数据...</p></div>');

      $.ajax({
        url: "/api/v1/pay/",
        type: "GET",
        headers: { Authorization: "Bearer " + localStorage.getItem("access_token") },
        data: params,
        success: (res) => {
          if (res.code === 0) {
            allPaymentsData = res.data;
            renderPaymentCards(allPaymentsData);
            applyFieldSettings();
            // 触发侧边栏更新 (仅当没有选定具体联系人时更新)
            if (currentContact === 'all') {
              updateContactSidebarList(allPaymentsData);
            }
          } else {
            $('#pay-card-container').html(`<div class="layui-bg-gray" style="grid-column: 1/-1; padding: 20px; text-align: center; color: #ff5722;">${res.msg}</div>`);
          }
        }
      });
    }

    // --- 新增：更新联系人侧边栏 ---
    function updateContactSidebarList(payments) {
      if (!allContacts || allContacts.length === 0) {
        console.warn("allContacts not loaded yet, skipping filtered update");
        return;
      }

      if (currentProject === 'all' && currentContact === 'all' && !$('#pay-number-search').val()) {
        return;
      }

      if (currentProject !== 'all') {
        var contactsSet = new Set();
        payments.forEach(function (p) {
          // 尝试获取联系人，支持 supplier_contact_person 或 payee_supplier_contact
          var contact = p.supplier_contact_person || p.payee_supplier_contact;
          if (contact) contactsSet.add(contact);
        });

        var contacts = allContacts.filter(function (c) {
          return c && c.name && contactsSet.has(c.name);
        });
        renderContactList(contacts);
      } else {
        renderContactList(allContacts);
      }
    }

    // 这个函数废弃
    /*
    function updateAssociatedContacts(payments) {
    }
    */

    // 修改：联系人侧边栏现在从供应商管理中获取，并按供应商ID倒序排列
    function initContactSidebar() {
      $.ajax({
        url: "/api/v1/supplier/",
        type: "GET",
        headers: { Authorization: "Bearer " + localStorage.getItem("access_token") },
        data: { limit: 9999 },
        success: (res) => {
          if (res.code === 0) {
            // 按供应商 ID 倒序排序
            var suppliers = res.data.sort((a, b) => b.id - a.id);

            var contacts = [];
            var seen = new Set();

            suppliers.forEach(s => {
              if (s.contact_person && !seen.has(s.contact_person)) {
                contacts.push({ name: s.contact_person, id: s.id });
                seen.add(s.contact_person);
              }
            });

            allContacts = contacts;
            renderContactList(allContacts);
          }
        }
      });
    }

    function renderContactList(contacts) {
      var $list = $('#pay-contact-list');
      var html = `
        <div class="project-item ${currentContact === 'all' ? 'active' : ''}" data-id="all">
          <div class="project-name">全部联系人</div>
        </div>
      `;
      contacts.forEach(function (c) {
        if (!c || !c.name || c.name === "undefined") return; // Robustness check
        var activeClass = currentContact === c.name ? 'active' : '';
        html += `
          <div class="project-item ${activeClass}" data-id="${c.name}" style="display: flex; justify-content: space-between; align-items: center; padding-right: 10px;">
            <div class="project-name" style="flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${c.name}</div>
            <i class="layui-icon layui-icon-website portal-btn" title="获取门户链接" data-id="${c.id}" data-name="${c.name}" style="color: var(--accent-cyan); cursor: pointer; font-size: 14px; opacity: 0.7; transition: all 0.2s;"></i>
          </div>
        `;
      });
      $list.html(html);
    }

    // 门户按钮点击事件
    $(document).on('click', '.portal-btn', function (e) {
      e.stopPropagation(); // 阻止冒泡，防止触发联系人选择
      var id = $(this).data('id');
      var name = $(this).data('name');

      var $icon = $(this);
      $icon.addClass('layui-icon-loading layui-anim layui-anim-rotate layui-anim-loop');

      $.ajax({
        url: window.location.origin + `/api/v1/supplier/${id}/token`,
        type: "POST",
        headers: { Authorization: "Bearer " + localStorage.getItem("access_token") },
        success: function (res) {
          $icon.removeClass('layui-icon-loading layui-anim layui-anim-rotate layui-anim-loop');
          if (res.code === 0) {
            var fullUrl = window.location.origin + res.data.url;
            layer.open({
              title: `<span style="color:#7000ff; font-weight:bold;">${name} - 门户访问链接</span>`,
              skin: 'layui-layer-molv',
              content: `<div style="padding:20px; color:#fff;">
                  <p style="margin-bottom:10px; color:#94a3b8;">请复制以下链接发送给供应商：</p>
                  <input type="text" class="layui-input" value="${fullUrl}" id="portal-link-input-${id}" style="color:#00e5ff; border-color:#00e5ff;">
                </div>`,
              btn: ['复制', '关闭'],
              yes: function (index) {
                var input = document.getElementById(`portal-link-input-${id}`);
                input.select();
                document.execCommand("copy");
                layer.msg('已复制到剪贴板', { icon: 1 });
              }
            });
          } else {
            layer.msg(res.msg || '获取失败', { icon: 2 });
          }
        },
        error: function () {
          $icon.removeClass('layui-icon-loading layui-anim layui-anim-rotate layui-anim-loop');
          layer.msg('网络请求失败', { icon: 2 });
        }
      });
    });

    function renderPaymentCards(payments) {
      var $container = $('#pay-card-container');
      if (!payments || payments.length === 0) {
        $container.html('<div style="grid-column: 1/-1; text-align: center; padding: 100px; color: #ccc;"><i class="layui-icon layui-icon-list" style="font-size: 64px;"></i><p>暂无付款记录</p></div>');
        return;
      }

      // --- 新增：按项目名称排序 ---
      payments.sort(function (a, b) {
        var nameA = (a.project_name || "").toLowerCase();
        var nameB = (b.project_name || "").toLowerCase();
        if (nameA < nameB) return -1;
        if (nameA > nameB) return 1;
        return 0;
      });

      // --- 新增：项目色彩映射 ---
      var projectPalette = [
        '#00e5ff', '#ff9800', '#4caf50', '#2196f3', '#9c27b0',
        '#f44336', '#ffeb3b', '#e91e63', '#00bcd4', '#ff5722',
        '#795548', '#607d8b', '#cddc39', '#ffc107', '#03a9f4'
      ];
      function getProjectColor(name) {
        if (!name || name === '未指定项目') return '#999';
        var hash = 0;
        for (var i = 0; i < name.length; i++) {
          hash = name.charCodeAt(i) + ((hash << 5) - hash);
        }
        var index = Math.abs(hash) % projectPalette.length;
        return projectPalette[index];
      }

      var html = payments.map((p, index) => {
        var statusText = paymentStatusMap[p.payment_status] || p.payment_status;
        var color = p.payment_status === 'paid' ? 'status-completed' : (p.payment_status === 'partial' ? 'status-partial' : 'status-pending');
        // 获取项目唯一颜色
        var projectColor = getProjectColor(p.project_name);

        // 解析附件列表
        var attachmentsList = [];
        try {
          if (p.attachments_list && Array.isArray(p.attachments_list)) {
            attachmentsList = p.attachments_list;
          } else if (p.attachments && typeof p.attachments === 'string') {
            attachmentsList = JSON.parse(p.attachments);
          }
        } catch (e) {
          attachmentsList = [];
        }
        var attachmentCount = attachmentsList.length;

        return `
          <div class="refined-card" data-id="${p.id}" style="animation-delay: ${index * 0.05}s">
            <!-- 呼吸灯状态条：使用项目分配的唯一颜色 -->
            <div class="card-indicator" style="background-color: ${projectColor}; box-shadow: 0 0 10px ${projectColor};"></div>
            
            <div class="card-title" style="display: flex; flex-direction: column; align-items: flex-start; gap: 4px;">
              <div style="display: flex; align-items: center; gap: 8px;">
                <i class="layui-icon layui-icon-rmb"></i>
                <span style="font-size: 13px; font-weight: bold;" title="付款单号">${p.pay_number}</span>
              </div>
              <div style="display: flex; align-items: center; gap: 8px; width: 100%;">
                <span style="font-size: 15px; font-weight: bold; color: var(--accent-primary);">¥${parseFloat(p.current_payment_amount || 0).toLocaleString(undefined, { minimumFractionDigits: 2 })}</span>
              </div>
              <div style="display: flex; align-items: center; gap: 8px; width: 100%;">
                <i class="layui-icon layui-icon-link" style="color: var(--accent-primary); opacity: 0.5; font-size: 12px;"></i>
                <span style="font-size: 13px; opacity: 0.8;" title="关联订单号">${p.order_number || '-'}</span>
              </div>
              ${p.invoices_list && p.invoices_list.length > 0 ? `
                <div class="invoice-header-list" style="width: 100%; margin-top: 2px;">
                  ${p.invoices_list.map(inv => `
                    <div class="invoice-item-compact view-invoice-detail header-style" title="点击查看详情" data-id="${inv.id}" data-url="${inv.file_path || ''}" 
                         style="background: rgba(255,152,0,0.1); border: 1px solid rgba(255,152,0,0.2); margin-bottom: 4px; padding: 4px 8px; border-radius: 4px; display: flex; align-items: center; justify-content: space-between; cursor: pointer;">
                      <div style="display: flex; align-items: center; gap: 6px; overflow: hidden; flex: 1;">
                        <i class="layui-icon layui-icon-file-b" style="color: #ff9800; font-size: 14px;"></i>
                        <span style="font-size: 11px; font-weight: bold; color: var(--text-primary); white-space: nowrap;">${inv.invoice_number}</span>
                        <span style="font-size: 10px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${inv.seller_name || '-'}</span>
                      </div>
                      <span style="font-size: 11px; color: #ff9800; font-weight: bold; margin-left: 8px;">¥${parseFloat(inv.total_amount || 0).toLocaleString()}</span>
                    </div>
                  `).join('')}
                </div>
              ` : ''}
            </div>

            <div class="card-body">
              <div class="info-item item-project-name" data-field="project_name"><span class="info-label">项目名称</span><span class="info-value text-ellipsis" title="${p.project_name || '-'}">${p.project_name || '-'}</span></div>
              <div class="info-item item-order-amount" data-field="order_amount"><span class="info-label">订单金额</span><span class="info-value numeric" style="color: #64b5f6;">¥${parseFloat(p.order_amount || 0).toLocaleString(undefined, { minimumFractionDigits: 2 })}</span></div>
              <div class="info-item item-invoice-amount" data-field="invoice_amount"><span class="info-label">开票金额</span><span class="info-value numeric" style="color: #ffb74d;">¥${parseFloat(p.invoice_amount || 0).toLocaleString(undefined, { minimumFractionDigits: 2 })}</span></div>
              <div class="info-item item-pay-status" data-field="pay_status"><span class="info-label">付款状态</span><span class="info-value" style="color: ${p.payment_status === 'paid' ? '#4caf50' : '#ff9800'}; font-weight: bold;">${statusText}</span></div>
              
              <div class="info-item item-divider" style="grid-column: 1/-1; margin-top: 5px; border-top: 1px dashed var(--border-dim); padding-top: 5px;"></div>
              
              <div class="info-item item-payer" data-field="payer"><span class="info-label">付款单位</span><span class="info-value text-ellipsis" title="${p.payer_supplier_name}">${p.payer_supplier_name || '-'}</span></div>
              <div class="info-item item-payee" data-field="payee"><span class="info-label">收款单位</span><span class="info-value text-ellipsis" title="${p.payee_supplier_name}">${p.payee_supplier_name || '-'}</span></div>
              <div class="info-item item-handler" data-field="handler"><span class="info-label">经办人</span><span class="info-value">${p.handler || '-'}</span></div>
              <div class="info-item item-purpose" data-field="purpose"><span class="info-label">内容描述</span><span class="info-value text-ellipsis" title="${p.payment_purpose || '-'}">${p.payment_purpose || '-'}</span></div>

              ${attachmentCount > 0 ? `
              <div class="info-item item-attachments" data-field="attachments" style="grid-column: 1/-1;">
                <span class="info-label">附件列表</span>
                <div class="attachment-list-compact">
                  ${attachmentsList.map(att => `
                    <div class="attachment-item-compact preview-attachment" title="${att.name || att.filename || '未命名'}" data-url="${att.url}" data-name="${att.name || att.filename}">
                      <i class="layui-icon layui-icon-file"></i>
                      <span class="attachment-name" title="点击预览">${att.name || att.filename || '未命名'}</span>
                      ${att.url ? `<a href="${att.url}" target="_blank" class="attachment-download" onclick="event.stopPropagation();" title="下载附件"><i class="layui-icon layui-icon-download-circle"></i></a>` : ''}
                    </div>
                  `).join('')}
                </div>
              </div>
              ` : ''}

            </div>

            <div class="card-actions-panel">
              <div class="action-icon-btn edit pay-card-edit-btn" title="编辑付款单" data-id="${p.id}">
                <i class="layui-icon layui-icon-edit"></i>
              </div>
              <div class="action-icon-btn print pay-card-print-btn" title="打印单据" data-id="${p.id}">
                <i class="layui-icon layui-icon-print"></i>
              </div>
              <div class="action-icon-btn delete pay-card-del-btn" title="删除记录" data-id="${p.id}">
                <i class="layui-icon layui-icon-delete"></i>
              </div>
            </div>
          </div>`;
      }).join('');
      $container.html(html);
    }

    function updateHeader() {
      var pText = currentProject === 'all' ? '全部项目' : currentProject;
      var cText = currentContact === 'all' ? '全部联系人' : currentContact;
      $('#current-project-title').html(`${pText} <span style="color:var(--text-dim); margin:0 10px;">|</span> ${cText} - 付款明细`);
    }

    // ==================== 事件绑定 ====================

    $(document).off('click', '#pay-project-list .project-item').on('click', '#pay-project-list .project-item', function () {
      $('#pay-project-list .project-item').removeClass('active');
      $(this).addClass('active');
      currentProject = $(this).data('id');
      currentContact = 'all'; // 切换项目时重置联系人为全部
      updateHeader();
      loadPayments();
    });

    $(document).off('click', '#pay-contact-list .project-item').on('click', '#pay-contact-list .project-item', function () {
      $('#pay-contact-list .project-item').removeClass('active');
      $(this).addClass('active');
      currentContact = $(this).data('id');
      updateHeader();
      loadPayments();
    });

    $('#pay-project-search').on('input', function () {
      var v = $(this).val().toLowerCase();
      renderProjectList(allProjects.filter(p => p.project_name.toLowerCase().includes(v)));
    });

    $('#pay-contact-search').on('input', function () {
      var v = $(this).val().toLowerCase();
      renderContactList(allContacts.filter(c => c.name.toLowerCase().includes(v)));
    });

    // 新增：付款单号搜索事件
    $('#pay-number-search').on('input', function () {
      clearTimeout(this.searchTimeout);
      this.searchTimeout = setTimeout(function () {
        loadPayments();
      }, 300);
    });

    // 查看发票详情
    $(document).off('click', '.view-invoice-detail').on('click', '.view-invoice-detail', function (e) {
      e.stopPropagation();
      var id = $(this).data('id');
      var url = $(this).data('url');

      // 如果存在文件路径，直接打开文件
      if (url) {
        window.open(url, '_blank');
        return;
      }

      layer.open({
        type: 2,
        title: '发票详情',
        shade: 0.1,
        area: ['900px', '650px'],
        content: '/order_pay/info/invoice_detail.html?id=' + id
      });
    });

    $(document).off('click', '.pay-card-edit-btn').on('click', '.pay-card-edit-btn', function () {
      var id = $(this).data('id');
      layer.open({
        type: 2, title: '编辑付款单', area: ['90%', '90%'],
        content: `/order_pay/info/pay_info.html?payment_id=${id}`,
        end: () => loadPayments()
      });
    });

    $(document).off('click', '.pay-card-del-btn').on('click', '.pay-card-del-btn', function () {
      var id = $(this).data('id');
      layer.confirm('确定删除该付款记录？', { icon: 3, title: '警告' }, (idx) => {
        $.ajax({
          url: `/api/v1/pay/${id}`, type: 'DELETE',
          headers: { Authorization: "Bearer " + localStorage.getItem("access_token") },
          success: (res) => {
            layer.msg(res.msg);
            if (res.code === 0) loadPayments();
            layer.close(idx);
          }
        });
      });
    });

    // 附件预览逻辑
    $(document).off('click', '.preview-attachment').on('click', '.preview-attachment', function () {
      var url = $(this).data('url');
      var name = $(this).data('name');
      if (!url) return;

      var ext = name.split('.').pop().toLowerCase();
      if (['jpg', 'jpeg', 'png', 'gif', 'bmp'].indexOf(ext) > -1) {
        layer.photos({
          photos: {
            title: "预览图片",
            data: [{ alt: name, src: url }]
          },
          shade: 0.7,
          anim: 5
        });
      } else {
        window.open(url, '_blank');
      }
    });

    $(document).off('click', '.pay-card-print-btn').on('click', '.pay-card-print-btn', function () {
      var payId = $(this).data('id');
      // 打开独立的 A4 打印页面
      window.open('/order_pay/info/print_pay.html?id=' + payId, '_blank');
    });

    $('#add-pay-btn').off('click').on('click', () => {
      layer.open({
        type: 2, title: '新增付款单', area: ['90%', '90%'],
        content: '/order_pay/info/pay_info.html',
        end: () => loadPayments()
      });
    });

    function printPay(payData, orderData, supplierData) {
      var printWindow = window.open('', '_blank');
      var printContent = '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>付款单打印</title>';
      printContent += '<style>';
      printContent += 'body{font-family: "Microsoft YaHei", Arial, sans-serif; padding: 20px; background: #fff; line-height: 1.4;}';
      printContent += '.form-title{text-align: center; font-size: 24px; font-weight: bold; margin-bottom: 20px; border-bottom: 2px solid #000; padding-bottom: 10px;}';
      printContent += '.info-table{border-collapse: collapse; width: 100%; margin-bottom: 15px;}';
      printContent += '.info-table th, .info-table td{border: 1px solid #000; padding: 8px; text-align: left;}';
      printContent += '.info-table .label{background-color: #f8f8f8; font-weight: bold; width: 120px; text-align: right;}';
      printContent += '.section-header{background: #eee; text-align: center; font-weight: bold;}';
      printContent += '@media print{ body{padding: 5mm; margin: 0;} @page{size: A4 portrait; margin: 8mm 10mm 0 10mm;} }';
      printContent += '</style></head><body>';
      printContent += '<div class="form-title">付款单</div>';

      if (orderData) {
        printContent += '<table class="info-table"><thead><tr><th colspan="4" class="section-header">相关订单摘要</th></tr></thead><tbody>';
        printContent += `<tr><td class="label">订单编号</td><td>${orderData.order_number || '-'}</td><td class="label">项目名称</td><td>${orderData.project_name || '-'}</td></tr>`;
        printContent += `<tr><td class="label">材料名称</td><td>${orderData.material_name || '-'}</td><td class="label">订单金额</td><td>¥${parseFloat(orderData.order_amount || 0).toFixed(2)}</td></tr>`;
        printContent += '</tbody></table>';
      }

      printContent += '<table class="info-table"><thead><tr><th colspan="4" class="section-header">付款单明细</th></tr></thead><tbody>';
      printContent += `<tr><td class="label">付款单号</td><td>${payData.pay_number || '-'}</td><td class="label">付款状态</td><td>${paymentStatusMap[payData.payment_status] || '-'}</td></tr>`;
      printContent += `<tr><td class="label">付款单位</td><td>${payData.payer_supplier_name || '-'}</td><td class="label">收款单位</td><td>${payData.payee_supplier_name || '-'}</td></tr>`;
      printContent += `<tr><td class="label">本次金额</td><td style="font-weight:bold;">¥${parseFloat(payData.current_payment_amount || 0).toFixed(2)}</td><td class="label">经办人</td><td>${payData.handler || '-'}</td></tr>`;
      printContent += `<tr><td class="label">开户行</td><td>${supplierData ? supplierData.bank_name || '-' : '-'}</td><td class="label">银行账号</td><td>${supplierData ? supplierData.account_number || '-' : '-'}</td></tr>`;
      printContent += `<tr><td class="label" style="vertical-align: top;">付款用途</td><td colspan="3" style="min-height: 100px; vertical-align: top;">${payData.payment_purpose || '-'}</td></tr>`;
      printContent += '</tbody></table></body></html>';

      printWindow.document.write(printContent);
      printWindow.document.close();
      printWindow.onload = () => { setTimeout(() => { printWindow.print(); printWindow.close(); }, 500); };
    }

    // 初始化
    // 初始化
    initProjectSidebar();
    initContactSidebar();

    // 优先加载字典数据，确保状态显示正确
    $.when(initPaymentStatusMap()).done(function () {
      loadPayments();
    });
  });
</script>
