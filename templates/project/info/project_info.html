<script>
  layui.use(["form", "layer", "laydate", "upload", "laypage"], function () {
    var form = layui.form;
    var layer = layui.layer;
    var laydate = layui.laydate;
    var upload = layui.upload;
    var laypage = layui.laypage;
    var $ = layui.$;

    var filterParams = { page: 1, limit: 12 }; // Default limit for cards
    var attachmentList = [];
    var attachmentSequence = 0;
    var currentProjectName = '';
    var projectDataMap = {}; // Maps ID to project data object for editing
    var dictMap = {}; // Dictionary mapping: code -> [{label, value}]

    laydate.render({ elem: "#form_start_date", type: "date" });
    laydate.render({ elem: "#form_end_date", type: "date" });

    // 格式化金额
    function formatMoney(amount) {
      if (!amount) return '0.00';
      return parseFloat(amount).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    // 字典格式化
    function formatDict(dictCode, value) {
      if (!dictMap[dictCode]) return value;
      var item = dictMap[dictCode].find(d => d.value == value);
      return item ? item.label : value;
    }

    // 获取状态 class
    function getStatusClass(statusValue) {
      // 根据字典值判断样式，这里假设 statusValue 是字典的 code
      // 简单映射逻辑，或者根据字典 label 来判断
      var label = formatDict('xmzt', statusValue);
      if (!label) return '';
      if (label.indexOf('进行') > -1 || label.indexOf('开工') > -1) return 'status-active';
      if (label.indexOf('完成') > -1 || label.indexOf('竣工') > -1) return 'status-completed';
      if (label.indexOf('暂停') > -1) return 'status-paused';
      if (label.indexOf('取消') > -1) return 'status-cancelled';
      return '';
    }

    // 加载字典数据
    function loadDicts() {
      $.ajax({
        url: "/api/v1/dictionary/options?codes=xmgm,xmzt",
        type: "GET",
        async: false, // 同步加载，确保渲染前有字典数据
        success: function (res) {
          if (res.code === 0) {
            dictMap = res.data;
            renderSelectOptions();
          }
        }
      });
    }

    // 渲染下拉框选项
    function renderSelectOptions() {
      // 渲染搜索栏状态
      var statusOptions = '<option value="">所有状态</option>';
      if (dictMap['xmzt']) {
        dictMap['xmzt'].forEach(function (item) {
          statusOptions += `<option value="${item.value}">${item.label}</option>`;
        });
      }
      $('#param-project-status').html(statusOptions);

      // 渲染表单状态
      var formStatusOptions = '<option value="">请选择项目状态</option>';
      if (dictMap['xmzt']) {
        dictMap['xmzt'].forEach(function (item) {
          formStatusOptions += `<option value="${item.value}">${item.label}</option>`;
        });
      }
      $('select[name="project_status"]').html(formStatusOptions);

      // 渲染表单规模 (需将 input 改为 select)
      var scaleOptions = '<option value="">请选择项目规模</option>';
      if (dictMap['xmgm']) {
        dictMap['xmgm'].forEach(function (item) {
          scaleOptions += `<option value="${item.value}">${item.label}</option>`;
        });
      }
      //如果有select
      if ($('select[name="project_scale"]').length > 0) {
        $('select[name="project_scale"]').html(scaleOptions);
      }

      form.render('select');
    }

    // 核心：加载数据
    function loadData() {
      var loading = layer.load(2, { shade: 0.1 });
      $.ajax({
        url: "/api/v1/project/",
        type: "GET",
        data: filterParams,
        headers: { Authorization: "Bearer " + localStorage.getItem("access_token") },
        success: function (res) {
          layer.close(loading);
          if (res.code === 0) {
            renderCards(res.data);
            renderPage(res.count);
          } else {
            layer.msg(res.msg, { icon: 2 });
          }
        },
        error: function () {
          layer.close(loading);
          layer.msg("数据加载失败", { icon: 2 });
        }
      });
    }

    // 核心：渲染卡片 (列表模式)
    function renderCards(data) {
      var $container = $('#project-card-container');
      $container.empty();
      projectDataMap = {};

      if (!data || data.length === 0) {
        $container.html('<div style="color: #94a3b8; text-align: center; width: 100%; padding: 50px;">暂无项目数据</div>');
        return;
      }

      data.forEach(function (item) {
        projectDataMap[item.id] = item;
        var statusLabel = formatDict('xmzt', item.project_status);
        var scaleLabel = formatDict('xmgm', item.project_scale);
        var statusClass = getStatusClass(item.project_status);
        var cardHtml = `
            <div class="project-card">
                <!-- 左侧 -->
                <div class="card-left">
                    <div class="card-header-row">
                        <span class="card-id">#${item.id}</span>
                        <span class="card-title" title="${item.project_full_name || ''}">${item.project_name}</span>
                        <span class="card-status ${statusClass}">${statusLabel || '未知'}</span>
                    </div>
                    <div class="card-subtitle">${item.project_full_name || '暂无全称'}</div>
                </div>
                
                <!-- 中间数据 -->
                <div class="card-middle">
                    <div class="card-item">
                        <span class="card-label">项目规模</span>
                        <span class="card-value">${scaleLabel || '-'}</span>
                    </div>
                    <div class="card-item">
                        <span class="card-label">合同金额</span>
                        <span class="card-value card-amount">¥ ${formatMoney(item.project_amount)}</span>
                    </div>
                    <div class="card-item">
                        <span class="card-label">审价金额</span>
                        <span class="card-value card-amount">¥ ${formatMoney(item.project_audit_price_amount)}</span>
                    </div>
                    <div class="card-item">
                        <span class="card-label">审计金额</span>
                        <span class="card-value card-amount">¥ ${formatMoney(item.project_audit_amount)}</span>
                    </div>
                    <div class="card-item" style="min-width: 150px;">
                        <span class="card-label">项目周期</span>
                        <span class="card-value">${item.start_date || '-'} ~ ${item.end_date || '-'}</span>
                    </div>
                </div>

                <!-- 右侧操作 -->
                <div class="card-actions">
                    <button class="edit-btn" onclick="editProject(${item.id})"><i class="layui-icon layui-icon-edit"></i> 编辑</button>
                    <button class="del-btn" onclick="delProject(${item.id})"><i class="layui-icon layui-icon-delete"></i> 删除</button>
                </div>
            </div>
            `;
        $container.append(cardHtml);
      });
    }

    // 核心：渲染分页
    function renderPage(count) {
      laypage.render({
        elem: 'project-page-bar',
        count: count,
        curr: filterParams.page,
        limit: filterParams.limit,
        layout: ['count', 'prev', 'page', 'next', 'refresh', 'skip'],
        jump: function (obj, first) {
          if (!first) {
            filterParams.page = obj.curr;
            loadData();
          }
        }
      });
    }

    // 初始化加载
    loadDicts();
    loadData();

    // 弹窗状态标记
    var isLayerOpening = false;

    // 全局函数：编辑
    window.editProject = function (id) {
      if (isLayerOpening) return;
      isLayerOpening = true;

      var data = projectDataMap[id];
      if (!data) {
        isLayerOpening = false;
        return;
      }

      // 先关闭所有弹窗
      layer.closeAll();

      form.val("project-form", data);
      currentProjectName = data.project_name;
      attachmentList = data.attachments_list || (data.attachments ? JSON.parse(data.attachments) : []);
      renderAttachmentList();

      layer.open({
        type: 1, title: '编辑项目', content: $('#project-form'),
        area: ['600px', '700px'], shade: 0.8,
        shadeClose: false,
        success: function (layero, index) {
          // 关键修复：移动到 body
          $('body').append(layero);
          var mask = $('.layui-layer-shade');
          mask.appendTo('body');

          form.render(null, 'project-form');
          $('#project-form').show();
          isLayerOpening = false;
        },
        end: function () {
          isLayerOpening = false;
          $('#project-form').hide();
        }
      });
    };

    // 全局函数：删除
    window.delProject = function (id) {
      layer.confirm('确定删除该项目？', { icon: 3, title: '提示', skin: 'layui-layer-molv' }, function (index) {
        $.ajax({
          url: `/api/v1/project/${id}`, type: "DELETE",
          headers: { Authorization: "Bearer " + localStorage.getItem("access_token") },
          success: function (res) {
            if (res.code === 0) {
              layer.msg(res.msg, { icon: 1 });
              loadData();
            } else {
              layer.msg(res.msg, { icon: 2 });
            }
          }
        });
        layer.close(index);
      });
    };

    // 事件：新增 (使用 off 解绑防止重复)
    $('#btn-add-project').off('click').on('click', function () {
      if (isLayerOpening) return;
      isLayerOpening = true;

      // 先关闭所有弹窗
      layer.closeAll();

      form.val("project-form", {
        "id": "0", "project_name": "", "project_full_name": "", "project_scale": "",
        "start_date": "", "end_date": "", "project_status": "", "project_amount": "", "attachments": ""
      });
      attachmentList = []; attachmentSequence = 0; currentProjectName = '';
      renderAttachmentList();

      layer.open({
        type: 1, title: '新增项目', content: $('#project-form'),
        area: ['600px', '700px'], shade: 0.8,
        shadeClose: false,
        success: function (layero, index) {
          // 关键修复：移动到 body
          $('body').append(layero);
          var mask = $('.layui-layer-shade');
          mask.appendTo('body');

          form.render(null, 'project-form');
          $('#project-form').show();
          isLayerOpening = false;
        },
        end: function () {
          isLayerOpening = false;
          $('#project-form').hide();
        }
      });
    });

    // 事件：搜索 (防抖)
    var searchTimer;
    $('#param-project-name').on('input', function () {
      clearTimeout(searchTimer);
      var val = $(this).val();
      searchTimer = setTimeout(function () {
        filterParams.project_name = val;
        filterParams.page = 1;
        loadData();
      }, 500);
    });

    // 事件：筛选状态
    $('#param-project-status').on('change', function () {
      filterParams.project_status = $(this).val();
      filterParams.page = 1;
      loadData();
    });

    // ------------- 附件相关逻辑 (保持不变) -------------
    function formatFileSize(bytes) {
      if (bytes === 0) return '0 B';
      var k = 1024;
      var sizes = ['B', 'KB', 'MB', 'GB'];
      var i = Math.floor(Math.log(bytes) / Math.log(k));
      return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
    }

    function getFileIcon(fileName) {
      var ext = fileName.split('.').pop().toLowerCase();
      var iconMap = {
        'pdf': 'layui-icon-file-pdf', 'doc': 'layui-icon-file', 'docx': 'layui-icon-file',
        'xls': 'layui-icon-file-excel', 'xlsx': 'layui-icon-file-excel', 'ppt': 'layui-icon-file',
        'jpg': 'layui-icon-picture', 'png': 'layui-icon-picture', 'zip': 'layui-icon-file'
      };
      return iconMap[ext] || 'layui-icon-file';
    }

    function generateAttachmentCode(projectName) {
      if (!projectName) {
        attachmentSequence++;
        return 'TEMP' + 'F' + String(attachmentSequence).padStart(3, '0');
      }
      attachmentSequence++;
      var prefix = projectName.substring(0, 10).replace(/[^a-zA-Z0-9\u4e00-\u9fa5]/g, '');
      return prefix + 'F' + String(attachmentSequence).padStart(3, '0');
    }

    function renderAttachmentList() {
      var $list = $('#attachment-list');
      if (attachmentList.length === 0) {
        $list.html('<div class="attachment-empty">暂无附件</div>');
        return;
      }
      var html = '';
      attachmentList.forEach(function (file, index) {
        html += '<div class="attachment-item">';
        html += '<i class="layui-icon ' + getFileIcon(file.name) + ' file-icon" style="color:var(--accent-cyan); font-size: 20px; margin-right: 10px;"></i>';
        html += '<div class="file-info" style="flex:1;">';
        if (file.code) html += '<div class="file-code" style="color: #2196f3; font-size:12px; font-weight:bold;">' + file.code + '</div>';
        html += '<div class="file-name" style="color:var(--text-primary); margin-bottom: 2px;">' + (file.name || file.filename) + '</div>';
        html += '<div class="file-size" style="color: #666; font-size:12px;">' + formatFileSize(file.size || 0) + '</div>';
        html += '</div>';
        html += '<div class="file-actions" style="margin-left: 10px; display:flex; gap:10px;">';
        if (file.url) html += '<span style="color:#2196f3; cursor:pointer;" onclick="downloadAttachment(' + index + ')">下载</span>';
        html += '<span style="color:#f44336; cursor:pointer;" onclick="deleteAttachment(' + index + ')">删除</span>';
        html += '</div></div>';
      });
      $list.html(html);
    }

    window.deleteAttachment = function (index) {
      layer.confirm('确定删除该附件？', { icon: 3, title: '提示', skin: 'layui-layer-molv' }, function (idx) {
        var file = attachmentList[index];
        if (file.id) {
          $.ajax({
            url: `/api/v1/attachment/${file.id}`, type: "DELETE",
            headers: { Authorization: "Bearer " + localStorage.getItem("access_token") },
            success: function (res) {
              if (res.code === 0) {
                attachmentList.splice(index, 1);
                renderAttachmentList();
                updateAttachmentsData();
                layer.msg('删除成功', { icon: 1 });
              } else layer.msg(res.msg, { icon: 2 });
              layer.close(idx);
            }
          });
        } else {
          attachmentList.splice(index, 1);
          renderAttachmentList();
          updateAttachmentsData();
          layer.close(idx);
        }
      });
    };

    window.downloadAttachment = function (index) {
      var file = attachmentList[index];
      if (file.url) window.open(file.url, '_blank');
    };

    function updateAttachmentsData() {
      var attachmentsData = attachmentList.map(function (file) {
        return { id: file.id || null, code: file.code || '', name: file.name, url: file.url || '', size: file.size || 0, filename: file.filename || file.name };
      });
      $('#attachments-data').val(JSON.stringify(attachmentsData));
    }

    upload.render({
      elem: '#upload-attachment',
      url: window.location.origin + '/api/v1/upload/',
      accept: 'file', multiple: true,
      headers: { Authorization: "Bearer " + localStorage.getItem("access_token") },
      data: function () {
        var projectId = $('#project-form input[name="id"]').val();
        projectId = (projectId && projectId != '0') ? projectId : null;
        var projectName = $('#project-form input[name="project_name"]').val() || currentProjectName;
        return { project_id: projectId, attachment_code: generateAttachmentCode(projectName), path: 'project_attachments' };
      },
      before: function (obj) {
        obj.preview(function (index, file, result) {
          var projectName = $('#project-form input[name="project_name"]').val() || currentProjectName;
          attachmentList.push({ code: generateAttachmentCode(projectName), name: file.name, size: file.size, blob: file, url: null, filename: null });
          renderAttachmentList();
          updateAttachmentsData();
        });
      },
      done: function (res, index, upload) {
        if (res.code === 0 && attachmentList[index]) {
          var item = attachmentList[index];
          item.id = res.data.id; item.url = res.data.url; item.filename = res.data.filename;
          renderAttachmentList();
          updateAttachmentsData();
          layer.msg('上传成功', { icon: 1 });
        }
      }
    });

    // 监听表单提交
    form.on('submit(project-form-btn)', function (data) {
      var method = data.field.id === "0" ? "POST" : "PUT";
      var url = method === "POST" ? "/api/v1/project/" : `/api/v1/project/${data.field.id}`;

      try { data.field.attachments = attachmentList; } catch (e) { }

      $.ajax({
        url: window.location.origin + url, type: method,
        dataType: 'json', contentType: 'application/json',
        data: JSON.stringify(data.field),
        headers: { Authorization: "Bearer " + localStorage.getItem("access_token") },
        success: function (res) {
          if (res.code === 0) {
            layer.msg('操作成功', { icon: 1 });
            layer.closeAll('page');
            loadData(); // 刷新卡片
          } else {
            layer.msg(res.msg, { icon: 2 });
          }
        }
      });
      return false;
    });

    // 初始化加载
    loadData();

  });
</script>
</body>

</html>
