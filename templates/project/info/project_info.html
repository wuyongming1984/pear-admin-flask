<style>
  /* ==================== 赛博工业 (Cyber Industrial) 全局变量 ==================== */
  :root {
    --bg-dark: #0f172a;
    --bg-card: rgba(30, 41, 59, 0.7);
    --bg-card-hover: rgba(51, 65, 85, 0.8);
    --text-primary: #f1f5f9;
    --text-secondary: #94a3b8;
    --accent-cyan: #00e5ff;
    --accent-cyan-dim: rgba(0, 229, 255, 0.1);
    --border-color: rgba(148, 163, 184, 0.2);
    --neon-shadow: 0 0 10px rgba(0, 229, 255, 0.3);
  }

  /* 整体背景 - Scoped to Page Root */
  #project-page-root {
    background-color: var(--bg-dark);
    background-image:
      radial-gradient(circle at 10% 20%, rgba(0, 229, 255, 0.05) 0%, transparent 20%),
      radial-gradient(circle at 90% 80%, rgba(255, 0, 150, 0.05) 0%, transparent 20%);
    color: var(--text-primary);
    font-family: "Inter", "Microsoft YaHei", sans-serif;
    margin: 0;
    padding: 16px;
    min-height: calc(100vh - 20px);
    /* Adjust for padding */
    box-sizing: border-box;
  }

  /* 玻璃拟态卡片容器 */
  #project-page-root .cyber-card {
    background: var(--bg-card);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    height: calc(100vh - 40px);
    /* Adjust height */
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
  }

  /* ==================== 深度定制 Layui 表格 ==================== */
  /* Scope to this page to avoid bleeding */
  #project-page-root .layui-table-view {
    background-color: #000000 !important;
    border: none !important;
    margin: 0 !important;
    flex: 1;
  }

  /* 表头样式 */
  #project-page-root .layui-table-header {
    background-color: rgba(15, 23, 42, 0.8) !important;
    border-bottom: 2px solid var(--accent-cyan) !important;
  }

  #project-page-root .layui-table thead tr {
    background-color: transparent !important;
  }

  #project-page-root .layui-table th {
    background-color: transparent !important;
    color: var(--accent-cyan) !important;
    font-weight: 600 !important;
    border: none !important;
    padding: 12px 15px !important;
  }

  #project-page-root .layui-table th span {
    font-weight: bold;
    letter-spacing: 0.5px;
  }

  /* 表体样式 */
  #project-page-root .layui-table-body {
    background-color: transparent !important;
  }

  #project-page-root .layui-table td {
    border: none !important;
    border-bottom: 1px solid rgba(255, 255, 255, 0.05) !important;
    color: var(--text-primary) !important;
    padding: 10px 15px !important;
  }

  /* 悬停高亮 */
  #project-page-root .layui-table-hover,
  #project-page-root .layui-table-click,
  #project-page-root .layui-table tbody tr:hover {
    background-color: rgba(0, 229, 255, 0.05) !important;
  }

  /* 去除空隙 */
  #project-page-root .layui-table-view .layui-table {
    width: 100%;
  }

  #project-page-root .layui-table-init {
    background-color: transparent !important;
  }

  /* 分页栏定制 */
  #project-page-root .layui-table-page {
    border-top: 1px solid var(--border-color) !important;
    padding: 10px 0 0 0 !important;
    height: 50px;
  }

  #project-page-root .layui-laypage .layui-laypage-curr .layui-laypage-em {
    background-color: var(--accent-cyan) !important;
  }

  #project-page-root .layui-laypage a,
  #project-page-root .layui-laypage span {
    background-color: transparent !important;
    color: var(--text-secondary) !important;
    border: 1px solid var(--border-color) !important;
  }

  #project-page-root .layui-laypage a:hover {
    color: var(--accent-cyan) !important;
    border-color: var(--accent-cyan) !important;
  }

  /* 滚动条美化 */
  #project-page-root ::-webkit-scrollbar {
    width: 8px;
    height: 8px;
  }

  #project-page-root ::-webkit-scrollbar-track {
    background: rgba(255, 255, 255, 0.05);
    border-radius: 4px;
  }

  #project-page-root ::-webkit-scrollbar-thumb {
    background: rgba(148, 163, 184, 0.3);
    border-radius: 4px;
  }

  #project-page-root ::-webkit-scrollbar-thumb:hover {
    background: rgba(148, 163, 184, 0.5);
  }

  /* ==================== 按钮样式重构 (实心 Neon) ==================== */
  #project-page-root .layui-btn {
    border-radius: 4px;
    font-weight: 600;
    transition: all 0.3s ease;
    /* 实心按钮，不透明 */
    border: none;
  }

  /* 蓝色编辑按钮 */
  #project-page-root .layui-bg-blue {
    background-color: #2196f3 !important;
    color: #fff !important;
  }

  #project-page-root .layui-bg-blue:hover {
    background-color: #1976d2 !important;
    box-shadow: 0 0 8px rgba(33, 150, 243, 0.5);
  }

  /* 红色删除按钮 */
  #project-page-root .layui-bg-red {
    background-color: #f44336 !important;
    color: #fff !important;
  }

  #project-page-root .layui-bg-red:hover {
    background-color: #d32f2f !important;
    box-shadow: 0 0 8px rgba(244, 67, 54, 0.5);
  }

  /* 顶部工具栏按钮 */
  #project-page-root .layui-btn-primary {
    background-color: transparent !important;
    border: 1px solid var(--accent-cyan) !important;
    color: var(--accent-cyan) !important;
  }

  #project-page-root .layui-btn-primary:hover {
    background-color: var(--accent-cyan) !important;
    color: #000 !important;
    box-shadow: var(--neon-shadow);
  }

  /* 搜索框与输入框 */
  #project-page-root .filter-input,
  #project-page-root .layui-input {
    background-color: rgba(0, 0, 0, 0.3) !important;
    border: 1px solid var(--border-color) !important;
    color: var(--text-primary) !important;
    border-radius: 4px;
    transition: all 0.3s;
  }

  #project-page-root .filter-input:focus,
  #project-page-root .layui-input:focus {
    border-color: var(--accent-cyan) !important;
    box-shadow: 0 0 5px rgba(0, 229, 255, 0.3) !important;
  }

  #project-page-root .filter-input::placeholder {
    color: rgba(148, 163, 184, 0.5);
  }

  /* 弹窗样式调整 - 虽然弹窗在body下，但我们加!important确保覆盖 */
  body .layui-layer {
    background-color: #1e293b !important;
    border: 1px solid rgba(0, 229, 255, 0.3);
    box-shadow: 0 0 20px rgba(0, 0, 0, 0.8) !important;
  }

  body .layui-layer-title {
    background-color: #0f172a !important;
    color: var(--accent-cyan) !important;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1) !important;
  }

  body .layui-layer-content {
    color: var(--text-primary) !important;
  }

  body .layui-layer-btn {
    background-color: #0f172a !important;
    border-top: 1px solid rgba(255, 255, 255, 0.1) !important;
  }

  /* ==================== 修复固定列错位 & 白色背景问题 (关键) ==================== */
  /* 强制统一行高 */
  #project-page-root .layui-table-cell {
    height: 50px !important;
    line-height: 50px !important;
    padding: 0 15px !important;
    display: flex;
    align-items: center;
    color: var(--text-primary) !important;
    /* 强制文字颜色 */
  }

  /* 修复首列复选框/序号无法垂直居中的问题 */
  #project-page-root .layui-table-cell .layui-form-checkbox,
  #project-page-root .layui-table-cell .layui-table-sort {
    margin-top: 0 !important;
  }

  /* 操作列 flex */
  #project-page-root .layui-table-cell .layui-btn-container {
    display: flex;
    justify-content: center;
    gap: 8px;
    width: 100%;
    height: 100%;
    align-items: center;
  }

  /* 强制背景为暗色/透明，防止Layui默认白色背景覆盖 */
  #project-page-root .layui-table-view,
  #project-page-root .layui-table-box,
  #project-page-root .layui-table-body,
  #project-page-root .layui-table-header,
  #project-page-root .layui-table {
    background-color: transparent !important;
  }

  /* 确保外层容器有背景 */
  #project-page-root .layui-table-view {
    background-color: rgba(20, 20, 20, 0.6) !important;
  }

  /* 附件上传区域 */
  #project-page-root .attachment-list {
    background: rgba(0, 0, 0, 0.2) !important;
    border: 1px solid var(--border-color) !important;
    color: var(--text-primary);
  }

  #project-page-root .attachment-item {
    background: rgba(255, 255, 255, 0.05) !important;
    border-color: var(--border-color) !important;
    color: var(--text-primary) !important;
  }

  #project-page-root .attachment-item .file-name {
    color: var(--text-primary) !important;
  }

  #project-page-root .attachment-empty {
    color: #666;
  }
</style>

<div id="project-page-root">
  <div class="cyber-card">
    <table class="layui-hide" id="project-table" lay-filter="project-table"></table>
  </div>

  <!-- 隐藏的表单 -->
  <form class="layui-form" lay-filter="project-form" id="project-form" action=""
    style="padding: 20px 30px 0 0; display: none; background-color: #1e293b;">
    <div class="layui-form-item">
      <label class="layui-form-label" style="color: var(--text-secondary);">ID</label>
      <div class="layui-input-block">
        <input type="text" name="id" value="0" lay-verify="required" autocomplete="off" class="layui-input" disabled
          style="background-color: rgba(255,255,255,0.05) !important; color: #666 !important;" />
      </div>
    </div>
    <div class="layui-form-item">
      <label class="layui-form-label" style="color: var(--text-secondary);">项目名称</label>
      <div class="layui-input-block">
        <input type="text" name="project_name" placeholder="请输入项目名称" lay-verify="required" autocomplete="off"
          class="layui-input" />
      </div>
    </div>
    <div class="layui-form-item">
      <label class="layui-form-label" style="color: var(--text-secondary);">项目全称</label>
      <div class="layui-input-block">
        <input type="text" name="project_full_name" placeholder="请输入项目全称" autocomplete="off" class="layui-input" />
      </div>
    </div>
    <div class="layui-form-item">
      <label class="layui-form-label" style="color: var(--text-secondary);">项目规模</label>
      <div class="layui-input-block">
        <input type="text" name="project_scale" placeholder="请输入项目规模" autocomplete="off" class="layui-input" />
      </div>
    </div>
    <div class="layui-form-item">
      <label class="layui-form-label" style="color: var(--text-secondary);">开始日期</label>
      <div class="layui-input-block">
        <input type="text" name="start_date" id="form_start_date" placeholder="yyyy-MM-dd" autocomplete="off"
          class="layui-input" />
      </div>
    </div>
    <div class="layui-form-item">
      <label class="layui-form-label" style="color: var(--text-secondary);">结束日期</label>
      <div class="layui-input-block">
        <input type="text" name="end_date" id="form_end_date" placeholder="yyyy-MM-dd" autocomplete="off"
          class="layui-input" />
      </div>
    </div>
    <div class="layui-form-item">
      <label class="layui-form-label" style="color: var(--text-secondary);">项目状态</label>
      <div class="layui-input-block">
        <select name="project_status">
          <option value="">请选择项目状态</option>
          <option value="进行中">进行中</option>
          <option value="已完成">已完成</option>
          <option value="已暂停">已暂停</option>
          <option value="已取消">已取消</option>
        </select>
      </div>
    </div>
    <div class="layui-form-item">
      <label class="layui-form-label" style="color: var(--text-secondary);">项目金额</label>
      <div class="layui-input-block">
        <input type="number" name="project_amount" placeholder="请输入项目金额" step="0.01" autocomplete="off"
          class="layui-input" />
      </div>
    </div>
    <div class="layui-form-item">
      <label class="layui-form-label" style="color: var(--text-secondary);">附件</label>
      <div class="layui-input-block">
        <div class="attachment-section">
          <div class="attachment-upload">
            <button type="button" class="layui-btn layui-btn-normal" id="upload-attachment"
              style="background-color: var(--accent-cyan); color: #000;">
              <i class="layui-icon layui-icon-upload"></i> 添加附件
            </button>
          </div>
          <div class="attachment-list" id="attachment-list">
            <div class="attachment-empty">暂无附件</div>
          </div>
        </div>
        <input type="hidden" name="attachments" id="attachments-data" />
      </div>
    </div>
    <div class="layui-form-item">
      <div class="layui-input-block">
        <button type="submit" class="layui-btn" lay-submit lay-filter="project-form-btn"
          style="background-color: var(--accent-cyan); color: #000;">
          立即提交
        </button>
        <button type="reset" class="layui-btn layui-btn-primary" style="border-color: #666; color: #ccc;">重置</button>
      </div>
    </div>
  </form>
</div>

<!-- 头部工具栏模板 -->
<script type="text/html" id="project-toolbar">
      <div class="layui-btn-container">
        <button class="layui-btn layui-btn-sm layui-btn-primary" lay-event="project-toolbar-add">
          <i class="layui-icon layui-icon-add-1"></i> 新增项目
        </button>
      </div>
    </script>

<!-- 行工具栏模板 -->
<script type="text/html" id="project-tool">
      <div class="layui-btn-container">
        <button
          class="layui-btn layui-btn-sm layui-bg-blue"
          lay-event="project-tool-edit"
        >
          编辑
        </button>
        <button
          class="layui-btn layui-btn-sm layui-bg-red"
          lay-event="project-tool-del"
        >
          删除
        </button>
      </div>
    </script>

<script>
  layui.use(["table", "form", "layer", "laydate", "upload"], function () {
    var table = layui.table;
    var form = layui.form;
    var layer = layui.layer;
    var laydate = layui.laydate;
    var upload = layui.upload;
    var $ = layui.$;

    var filterParams = {};
    var attachmentList = [];
    var attachmentSequence = 0;
    var currentProjectName = '';

    laydate.render({ elem: "#form_start_date", type: "date" });
    laydate.render({ elem: "#form_end_date", type: "date" });

    // 格式化文件大小
    function formatFileSize(bytes) {
      if (bytes === 0) return '0 B';
      var k = 1024;
      var sizes = ['B', 'KB', 'MB', 'GB'];
      var i = Math.floor(Math.log(bytes) / Math.log(k));
      return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
    }

    function getFileIcon(fileName) {
      var ext = fileName.split('.').pop().toLowerCase();
      var iconMap = {
        'pdf': 'layui-icon-file-pdf', 'doc': 'layui-icon-file', 'docx': 'layui-icon-file',
        'xls': 'layui-icon-file-excel', 'xlsx': 'layui-icon-file-excel', 'ppt': 'layui-icon-file',
        'jpg': 'layui-icon-picture', 'png': 'layui-icon-picture', 'zip': 'layui-icon-file'
      };
      return iconMap[ext] || 'layui-icon-file';
    }

    function generateAttachmentCode(projectName) {
      if (!projectName) {
        attachmentSequence++;
        return 'TEMP' + 'F' + String(attachmentSequence).padStart(3, '0');
      }
      attachmentSequence++;
      var prefix = projectName.substring(0, 10).replace(/[^a-zA-Z0-9\u4e00-\u9fa5]/g, '');
      return prefix + 'F' + String(attachmentSequence).padStart(3, '0');
    }

    function renderAttachmentList() {
      var $list = $('#attachment-list');
      if (attachmentList.length === 0) {
        $list.html('<div class="attachment-empty">暂无附件</div>');
        return;
      }
      var html = '';
      attachmentList.forEach(function (file, index) {
        html += '<div class="attachment-item">';
        html += '<i class="layui-icon ' + getFileIcon(file.name) + ' file-icon" style="color:var(--accent-cyan); font-size: 20px; margin-right: 10px;"></i>';
        html += '<div class="file-info" style="flex:1;">';
        if (file.code) html += '<div class="file-code" style="color: #2196f3; font-size:12px; font-weight:bold;">' + file.code + '</div>';
        html += '<div class="file-name" style="color:var(--text-primary); margin-bottom: 2px;">' + (file.name || file.filename) + '</div>';
        html += '<div class="file-size" style="color: #666; font-size:12px;">' + formatFileSize(file.size || 0) + '</div>';
        html += '</div>';
        html += '<div class="file-actions" style="margin-left: 10px; display:flex; gap:10px;">';
        if (file.url) html += '<span style="color:#2196f3; cursor:pointer;" onclick="downloadAttachment(' + index + ')">下载</span>';
        html += '<span style="color:#f44336; cursor:pointer;" onclick="deleteAttachment(' + index + ')">删除</span>';
        html += '</div></div>';
      });
      $list.html(html);
    }

    window.deleteAttachment = function (index) {
      layer.confirm('确定删除该附件？', { icon: 3, title: '提示', skin: 'layui-layer-molv' }, function (idx) {
        var file = attachmentList[index];
        if (file.id) {
          $.ajax({
            url: `/api/v1/attachment/${file.id}`, type: "DELETE",
            headers: { Authorization: "Bearer " + localStorage.getItem("access_token") },
            success: function (res) {
              if (res.code === 0) {
                attachmentList.splice(index, 1);
                renderAttachmentList();
                updateAttachmentsData();
                layer.msg('删除成功', { icon: 1 });
              } else layer.msg(res.msg, { icon: 2 });
              layer.close(idx);
            }
          });
        } else {
          attachmentList.splice(index, 1);
          renderAttachmentList();
          updateAttachmentsData();
          layer.close(idx);
        }
      });
    };

    window.downloadAttachment = function (index) {
      var file = attachmentList[index];
      if (file.url) window.open(file.url, '_blank');
    };

    function updateAttachmentsData() {
      var attachmentsData = attachmentList.map(function (file) {
        return { id: file.id || null, code: file.code || '', name: file.name, url: file.url || '', size: file.size || 0, filename: file.filename || file.name };
      });
      $('#attachments-data').val(JSON.stringify(attachmentsData));
    }

    upload.render({
      elem: '#upload-attachment',
      url: window.location.origin + '/api/v1/upload/',
      accept: 'file', multiple: true,
      headers: { Authorization: "Bearer " + localStorage.getItem("access_token") },
      data: function () {
        var projectId = $('#project-form input[name="id"]').val();
        projectId = (projectId && projectId != '0') ? projectId : null;
        var projectName = $('#project-form input[name="project_name"]').val() || currentProjectName;
        return { project_id: projectId, attachment_code: generateAttachmentCode(projectName) };
      },
      before: function (obj) {
        obj.preview(function (index, file, result) {
          var projectName = $('#project-form input[name="project_name"]').val() || currentProjectName;
          attachmentList.push({ code: generateAttachmentCode(projectName), name: file.name, size: file.size, blob: file, url: null, filename: null });
          renderAttachmentList();
          updateAttachmentsData();
        });
      },
      done: function (res, index, upload) {
        if (res.code === 0 && attachmentList[index]) {
          var item = attachmentList[index];
          item.id = res.data.id; item.url = res.data.url; item.filename = res.data.filename;
          renderAttachmentList();
          updateAttachmentsData();
          layer.msg('上传成功', { icon: 1 });
        }
      }
    });

    // 渲染表格
    table.render({
      elem: "#project-table",
      url: window.location.origin + "/api/v1/project/",
      height: 'full-32', // 适应容器高度
      skin: 'nob', // 无边框风格
      toolbar: "#project-toolbar",
      defaultToolbar: [], // 隐藏筛选、导出、打印按钮
      page: true,
      headers: { Authorization: "Bearer " + localStorage.getItem("access_token") },
      where: filterParams,
      cols: [[
        { field: "id", title: "ID", sort: true, width: 80 },
        { field: "project_name", title: "项目名称", edit: 'text', width: 200 },
        { field: "project_full_name", title: "项目全称", edit: 'text', width: 250, hide: true },
        { field: "project_scale", title: "项目规模", edit: 'text', width: 120 },
        { field: "start_date", title: "开始日期", width: 120 },
        { field: "end_date", title: "结束日期", width: 120 },
        { field: "project_status", title: "项目状态", width: 100 },
        { field: "project_amount", title: "项目金额", edit: 'text', width: 150 },
        { field: "create_at", title: "创建时间", sort: true, width: 180, hide: true },
        { title: "操作", align: "center", toolbar: "#project-tool", width: 180, fixed: 'right' }
      ]],
      done: function (res, curr, count) {
        addFilterInputs();
      }
    });

    // 监听工具栏
    table.on('toolbar(project-table)', function (obj) {
      if (obj.event === 'project-toolbar-add') {
        form.val("project-form", {
          "id": "0", "project_name": "", "project_full_name": "", "project_scale": "",
          "start_date": "", "end_date": "", "project_status": "", "project_amount": "", "attachments": ""
        });
        attachmentList = []; attachmentSequence = 0; currentProjectName = '';
        renderAttachmentList();
        layer.open({
          type: 1, title: '新增项目', content: $('#project-form'),
          area: ['600px', '700px'], shade: 0.8
        });
      }
    });

    // 监听行工具
    table.on('tool(project-table)', function (obj) {
      if (obj.event === 'project-tool-del') {
        layer.confirm('确定删除该项目？', { icon: 3, title: '提示', skin: 'layui-layer-molv' }, function (index) {
          $.ajax({
            url: `/api/v1/project/${obj.data.id}`, type: "DELETE",
            headers: { Authorization: "Bearer " + localStorage.getItem("access_token") },
            success: function (res) {
              layer.msg(res.msg);
              if (res.code === 0) obj.del();
            }
          });
          layer.close(index);
        });
      } else if (obj.event === 'project-tool-edit') {
        form.val("project-form", obj.data);
        currentProjectName = obj.data.project_name;
        // 加载附件... (此处简化，需调用后端接口获取附件列表)
        layer.open({
          type: 1, title: '编辑项目', content: $('#project-form'),
          area: ['600px', '700px'], shade: 0.8
        });
      }
    });

    // 监听表单提交
    form.on('submit(project-form-btn)', function (data) {
      var method = data.field.id === "0" ? "POST" : "PUT";
      var url = method === "POST" ? "/api/v1/project/" : `/api/v1/project/${data.field.id}`;

      // 处理附件数据
      try {
        data.field.attachments = attachmentList;
      } catch (e) { }

      $.ajax({
        url: window.location.origin + url, type: method,
        dataType: 'json', contentType: 'application/json',
        data: JSON.stringify(data.field),
        headers: { Authorization: "Bearer " + localStorage.getItem("access_token") },
        success: function (res) {
          if (res.code === 0) {
            layer.msg('操作成功', { icon: 1 });
            layer.closeAll('page');
            table.reload('project-table');
          } else {
            layer.msg(res.msg, { icon: 2 });
          }
        }
      });
      return false;
    });

    // 筛选输入框逻辑
    function addFilterInputs() {
      var $th = $('.layui-table-header th');
      $th.each(function () {
        var field = $(this).data('field');
        if (['project_name', 'project_status'].includes(field)) {
          if ($(this).find('.filter-input').length === 0) {
            var $input = $(`<input class="filter-input" placeholder="筛选" style="width:100%; height:24px; margin-top:5px; padding:0 5px;">`);
            $input.on('click', function (e) { e.stopPropagation(); });
            $input.on('input', function () {
              filterParams[field] = $(this).val();
              // 防抖重载
              clearTimeout(this.timer);
              this.timer = setTimeout(() => {
                table.reload('project-table', { where: filterParams, done: addFilterInputs });
              }, 800);
            });
            $(this).append($input);
            if (filterParams[field]) $input.val(filterParams[field]);
          }
        }
      });
    }

  });
</script>
</body>

</html>
