<style>
  /* ==================== 赛博工业设计规范 - Scoped ==================== */
  :root {
    --accent-primary: #00e5ff;
    --accent-glow: rgba(0, 229, 255, 0.4);
    --accent-secondary: #7000ff;
    --bg-deep: #0f172a;
    --bg-surface: rgba(30, 41, 59, 0.6);
    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
    --border-dim: rgba(255, 255, 255, 0.1);
    --border-glow: rgba(0, 229, 255, 0.3);
    --radius-lg: 12px;
    --radius-md: 8px;
  }

  #supplier-page-root {
    background-color: var(--bg-deep);
    background-image:
      radial-gradient(circle at 10% 20%, rgba(0, 229, 255, 0.05) 0%, transparent 20%),
      radial-gradient(circle at 90% 80%, rgba(112, 0, 255, 0.05) 0%, transparent 20%),
      linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
    background-size: 100% 100%, 100% 100%, 30px 30px, 30px 30px;
    color: var(--text-primary);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    padding: 16px;
    margin: 0;
    min-height: calc(100vh - 20px);
    box-sizing: border-box;
  }

  /* 容器样式：玻璃拟态卡片 */
  #supplier-page-root .cyber-card {
    background: var(--bg-surface);
    backdrop-filter: blur(12px);
    border: 1px solid var(--border-dim);
    border-radius: var(--radius-lg);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    padding: 20px;
    height: calc(100vh - 40px);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    animation: cardEnter 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
  }

  @keyframes cardEnter {
    from {
      transform: translateY(20px);
      opacity: 0;
    }

    to {
      transform: translateY(0);
      opacity: 1;
    }
  }

  /* ==================== Layui Table 深度定制 (Dark Mode) ==================== */
  #supplier-page-root .layui-table-view {
    border: none !important;
    background: transparent !important;
    flex: 1;
    /* 撑满剩余高度 */
    display: flex;
    flex-direction: column;
    position: relative;
  }

  /* 去除所有白色背景 */
  #supplier-page-root .layui-table-view .layui-table,
  #supplier-page-root .layui-table-header,
  #supplier-page-root .layui-table-tool,
  #supplier-page-root .layui-table-page,
  #supplier-page-root .layui-table-total,
  #supplier-page-root .layui-table-view .layui-table-body,
  #supplier-page-root .layui-table-grid-down {
    background-color: transparent !important;
    border-color: var(--border-dim) !important;
    color: var(--text-primary) !important;
  }

  /* 表头 */
  #supplier-page-root .layui-table-header th {
    background: rgba(15, 23, 42, 0.8) !important;
    color: var(--accent-primary) !important;
    /* 青色表头 */
    font-weight: 700 !important;
    font-size: 13px;
    border-bottom: 2px solid var(--border-glow) !important;
    border-right: none !important;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    height: 48px;
  }

  /* 单元格 */
  #supplier-page-root .layui-table-cell {
    height: 48px;
    line-height: 48px;
    padding: 0 15px;
    color: var(--text-primary);
  }

  #supplier-page-root .layui-table-body tr td {
    border-bottom: 1px solid var(--border-dim) !important;
    border-right: none !important;
    transition: all 0.2s;
  }

  /* 斑马纹 & 悬停 */
  #supplier-page-root .layui-table tbody tr:hover,
  #supplier-page-root .layui-table-hover {
    background-color: rgba(0, 229, 255, 0.05) !important;
    box-shadow: inset 2px 0 0 var(--accent-primary);
  }

  /* 选中行样式 (Fix: readable text on selection) - High Specificity Override */
  body .layui-table-view .layui-table tbody tr.layui-table-click,
  body .layui-table-view .layui-table tbody tr.layui-table-click:hover {
    background-color: rgba(0, 229, 255, 0.15) !important;
  }

  body .layui-table-view .layui-table tbody tr.layui-table-click td,
  body .layui-table-view .layui-table tbody tr.layui-table-click:hover td {
    background-color: transparent !important;
    /* Ensure row color shows through */
    color: #fff !important;
    box-shadow: inset 4px 0 0 var(--accent-primary) !important;
  }

  /* Ensure links/buttons inside selected row are also readable */
  body .layui-table-view .layui-table tbody tr.layui-table-click a,
  body .layui-table-view .layui-table tbody tr.layui-table-click .layui-btn {
    color: var(--accent-primary) !important;
  }

  /* 底部工具栏 (分页) */
  #supplier-page-root .layui-table-page {
    border-top: 1px solid var(--border-dim) !important;
    padding: 10px 0;
  }

  #supplier-page-root .layui-laypage span,
  #supplier-page-root .layui-laypage a {
    color: var(--text-secondary) !important;
    background: transparent !important;
    border: 1px solid var(--border-dim) !important;
  }

  #supplier-page-root .layui-laypage .layui-laypage-curr .layui-laypage-em {
    background-color: var(--accent-primary) !important;
  }

  #supplier-page-root .layui-laypage .layui-laypage-curr em {
    color: #000 !important;
    /* 选中页码黑色 */
    font-weight: bold;
  }

  /* 筛选输入框样式 */
  #supplier-page-root .filter-input-wrapper {
    margin-top: 4px;
  }

  #supplier-page-root .filter-input {
    background: rgba(0, 0, 0, 0.3) !important;
    border: 1px solid var(--border-dim) !important;
    color: var(--text-primary) !important;
    border-radius: 4px;
    transition: all 0.3s;
  }

  #supplier-page-root .filter-input:focus {
    border-color: var(--accent-primary) !important;
    box-shadow: 0 0 8px var(--accent-glow) !important;
  }

  /* 按钮组样式 */
  #supplier-page-root .layui-btn-container .layui-btn {
    background: transparent !important;
    border: 1px solid var(--accent-primary) !important;
    color: var(--accent-primary) !important;
    box-shadow: 0 0 5px rgba(0, 0, 0, 0);
    transition: all 0.3s;
  }

  #supplier-page-root .layui-btn-container .layui-btn:hover {
    background: var(--accent-primary) !important;
    color: #000 !important;
    /* 悬停反色 */
    box-shadow: 0 0 15px var(--accent-glow);
    transform: translateY(-1px);
  }

  /* 红色删除按钮特殊处理 */
  #supplier-page-root .layui-btn-container .layui-btn-danger,
  #supplier-page-root .layui-btn-container .layui-bg-red {
    border-color: #ff4757 !important;
    color: #ff4757 !important;
  }

  #supplier-page-root .layui-btn-container .layui-btn-danger:hover,
  #supplier-page-root .layui-btn-container .layui-bg-red:hover {
    background: #ff4757 !important;
    color: #fff !important;
    box-shadow: 0 0 15px rgba(255, 71, 87, 0.4);
  }

  /* 门户按钮 (特殊颜色 - 橙色 -> 紫色) */
  #supplier-page-root .layui-btn-container .layui-bg-orange {
    border-color: var(--accent-secondary) !important;
    color: var(--accent-secondary) !important;
  }

  #supplier-page-root .layui-btn-container .layui-bg-orange:hover {
    background: var(--accent-secondary) !important;
    border-color: var(--accent-secondary) !important;
    color: #fff !important;
    box-shadow: 0 0 15px rgba(112, 0, 255, 0.4);
  }

  /* 顶部工具栏 (Add Button) */
  #supplier-page-root .layui-table-tool {
    border-bottom: 2px solid var(--border-dim) !important;
    min-height: 60px;
    padding: 10px 0;
  }

  /* ==================== 弹窗表单样式 ==================== */
  body .layui-layer-page .layui-layer-content {
    background: #1e293b !important;
    /* 弹窗深色背景 */
  }

  /* Scoped since form is inside the page root when hidden, but moved by Layer. 
       However, we kept id="supplier-form" unique. */
  #supplier-form {
    padding: 25px !important;
    background: #1e293b;
  }

  #supplier-form .layui-form-label {
    color: var(--accent-primary);
    width: 100px;
  }

  #supplier-form .layui-input-block {
    margin-left: 130px;
  }

  #supplier-form .layui-input,
  #supplier-form .layui-textarea {
    background: rgba(15, 23, 42, 0.8) !important;
    border: 1px solid var(--border-dim) !important;
    color: #fff !important;
    border-radius: var(--radius-md);
  }

  #supplier-form .layui-input:focus,
  #supplier-form .layui-textarea:focus {
    border-color: var(--accent-primary) !important;
    box-shadow: 0 0 8px var(--accent-glow) !important;
  }

  /* 弹窗按钮 */
  #supplier-form .layui-btn {
    background: var(--accent-primary);
    color: #000;
    font-weight: bold;
    border: none;
  }

  #supplier-form .layui-btn-primary {
    background: transparent !important;
    color: var(--text-secondary) !important;
    border: 1px solid var(--border-dim) !important;
  }
</style>

<div id="supplier-page-root">
  <div class="cyber-card">
    <table class="layui-hide" id="supplier-table" lay-filter="supplier-table"></table>
  </div>

  <!-- 编辑表单 -->
  <form class="layui-form" lay-filter="supplier-form" id="supplier-form" action="" style="display: none">
    <div class="layui-form-item">
      <label class="layui-form-label">ID</label>
      <div class="layui-input-block">
        <input type="text" name="id" value="0" lay-verify="required" autocomplete="off" class="layui-input" disabled
          style="opacity: 0.5; cursor: not-allowed;" />
      </div>
    </div>
    <div class="layui-form-item">
      <label class="layui-form-label">供应商类型</label>
      <div class="layui-input-block">
        <select name="type_id" lay-verify="required" lay-search lay-filter="type_id">
          <option value="">请选择供应商类型</option>
        </select>
      </div>
    </div>
    <div class="layui-form-item">
      <label class="layui-form-label">供应商名称</label>
      <div class="layui-input-block">
        <input type="text" name="name" placeholder="请输入供应商名称" lay-verify="required" autocomplete="off"
          class="layui-input" />
      </div>
    </div>
    <div class="layui-form-item">
      <label class="layui-form-label">联系人</label>
      <div class="layui-input-block">
        <input type="text" name="contact_person" placeholder="请输入联系人" lay-verify="required" autocomplete="off"
          class="layui-input" />
      </div>
    </div>
    <div class="layui-form-item">
      <label class="layui-form-label">联系电话</label>
      <div class="layui-input-block">
        <input type="text" name="phone" placeholder="请输入联系电话" lay-verify="required" autocomplete="off"
          class="layui-input" />
      </div>
    </div>
    <div class="layui-form-item">
      <label class="layui-form-label">邮箱</label>
      <div class="layui-input-block">
        <input type="email" name="email" placeholder="请输入邮箱" autocomplete="off" class="layui-input" />
      </div>
    </div>
    <div class="layui-form-item">
      <label class="layui-form-label">开户行名称</label>
      <div class="layui-input-block">
        <input type="text" name="bank_name" placeholder="请输入开户行名称" lay-verify="required" autocomplete="off"
          class="layui-input" />
      </div>
    </div>
    <div class="layui-form-item">
      <label class="layui-form-label">银行账号</label>
      <div class="layui-input-block">
        <input type="text" name="account_number" placeholder="请输入银行账号" lay-verify="required" autocomplete="off"
          class="layui-input" />
      </div>
    </div>
    <div class="layui-form-item">
      <label class="layui-form-label">地址</label>
      <div class="layui-input-block">
        <textarea name="address" placeholder="请输入地址" class="layui-textarea"></textarea>
      </div>
    </div>
    <div class="layui-form-item">
      <label class="layui-form-label">备注</label>
      <div class="layui-input-block">
        <textarea name="remark" placeholder="请输入备注" class="layui-textarea"></textarea>
      </div>
    </div>
    <div class="layui-form-item" style="margin-top: 30px; text-align: right;">
      <button type="submit" class="layui-btn" lay-submit lay-filter="supplier-form-btn">立即提交</button>
      <button type="reset" class="layui-btn layui-btn-primary">重置</button>
    </div>
  </form>
</div>

<!-- 顶部工具栏模板 -->
<script type="text/html" id="supplier-toolbar">
    <div class="layui-btn-container">
      <button class="layui-btn layui-btn-sm" lay-event="supplier-toolbar-add">
        <i class="layui-icon layui-icon-add-1"></i> 新增供应商
      </button>
    </div>
  </script>

<!-- 行工具栏模板 -->
<script type="text/html" id="supplier-tool">
    <div class="layui-btn-container">
      <button class="layui-btn layui-btn-sm layui-bg-blue" lay-event="supplier-tool-edit">编辑</button>
      <button class="layui-btn layui-btn-sm layui-bg-red" lay-event="supplier-tool-del">删除</button>
      <button class="layui-btn layui-btn-sm layui-bg-orange" lay-event="supplier-tool-portal">门户</button>
    </div>
  </script>

<!-- 引入Layui JS: Removed! -->
<script>
  layui.use(["table", "form", "layer"], function () {
    var table = layui.table;
    var form = layui.form;
    var layer = layui.layer;
    var $ = layui.$;

    // 存储筛选条件
    var filterParams = {};

    // 字典数据缓存
    var supplierTypeMap = {};

    // 同步加载供应商类型字典 (ID=25)
    $.ajax({
      url: window.location.origin + "/api/v1/dictionary/detail/list",
      data: { dic_id: 25, limit: 100 },
      headers: { Authorization: "Bearer " + localStorage.getItem("access_token") },
      async: false,
      success: function (res) {
        if (res.code === 0 && res.data) {
          var optionsHtml = '<option value="">请选择供应商类型</option>';
          res.data.forEach(function (item) {
            supplierTypeMap[item.code] = item.value;
            optionsHtml += '<option value="' + item.code + '">' + item.value + '</option>';
          });
          // 填充下拉框
          $('select[name="type_id"]').html(optionsHtml);
          // form.render('select') 将在打开弹窗时或后续逻辑中调用，这里先确保 DOM 存在
        }
      }
    });

    // 供应商类型渲染模板
    function renderSupplierType(d) {
      if (!d.type_id) return '<span style="color: #666;">-</span>';
      var val = supplierTypeMap[d.type_id];
      return val ? '<span class="layui-badge layui-bg-blue" style="background: rgba(0, 229, 255, 0.15) !important; color: #00e5ff !important; border: 1px solid rgba(0, 229, 255, 0.3);">' + val + '</span>' : d.type_id;
    }

    // 渲染表格
    table.render({
      elem: "#supplier-table",
      id: "supplier-table",
      url: window.location.origin + "/api/v1/supplier/",
      height: 'full-40', // 自动适应高度
      toolbar: "#supplier-toolbar",
      page: {
        layout: ['limit', 'count', 'prev', 'page', 'next', 'skip'], // 自定义分页布局
        groups: 3
      },
      headers: {
        Authorization: "Bearer " + localStorage.getItem("access_token"),
      },
      defaultToolbar: ['filter', 'exports', 'print'],
      where: filterParams,
      skin: 'nob', // 无边框风格，配合我们的CSS
      cols: [
        [
          { field: "id", title: "ID", sort: true, width: 80, align: 'center' },
          { field: "type_id", title: "供应商类型", templet: renderSupplierType, width: 120, align: 'center' },
          { field: "name", title: "供应商名称", edit: 'text', minWidth: 200 },
          { field: "contact_person", title: "联系人", edit: 'text', width: 120 },
          { field: "phone", title: "联系电话", edit: 'text', width: 140 },
          { field: "bank_name", title: "开户行名称", edit: 'text', width: 180 },
          { field: "account_number", title: "银行账号", edit: 'text', width: 180 },
          { field: "remark", title: "备注", edit: 'text', minWidth: 150, hide: true },
          { field: "create_at", title: "创建时间", sort: true, width: 180, align: 'center', hide: true },
          { title: "操作", align: "center", toolbar: "#supplier-tool", width: 220 },
        ],
      ],
      done: function (res, curr, count) {
        addFilterInputs();
        // 应用暗色滚动条样式
        $('.layui-table-body').addClass('custom-scroll');
      }
    });

    // 同步列宽逻辑（保留原有的自动列宽逻辑）
    // ... (此处省略复杂的列宽计算逻辑，因为Layui本身支持width自适应，在暗色主题下简化处理) ...

    // 统一的表格重新加载
    function reloadTable(options) {
      options = options || {};
      var defaultOptions = {
        where: filterParams,
        done: function () {
          addFilterInputs();
        }
      };
      table.reload('supplier-table', $.extend({}, defaultOptions, options));
    }

    // 添加筛选输入框 (Enhanced)
    function addFilterInputs() {
      setTimeout(function () {
        var filterConfig = {
          'name': { type: 'text', placeholder: '🔍 搜名称', source: window.location.origin + "/api/v1/supplier/", labelField: 'name', valueField: 'name' },
          'contact_person': { type: 'text', placeholder: '🔍 搜联系人', source: window.location.origin + "/api/v1/supplier/", labelField: 'contact_person', valueField: 'contact_person', unique: true },
          'phone': { type: 'text', placeholder: '🔍 搜电话' },
          'bank_name': { type: 'text', placeholder: '🔍 搜开户行' }
        };

        Object.keys(filterConfig).forEach(function (field) {
          var $view = $('.layui-table-view[lay-id="supplier-table"]');
          var $th = $view.find('th[data-field="' + field + '"]');
          if ($th.length && !$th.find('.filter-input').length) {
            var config = filterConfig[field];
            var $filterDiv = $('<div class="filter-input-wrapper"></div>');
            var listId = config.source ? 'list-' + field : null;
            var listAttr = listId ? ' list="' + listId + '"' : '';

            var $input = $('<input type="' + config.type + '" class="layui-input filter-input" placeholder="' + config.placeholder + '" data-field="' + field + '"' + listAttr + ' style="height: 28px; line-height:28px; font-size: 12px; padding: 0 8px;">');

            if (filterParams[field]) $input.val(filterParams[field]);
            $filterDiv.append($input);

            // Autocomplete logic (Simplified)
            if (config.source) {
              var $datalist = $('<datalist id="' + listId + '"></datalist>');
              $filterDiv.append($datalist);
              $input.on('focus', function () {
                var $thisDatalist = $('#' + listId);
                if ($thisDatalist.children().length > 0) return;
                $.ajax({
                  url: config.source, type: 'GET', data: { limit: 100 },
                  headers: { Authorization: "Bearer " + localStorage.getItem("access_token") },
                  success: function (res) {
                    if (res.code === 0 && res.data) {
                      res.data.forEach(item => {
                        if (item[config.valueField])
                          $thisDatalist.append('<option value="' + item[config.valueField] + '">');
                      });
                    }
                  }
                });
              });
            }
            $th.append($filterDiv);
          }
        });
      }, 100);
    }

    // 监听表格筛选输入
    var filterTimer = null;
    $(document).on('input', '.filter-input', function () {
      var $input = $(this);
      var field = $input.data('field');
      var value = $input.val().trim();
      if (value) filterParams[field] = value;
      else delete filterParams[field];

      clearTimeout(filterTimer);
      filterTimer = setTimeout(function () {
        reloadTable({ page: { curr: 1 } });
      }, 4000);
    });

    // 工具栏事件
    table.on('toolbar(supplier-table)', function (obj) {
      if (obj.event === 'supplier-toolbar-add') {
        layer.closeAll();
        $("#supplier-form")[0].reset();
        $("#supplier-form input[name='id']").val(0);
        layer.open({
          type: 1,
          title: '<span style="color:#00e5ff; font-weight:bold;">新增供应商</span>',
          shade: 0, // Disable shade entirely to prevent freezing
          area: ["600px", "85%"],
          zIndex: 19891014, // Force high z-index
          content: $("#supplier-form"),
          success: function (layero, index) {
            // Force removal of any accidental shades and bring layer to front
            $(".layui-layer-shade").remove();
            layer.setTop(layero);
            form.render('select'); // 重新渲染下拉框
          }
        });
      }
    });

    // 行工具事件
    table.on('tool(supplier-table)', function (obj) {
      var data = obj.data;
      if (obj.event === 'supplier-tool-edit') {
        layer.closeAll();
        form.val("supplier-form", data);
        layer.open({
          type: 1,
          title: '<span style="color:#00e5ff; font-weight:bold;">编辑供应商</span>',
          shade: 0, // Disable shade entirely
          area: ["600px", "85%"],
          zIndex: 19891014,
          content: $("#supplier-form"),
          success: function (layero, index) {
            $(".layui-layer-shade").remove();
            layer.setTop(layero);
            form.render('select'); // 重新渲染下拉框
          }
        });
      } else if (obj.event === 'supplier-tool-del') {
        layer.confirm('<span style="color:#fff;">确定要删除这个供应商吗？</span>', {
          icon: 3,
          title: '警告',
          skin: 'layui-layer-molv',
          btn: ['确定', '取消']
        }, function (confirmIndex) {
          $.ajax({
            url: window.location.origin + `/api/v1/supplier/${data.id}`,
            type: "DELETE",
            contentType: "application/json",
            headers: { Authorization: "Bearer " + localStorage.getItem("access_token") },
            success: function (res) {
              if (res.code === 0) {
                layer.msg('删除成功', { icon: 1 });
                reloadTable();
              } else {
                layer.msg(res.msg || '删除失败', { icon: 2 });
              }
              layer.close(confirmIndex);
            }
          });
        });
      } else if (obj.event === 'supplier-tool-portal') {
        $.ajax({
          url: window.location.origin + `/api/v1/supplier/${data.id}/token`,
          type: "POST",
          headers: { Authorization: "Bearer " + localStorage.getItem("access_token") },
          success: function (res) {
            if (res.code === 0) {
              var fullUrl = window.location.origin + res.data.url;
              layer.open({
                title: '<span style="color:#7000ff; font-weight:bold;">门户访问链接 (Portal Link)</span>',
                skin: 'layui-layer-molv',
                content: `<div style="padding:20px; color:#fff;">
                    <p style="margin-bottom:10px; color:#94a3b8;">请复制以下链接发送给供应商：</p>
                    <input type="text" class="layui-input" value="${fullUrl}" id="portal-link-input" style="color:#00e5ff; border-color:#00e5ff;">
                  </div>`,
                btn: ['复制', '关闭'],
                yes: function (index) {
                  var input = document.getElementById('portal-link-input');
                  input.select();
                  document.execCommand("copy");
                  layer.msg('已复制到剪贴板', { icon: 1 });
                }
              });
            } else {
              layer.msg(res.msg || '获取失败', { icon: 2 });
            }
          }
        });
      }
    });

    // 单元格编辑
    table.on('edit(supplier-table)', function (obj) {
      var value = obj.value;
      var data = obj.data;
      var field = obj.field;
      var updateData = {};
      updateData[field] = value;
      updateData.id = data.id;

      $.ajax({
        url: window.location.origin + `/api/v1/supplier/${data.id}`,
        type: "PUT",
        contentType: "application/json",
        data: JSON.stringify(updateData),
        headers: { Authorization: "Bearer " + localStorage.getItem("access_token") },
        success: function (res) {
          if (res.code === 0) layer.msg('更新成功', { icon: 1, time: 1000 });
          else { layer.msg(res.msg, { icon: 2 }); reloadTable(); }
        }
      });
    });

    // 表单提交
    form.on("submit(supplier-form-btn)", function (data) {
      var field = data.field;
      var id = field.id;
      var type = (id == 0 || !id) ? "POST" : "PUT";
      var url = (id == 0 || !id) ? "/api/v1/supplier/" : `/api/v1/supplier/${id}`;
      if (field.id == 0) delete field.id;
      if (field.account_number) field.account_number = parseInt(field.account_number) || field.account_number;

      $.ajax({
        url: url,
        type: type,
        contentType: "application/json",
        data: JSON.stringify(field),
        headers: { Authorization: "Bearer " + localStorage.getItem("access_token") },
        success: function (res) {
          if (res.code === 0) {
            layer.msg(res.msg, { icon: 1 });
            layer.closeAll();
            reloadTable();
          } else {
            layer.msg(res.msg || '操作失败', { icon: 2 });
          }
        }
      });
      return false;
    });

  });
</script>
