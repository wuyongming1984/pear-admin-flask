<header class="sf-page-heading"><div><h1>供应商管理</h1><p>集中查看往来单位与联系信息</p></div></header>
<div id="supplier-page-root">
  <!-- 顶部工具栏 -->
  <div class="toolbar-container">
    <div class="toolbar-left">
      <div class="search-input-group">
        <i class="layui-icon layui-icon-search"></i>
        <input type="text" id="search-name" class="search-input" placeholder="搜索供应商名称..." autocomplete="off">
      </div>
      <div class="search-input-group">
        <i class="layui-icon layui-icon-username"></i>
        <input type="text" id="search-contact" class="search-input" placeholder="搜索联系人..." autocomplete="off">
      </div>
    </div>
    <div class="toolbar-right">
      <button class="btn-cyber" id="btn-add">
        <i class="layui-icon layui-icon-add-1"></i> 新增供应商
      </button>
    </div>
  </div>

  <!-- 卡片网格 -->
  <div class="card-grid" id="supplier-grid">
    <div class="loading-container">
      <i class="layui-icon layui-icon-loading layui-anim layui-anim-rotate layui-anim-loop"
        style="font-size: 30px;"></i>
      <p style="margin-top: 10px;">正在加载供应商...</p>
    </div>
  </div>

  <!-- 编辑表单 (隐藏) -->
  <form class="layui-form" lay-filter="supplier-form" id="supplier-form" action="" style="display: none">
    <div class="layui-form-item">
      <label class="layui-form-label">ID</label>
      <div class="layui-input-block">
        <input type="text" name="id" value="0" lay-verify="required" autocomplete="off" class="layui-input" disabled
          style="opacity: 0.5; cursor: not-allowed;" />
      </div>
    </div>
    <div class="layui-form-item">
      <label class="layui-form-label">供应商类型</label>
      <div class="layui-input-block">
        <select name="type_id" lay-verify="required" lay-search lay-filter="type_id">
          <option value="">请选择供应商类型</option>
        </select>
      </div>
    </div>
    <div class="layui-form-item">
      <label class="layui-form-label">供应商名称</label>
      <div class="layui-input-block">
        <input type="text" name="name" placeholder="请输入供应商名称" lay-verify="required" autocomplete="off"
          class="layui-input" />
      </div>
    </div>
    <div class="layui-form-item">
      <label class="layui-form-label">联系人</label>
      <div class="layui-input-block">
        <input type="text" name="contact_person" placeholder="请输入联系人" lay-verify="required" autocomplete="off"
          class="layui-input" />
        <div class="layui-word-aux" style="color: #ff4757 !important; font-size: 12px; margin-top: 4px;">
          <i class="layui-icon layui-icon-tips"></i> 谨慎修改，因为和订单中的供应商联系人关联
        </div>
      </div>
    </div>
    <div class="layui-form-item">
      <label class="layui-form-label">联系电话</label>
      <div class="layui-input-block">
        <input type="text" name="phone" placeholder="请输入联系电话" lay-verify="required" autocomplete="off"
          class="layui-input" />
      </div>
    </div>
    <div class="layui-form-item">
      <label class="layui-form-label">邮箱</label>
      <div class="layui-input-block">
        <input type="email" name="email" placeholder="请输入邮箱" autocomplete="off" class="layui-input" />
      </div>
    </div>
    <div class="layui-form-item">
      <label class="layui-form-label">开户行名称</label>
      <div class="layui-input-block">
        <input type="text" name="bank_name" placeholder="请输入开户行名称" lay-verify="required" autocomplete="off"
          class="layui-input" />
      </div>
    </div>
    <div class="layui-form-item">
      <label class="layui-form-label">银行账号</label>
      <div class="layui-input-block">
        <input type="text" name="account_number" placeholder="请输入银行账号" lay-verify="required" autocomplete="off"
          class="layui-input" />
      </div>
    </div>
    <div class="layui-form-item">
      <label class="layui-form-label">地址</label>
      <div class="layui-input-block">
        <textarea name="address" placeholder="请输入地址" class="layui-textarea"></textarea>
      </div>
    </div>
    <div class="layui-form-item">
      <label class="layui-form-label">备注</label>
      <div class="layui-input-block">
        <textarea name="remark" placeholder="请输入备注" class="layui-textarea"></textarea>
      </div>
    </div>
    <div class="layui-form-item" style="margin-top: 30px; text-align: right;">
      <button type="submit" class="layui-btn" lay-submit lay-filter="supplier-form-btn">立即提交</button>
      <button type="reset" class="layui-btn layui-btn-primary">重置</button>
    </div>
  </form>
</div>

<script>
  layui.use(["form", "layer", "jquery"], function () {
    var form = layui.form;
    var layer = layui.layer;
    var $ = layui.$;

    // 状态管理
    var allSuppliers = [];
    var supplierTypeMap = {};
    var searchParams = { name: '', contact: '' };

    // 初始化
    init();

    function init() {
      loadDictionaries();
      loadSuppliers();
      bindEvents();
    }

    // 加载字典
    function loadDictionaries() {
      $.ajax({
        url: window.location.origin + "/api/v1/dictionary/detail/list",
        data: { dic_id: 25, limit: 100 },
        headers: { Authorization: "Bearer " + localStorage.getItem("access_token") },
        success: function (res) {
          if (res.code === 0 && res.data) {
            var optionsHtml = '<option value="">请选择供应商类型</option>';
            res.data.forEach(function (item) {
              supplierTypeMap[item.code] = item.value;
              optionsHtml += '<option value="' + item.code + '">' + item.value + '</option>';
            });
            $('select[name="type_id"]').html(optionsHtml);
          }
        }
      });
    }

    // 加载供应商数据
    function loadSuppliers() {
      // 显示加载中
      // $('#supplier-grid').html('<div class="loading-container">...</div>');

      $.ajax({
        url: window.location.origin + "/api/v1/supplier/",
        type: "GET",
        data: { limit: 9999 }, // 获取所有，前端筛选
        headers: { Authorization: "Bearer " + localStorage.getItem("access_token") },
        success: function (res) {
          if (res.code === 0) {
            allSuppliers = res.data.sort((a, b) => b.id - a.id); // ID 倒序
            renderCards();
          } else {
            layer.msg("数据加载失败: " + res.msg, { icon: 2 });
          }
        },
        error: function () {
          layer.msg("网络请求失败", { icon: 2 });
        }
      });
    }

    // 渲染卡片
    function renderCards() {
      var filtered = allSuppliers.filter(s => {
        var matchName = !searchParams.name || (s.name && s.name.toLowerCase().includes(searchParams.name.toLowerCase()));
        var matchContact = !searchParams.contact || (s.contact_person && s.contact_person.toLowerCase().includes(searchParams.contact.toLowerCase()));
        return matchName && matchContact;
      });

      var $grid = $('#supplier-grid');
      $grid.empty();

      if (filtered.length === 0) {
        $grid.html('<div class="loading-container" style="color: var(--text-secondary);">暂无数据</div>');
        return;
      }

      filtered.forEach(s => {
        var typeName = supplierTypeMap[s.type_id] || '未知类型';
        var cardHtml = `
          <div class="supplier-card">
            <div class="card-header">
              <div style="flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0;">
                <!-- Row 1: Contact Person + Company Name -->
                <div style="display: flex; align-items: baseline; gap: 8px; min-width: 0;">
                  <span style="font-size: 18px; font-weight: bold; color: #fff; letter-spacing: 0.5px; white-space: nowrap;">${s.contact_person || '未命名'}</span>
                  <span style="font-size: 16px; color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;" title="${s.name || ''}">${s.name || '未命名供应商'}</span>
                </div>
                <!-- Row 2: Type Badge + ID -->
                <div style="display: flex; justify-content: space-between; align-items: center;">
                  <span class="card-type-badge">${typeName}</span>
                  <span style="font-family: 'JetBrains Mono'; opacity: 0.5; font-size: 12px;">#${s.id}</span>
                </div>
              </div>
            </div>
            <div class="card-body">
              <!-- Contact Person removed from body -->
              <div class="info-row">
                <i class="layui-icon layui-icon-cellphone"></i>
                <span>电话:</span>
                <span class="info-value">${s.phone || '-'}</span>
              </div>
              <div class="info-row">
                <i class="layui-icon layui-icon-list"></i>
                <span>银行:</span>
                <span class="info-value">${s.bank_name || '-'}</span>
              </div>
               <div class="info-row">
                <i class="layui-icon layui-icon-list"></i>
                <span>账户:</span>
                <span class="info-value">${s.account_number || '-'}</span>
              </div>
            </div>
            <div class="card-actions">
              <button class="action-btn portal" title="门户链接" onclick="openPortal(${s.id})">
                <i class="layui-icon layui-icon-link"></i>
              </button>
              <button class="action-btn edit" title="编辑" onclick="editSupplier(${s.id})">
                <i class="layui-icon layui-icon-edit"></i>
              </button>
              <button class="action-btn delete" title="删除" onclick="deleteSupplier(${s.id}, '${s.name}')">
                <i class="layui-icon layui-icon-delete"></i>
              </button>
            </div>
          </div>
        `;
        $grid.append(cardHtml);
      });
    }

    // 事件绑定
    function bindEvents() {
      // 搜索防抖
      var timer;
      $('#search-name, #search-contact').on('input', function () {
        var nameVal = $('#search-name').val().trim();
        var contactVal = $('#search-contact').val().trim();
        searchParams.name = nameVal;
        searchParams.contact = contactVal;

        clearTimeout(timer);
        timer = setTimeout(renderCards, 300);
      });

      // 新增按钮
      $('#btn-add').on('click', function () {
        openEditModal();
      });

      // 表单提交
      var formSubmitting = false;
      form.on("submit(supplier-form-btn)", function (data) {
        if (formSubmitting) return false;
        formSubmitting = true;
        $('[lay-filter="supplier-form-btn"]').prop('disabled', true).addClass('layui-btn-disabled');
        var field = data.field;
        var id = field.id;
        var type = (id == 0 || !id) ? "POST" : "PUT";
        var url = (id == 0 || !id) ? "/api/v1/supplier/" : `/api/v1/supplier/${id}`;

        if (field.id == 0) delete field.id;

        $.ajax({
          url: url,
          type: type,
          contentType: "application/json",
          data: JSON.stringify(field),
          headers: { Authorization: "Bearer " + localStorage.getItem("access_token") },
          complete: function () {
            formSubmitting = false;
            $('[lay-filter="supplier-form-btn"]').prop('disabled', false).removeClass('layui-btn-disabled');
          },
          success: function (res) {
            console.log("供应商更新响应:", res); // 调试日志
            if (res.code === 0) {
              layer.msg(res.msg, { icon: 1 });
              layer.closeAll();
              loadSuppliers(); // 重新加载数据
            } else if (res.code === 1001) {
              // 需要确认订单更新
              console.log("检测到关联订单，准备弹窗:", res.data); // 调试日志
              showOrderConfirmDialog(res.data, field, id);
            } else {
              layer.msg(res.msg || '操作失败', { icon: 2 });
            }
          },
          error: function (xhr, status, error) {
            console.error("请求失败:", xhr, status, error); // 调试日志
            layer.msg('网络请求失败', { icon: 2 });
          }
        });
        return false;
      });
    }

    // 显示订单确认对话框
    function showOrderConfirmDialog(data, supplierData, supplierId) {
      var orders = data.related_orders;
      var oldContact = data.old_contact_person;
      var newContact = data.new_contact_person;

      // 构建订单列表HTML
      var orderListHtml = '<div id="order-confirm-container" style="max-height: 400px; overflow-y: auto; padding: 10px;">';
      orderListHtml += `<p style="color: #fff; margin-bottom: 15px;">检测到 <b style="color: #00e5ff;">${orders.length}</b> 个订单使用联系人 "<b style="color: #ff4757;">${oldContact}</b>"</p>`;
      orderListHtml += `<p style="color: var(--text-secondary); margin-bottom: 20px;">是否将这些订单的联系人同步更新为 "<b style="color: #00e5ff;">${newContact}</b>"？</p>`;

      orderListHtml += '<div style="background: rgba(0,0,0,0.3); border-radius: 8px; padding: 15px;">';
      orders.forEach(function (order, index) {
        orderListHtml += `
          <div style="background: rgba(255,255,255,0.05); border: 1px solid var(--border-dim); border-radius: 6px; padding: 12px; margin-bottom: 10px; display: flex; gap: 12px;">
            <div style="flex-shrink: 0; padding-top: 2px;">
              <input type="checkbox" class="order-checkbox" data-order-id="${order.id}" id="order-check-${index}" style="width: 18px; height: 18px; cursor: pointer;">
            </div>
            <div style="flex: 1;">
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                <label for="order-check-${index}" style="color: #00e5ff; font-family: 'JetBrains Mono'; font-weight: bold; cursor: pointer;">${order.order_number}</label>
                <span style="color: #ffa502; font-family: 'JetBrains Mono';">¥${order.order_amount.toFixed(2)}</span>
              </div>
              <div style="color: var(--text-secondary); font-size: 12px;">
                <div>材料: ${order.material_name}</div>
                <div>项目: ${order.project_name}</div>
              </div>
            </div>
          </div>
        `;
      });
      orderListHtml += '</div>';
      orderListHtml += '<p style="color: #ff4757; margin-top: 15px; font-size: 12px;"><i class="layui-icon layui-icon-tips"></i> 必须勾选所有订单才能执行更新操作</p>';
      orderListHtml += '</div>';

      var confirmIndex = layer.confirm(orderListHtml, {
        title: '<span style="color:#00e5ff; font-weight:bold;"><i class="layui-icon layui-icon-tips"></i> 联系人变更确认</span>',
        skin: 'layui-layer-molv',
        area: ['650px', 'auto'],
        btn: ['<span id="confirm-btn-text">确认并更新所有订单 (0/' + orders.length + ')</span>', '取消'],
        btnAlign: 'c',
        yes: function (index) {
          // 检查是否所有订单都已勾选
          var checkedCount = $('#order-confirm-container .order-checkbox:checked').length;
          if (checkedCount !== orders.length) {
            layer.msg('请勾选所有订单后再确认', { icon: 0 });
            return false;
          }

          // 用户确认，调用批量更新接口
          var orderIds = orders.map(o => o.id);
          batchUpdateSupplierAndOrders(supplierId, supplierData, orderIds, index);
        },
        success: function (layero, index) {
          // 对话框打开后，绑定复选框变化事件
          $('#order-confirm-container .order-checkbox').on('change', function () {
            var checkedCount = $('#order-confirm-container .order-checkbox:checked').length;
            var totalCount = orders.length;

            // 更新按钮文本
            $('#confirm-btn-text').text(`确认并更新所有订单 (${checkedCount}/${totalCount})`);

            // 更新按钮状态
            var $confirmBtn = $(layero).find('.layui-layer-btn0');
            if (checkedCount === totalCount) {
              $confirmBtn.removeClass('layui-btn-disabled').css({
                'opacity': '1',
                'cursor': 'pointer'
              });
            } else {
              $confirmBtn.addClass('layui-btn-disabled').css({
                'opacity': '0.6',
                'cursor': 'not-allowed'
              });
            }
          });

          // 初始化按钮为禁用状态
          $(layero).find('.layui-layer-btn0').addClass('layui-btn-disabled').css({
            'opacity': '0.6',
            'cursor': 'not-allowed'
          });
        }
      });
    }

    // 批量更新供应商和订单
    function batchUpdateSupplierAndOrders(supplierId, supplierData, orderIds, layerIndex) {
      $.ajax({
        url: window.location.origin + `/api/v1/supplier/${supplierId}/update-with-orders`,
        type: "POST",
        contentType: "application/json",
        data: JSON.stringify({
          supplier_data: supplierData,
          confirmed_order_ids: orderIds
        }),
        headers: { Authorization: "Bearer " + localStorage.getItem("access_token") },
        success: function (res) {
          console.log("批量更新响应:", res); // 调试日志
          if (res.code === 0) {
            layer.msg(res.msg, { icon: 1 });
            layer.close(layerIndex);
            layer.closeAll();
            loadSuppliers();
          } else {
            layer.msg(res.msg || '批量更新失败', { icon: 2 });
          }
        },
        error: function (xhr, status, error) {
          console.error("批量更新请求失败:", xhr, status, error); // 调试日志
          layer.msg('网络请求失败', { icon: 2 });
        }
      });
    }

    // 暴露给全局的函数 (以便 onclick 调用)
    window.openPortal = function (id) {
      $.ajax({
        url: window.location.origin + `/api/v1/supplier/${id}/token`,
        type: "POST",
        headers: { Authorization: "Bearer " + localStorage.getItem("access_token") },
        success: function (res) {
          if (res.code === 0) {
            var fullUrl = window.location.origin + res.data.url;
            layer.open({
              title: '<span style="color:#7000ff; font-weight:bold;">门户访问链接</span>',
              skin: 'layui-layer-molv',
              content: `<div style="padding:20px; color:#fff;">
                    <p style="margin-bottom:10px; color:#94a3b8;">请复制以下链接发送给供应商：</p>
                    <input type="text" class="layui-input" value="${fullUrl}" id="portal-link-input" style="color:#00e5ff; border-color:#00e5ff;">
                  </div>`,
              btn: ['复制', '关闭'],
              yes: function (index) {
                var input = document.getElementById('portal-link-input');
                input.select();
                document.execCommand("copy");
                layer.msg('已复制到剪贴板', { icon: 1 });
              }
            });
          } else {
            layer.msg(res.msg || '获取失败', { icon: 2 });
          }
        }
      });
    };

    window.editSupplier = function (id) {
      var data = allSuppliers.find(s => s.id == id);
      if (data) {
        openEditModal(data);
      }
    };

    window.deleteSupplier = function (id, name) {
      layer.confirm(`<span style="color:#fff;">确定要删除供应商 <b style="color:#ff4757">${name}</b> 吗？</span>`, {
        icon: 3,
        title: '警告',
        skin: 'layui-layer-molv',
        btn: ['确定', '取消']
      }, function (confirmIndex) {
        $.ajax({
          url: window.location.origin + `/api/v1/supplier/${id}`,
          type: "DELETE",
          headers: { Authorization: "Bearer " + localStorage.getItem("access_token") },
          success: function (res) {
            if (res.code === 0) {
              layer.msg('删除成功', { icon: 1 });
              loadSuppliers();
            } else {
              layer.msg(res.msg || '删除失败', { icon: 2 });
            }
            layer.close(confirmIndex);
          }
        });
      });
    };

    function openEditModal(data) {
      $("#supplier-form")[0].reset();
      if (data) {
        form.val("supplier-form", data);
      } else {
        $("#supplier-form input[name='id']").val(0);
      }

      layer.open({
        type: 1,
        title: '<span style="color:#00e5ff; font-weight:bold;">' + (data ? '编辑供应商' : '新增供应商') + '</span>',
        shade: 0,
        area: ["600px", "85%"],
        zIndex: 19891014,
        content: $("#supplier-form"),
        success: function (layero, index) {
          $(".layui-layer-shade").remove();
          layer.setTop(layero);
          form.render('select');
        }
      });
    }

  });
</script>
